# MonitraNG SIEM — Prod FortiGate syslog port uyumluluk relay
# Kurulum: scripts/odak/install-prod-fortigate-syslog-relay.ps1 -Apply
#
# IT FortiGate varsayilan syslog portu (514/UDP) → MngEngine fortigate listener (541/UDP).
# Engine docker-compose: docker-compose.odak.prod.yml (UdpListeners 541/542).

module(load="imudp")

template(name="MonitraPlainForward" type="string" string="%msg%")

input(type="imudp" port="514" ruleset="rulesetFortigate514ToEngine")

ruleset(name="rulesetFortigate514ToEngine") {
  action(
    type="omfwd"
    target="ENGINE_HOST"
    port="ENGINE_PORT"
    protocol="udp"
    template="MonitraPlainForward"
  )
  stop
}
