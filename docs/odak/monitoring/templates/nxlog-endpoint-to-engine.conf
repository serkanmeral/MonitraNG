## NxLog — Windows Security (endpoint) → MonitraNG Engine (lab / pilot)
## Kurulum: domain-joined veya standalone Windows — WEC gerekmez
## Hedef: POST http://<engine>:5037/api/SecEvents/wec-batch
##
## Ortam (install-nxlog-endpoint.ps1 ile doldurulur):
##   MONITRA_ENGINE_URL = http://192.168.20.20:5037
##   MONITRA_SOURCE_HOST = TERMINAL.odak.local

define ENGINE_URL  %ENV{MONITRA_ENGINE_URL}
define SOURCE_HOST %ENV{MONITRA_SOURCE_HOST}

<Extension json>
    Module      xm_json
</Extension>

<Input security_dar>
    Module      im_msvistalog
    ## Yerel Security kanali — dar Event ID (U1/U2/U8–U10)
    Query       <QueryList>\
                  <Query Id="0">\
                    <Select Path="Security">\
                      *[System[(EventID=4624 or EventID=4625 or EventID=4740 or EventID=4720 or EventID=4728 or EventID=4732 or EventID=4771 or EventID=5136)]]\
                    </Select>\
                  </Query>\
                </QueryList>
    SavePos     TRUE
    ReadFromLast FALSE
</Input>

<Processor sec_to_batch_item>
    Module      pm_transformer
    Exec        $raw_json = to_json($Event);
    Exec        $receivedAt = $EventTime;
    Exec        $source_host = '%SOURCE_HOST%';
</Processor>

## MonitraNG batch: { "autoFlush": true, "items": [ { receivedAt, source, raw } ] }
## Tek-olay mini-batch (lab). Yüksek hacimde pm_batch veya Forward-WecEventsToEngine.ps1.

<Output engine_http>
    Module      om_http
    URL         %ENGINE_URL%/api/SecEvents/wec-batch
    ContentType application/json
    Body        {"autoFlush":true,"items":[{"receivedAt":"$receivedAt","source":{"type":"ad","product":"windows","host":"$source_host"},"raw":$raw_json}]}
</Output>

<Route endpoint_to_engine>
    Path        security_dar => sec_to_batch_item => engine_http
</Route>
