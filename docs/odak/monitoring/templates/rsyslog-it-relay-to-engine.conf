# MonitraNG SIEM — IT merkezi port relay → Engine syslog
# Kurulum: scripts/odak/install-it-syslog-relay-odak.ps1 -Apply
#
# IT NxLog / FortiGate sabit portları (UDP) dinlenir; payload değiştirilmeden Engine :5514'e iletilir.
# Odak: 1514/1541/1542 (Windows NxLog JSON), 541/542 (FortiGate syslog)

module(load="imudp")

template(name="MonitraPlainForward" type="string" string="%msg%")

# Windows NxLog (ham JSON UDP)
input(type="imudp" port="1514" ruleset="rulesetRelayToEngine")
input(type="imudp" port="1541" ruleset="rulesetRelayToEngine")
input(type="imudp" port="1542" ruleset="rulesetRelayToEngine")

# FortiGate syslog
input(type="imudp" port="541" ruleset="rulesetRelayToEngine")
input(type="imudp" port="542" ruleset="rulesetRelayToEngine")

ruleset(name="rulesetRelayToEngine") {
  action(
    type="omfwd"
    target="ENGINE_HOST"
    port="ENGINE_PORT"
    protocol="udp"
    template="MonitraPlainForward"
  )
  stop
}
