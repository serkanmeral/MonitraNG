# rsyslog — Linux auth (sshd/sudo) → MonitraNG MngEngine syslog
# Kurulum: /etc/rsyslog.d/50-monitrang-siem.conf
#
# Degiskenler (dosyada ENGINE_HOST / ENGINE_PORT ile degistirin):
#   Odak lab: 192.168.20.20:5514
#   Prod:     <Engine_IP>:514 (UDP) veya :514 TCP (asagidaki omfwd blogu)

# --- Pilot: UDP forward (lab) ---
# Yalnizca auth kanallari
auth,authpriv.* @@192.168.20.20:5514;RSYSLOG_ForwardFormat
& stop

# --- Prod onerisi: TCP + disk queue ---
# auth,authpriv.* action(
#   type="omfwd"
#   target="ENGINE_HOST"
#   port="514"
#   protocol="tcp"
#   queue.type="LinkedList"
#   queue.size="100000"
#   queue.dequeueBatchSize="4096"
#   action.resumeRetryCount="-1"
#   action.reportSuspension="on"
# )
# & stop

# Engine: sshd/sudo satirlarinda source.type=endpoint, product=linux-syslog (SecEventSyslogItemBuilder).
# Reactor parser: linux.auth.v1 → U1 login_failed korelasyon.
