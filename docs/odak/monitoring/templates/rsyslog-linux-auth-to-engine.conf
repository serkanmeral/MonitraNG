# MonitraNG Güvenlik Merkezi — Linux SSH log forward (rsyslog)
# Kurulum: /etc/rsyslog.d/51-monitrang-siem-journal-sshd.conf
#
# MONITRA_ENGINE_HOST ve port degerlerini MonitraNG proje ekibinden alin.
# Pilot: UDP 5514 · Prod: TCP 514 onerilir
#
# Debian 13+ / systemd: gercek sshd satirlari journald uzerinden gelir (sshd-session).
# Genis auth,authpriv.* forward KULLANMAYIN — journal gurultusu SIEM'i sisirir.
#
# 50-monitrang-siem.conf icin ornek:
#   # MonitraNG — genis auth forward yok. SSH: bu dosya.

module(load="imjournal" StateFile="/var/spool/rsyslog/imjournal.state")

if ($!_SYSTEMD_UNIT == "ssh.service" and ($!MESSAGE contains "Failed password" or $!MESSAGE contains "Accepted password")) then {
  action(type="omfwd" target="MONITRA_ENGINE_HOST" port="5514" protocol="udp")
  stop
}

