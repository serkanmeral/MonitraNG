## NxLog — WEC Forwarded Events → MonitraNG Engine (başlangıç şablonu)
## Kurulum: WEC Windows Server — NxLog CE/EE
## Hedef: POST http://<engine>:5037/api/SecEvents/wec-batch
##
## Ortam değişkenleri (önerilen):
##   MONITRA_ENGINE_URL = http://192.168.20.20:5037
##   MONITRA_WEC_HOST   = WEC01.odak.local

define ENGINE_URL  %ENV{MONITRA_ENGINE_URL}
define WEC_HOST    %ENV{MONITRA_WEC_HOST}

<Extension json>
    Module      xm_json
</Extension>

<Input wec_forwarded>
    Module      im_msvistalog
    ## Forwarded Events kanalı (WEC)
    Query       <QueryList>\
                  <Query Id="0">\
                    <Select Path="ForwardedEvents">\
                      *[System[(EventID=4624 or EventID=4625 or EventID=4740 or EventID=4720 or EventID=4728 or EventID=4732 or EventID=4771)]]\
                    </Select>\
                  </Query>\
                </QueryList>
    SavePos     TRUE
    ReadFromLast FALSE
</Input>

<Processor wec_to_batch_item>
    Module      pm_transformer
    ## MonitraNG wec-batch item — ham Event alanları JSON olarak raw'a gider
    Exec        $raw_json = to_json($Event);
    Exec        $receivedAt = $EventTime;
    Exec        $source_host = '%WEC_HOST%';
</Processor>

## Not: MonitraNG batch formatı { "autoFlush": true, "items": [ { receivedAt, source, raw } ] }
## NxLog om_http tek olay gönderir; production için:
##   - pm_batch ile N saniyede veya N olayda birleştirme, veya
##   - scripts/wef/Forward-WecEventsToEngine.ps1 (PowerShell) kullanın (MVP pilot)

<Output engine_http>
    Module      om_http
    URL         %ENGINE_URL%/api/SecEvents/wec-batch
    ContentType application/json
    ## Basit POC — tek olaylı mini-batch (lab); batch birleştirme için PowerShell forwarder tercih edin
    Body        {"autoFlush":true,"items":[{"receivedAt":"$receivedAt","source":{"type":"ad","product":"windows","host":"$source_host"},"raw":$raw_json}]}
</Output>

<Route wec_to_engine>
    Path        wec_forwarded => wec_to_batch_item => engine_http
</Route>
