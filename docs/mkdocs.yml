site_name: MonitraNG Documentation
site_description: Multi-Tenant IoT Monitoring Platform Documentation
site_author: MonitraNG
site_url: https://docs.monitrang.com

# Version info (can be overridden by CI/CD)
# CI/CD will inject version info during build
site_version: "latest"

# Build output directory (relative to mkdocs.yml location)
# mkdocs.yml is now in docs/ folder
site_dir: site

# Documentation directory (relative to mkdocs.yml location)
# MkDocs default is 'docs' folder, but since mkdocs.yml is in docs/, we use current directory
# However, MkDocs doesn't allow docs_dir to be the same as config file directory
# So we create a subdirectory for documentation content
docs_dir: content

# Repository
repo_name: root/MonitraNG
repo_url: https://gitlab.monitrang.com/root/MonitraNG
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search:
      lang: en
  - swagger-ui-tag
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

# Navigation
nav:
  - Home: index.md
  # - Getting Started:
  #   - user-guide/getting-started.md
  #   - user-guide/installation.md
  #   - user-guide/configuration.md
  # - User Guide:
  #   - user-guide/datasets.md
  #   - user-guide/authentication.md
  #   - user-guide/api-usage.md
  - API Documentation:
      - api/overview.md
      - MngKeeper:
          - api/mngkeeper/index.md
          - api/mngkeeper/openapi.json
      - MngDataGateway:
          - api/mngdatagateway/index.md
          - api/mngdatagateway/openapi.json
      - MngHub:
          - api/mnghub/index.md
          - api/mnghub/openapi.json
  - Services:
      - MngKeeper:
          - Architecture: MngKeeper/architecture/ARCHITECTURE_GUIDE.md
          - Guides: MngKeeper/guides/GATEWAY_INTEGRATION.md
          - Changelog: MngKeeper/changelog/CHANGELOG.md
      - MngDataGateway:
          - Architecture: MngDataGateway/architecture/ARCHITECTURE_GUIDE.md
          - Guides: MngDataGateway/guides/GATEWAY_INTEGRATION.md
          - API: MngDataGateway/api/API_VERSIONING.md
      - MngHub:
          - Architecture: MngHub/architecture/ARCHITECTURE_PLAN.md
          - Guides: MngHub/guides/GATEWAY_INTEGRATION.md
      - Mng.Ui:
          - Docker Deployment: Mng.Ui/guides/DOCKER_DEPLOYMENT.md
          - Gateway Integration: Mng.Ui/guides/GATEWAY_INTEGRATION.md
  - DevOps:
      - CI/CD: cicd/current_status.md
      - DevOps Roadmap: devops-roadmap.md

