# ============================================
# OPENAPI EXTRACT STAGE
# ============================================

# ============================================
# OPENAPI EXTRACTION STAGE
# ============================================

# Extract OpenAPI specs from built services using Swashbuckle
# This job extracts OpenAPI specs directly from built assemblies
extract-openapi-specs:
  stage: openapi-extract
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  # Dependencies removed - artifacts optional, building locally instead
  before_script:
    - |
      for i in {1..3}; do
        echo "apt-get update attempt $i/3..."
        if apt-get update && apt-get install -y curl jq; then
          echo "apt-get succeeded on attempt $i"
          break
        else
          if [ $i -eq 3 ]; then
            echo "apt-get failed after 3 attempts, continuing anyway..."
          else
            echo "apt-get failed, waiting 5 seconds before retry..."
            sleep 5
          fi
        fi
      done || true
    - |
      # Install Swashbuckle CLI tool for OpenAPI extraction (with retry)
      for i in {1..3}; do
        echo "Swashbuckle install attempt $i/3..."
        if dotnet tool install -g Swashbuckle.AspNetCore.Cli || dotnet tool update -g Swashbuckle.AspNetCore.Cli; then
          echo "Swashbuckle install succeeded on attempt $i"
          break
        else
          if [ $i -eq 3 ]; then
            echo "Swashbuckle install failed after 3 attempts, continuing anyway..."
          else
            echo "Swashbuckle install failed, waiting 10 seconds before retry..."
            sleep 10
          fi
        fi
      done || true
  script:
    - echo "=== Building services for OpenAPI extraction ==="
    - echo "Building MngKeeper..."
    - |
      for i in {1..3}; do
        echo "Restore attempt $i/3..."
        if dotnet restore MngKeeper/MngKeeper.sln --verbosity normal; then
          echo "Restore succeeded on attempt $i"
          break
        else
          if [ $i -eq 3 ]; then
            echo "Restore failed after 3 attempts"
            exit 1
          fi
          echo "Restore failed, waiting 10 seconds before retry..."
          sleep 10
        fi
      done
    - dotnet build MngKeeper/MngKeeper.sln --no-restore -c Release --verbosity normal
    - echo "Building MngDataGateway..."
    - |
      for i in {1..3}; do
        echo "Restore attempt $i/3..."
        if dotnet restore MngDataGateway/MngDataGateway.sln --verbosity normal; then
          echo "Restore succeeded on attempt $i"
          break
        else
          if [ $i -eq 3 ]; then
            echo "Restore failed after 3 attempts"
            exit 1
          fi
          echo "Restore failed, waiting 10 seconds before retry..."
          sleep 10
        fi
      done
    - dotnet build MngDataGateway/MngDataGateway.sln -c Release --verbosity normal
    - echo "Building MngGateway..."
    - |
      for i in {1..3}; do
        echo "Restore attempt $i/3..."
        if dotnet restore MngGateway/MngGateway.sln --verbosity normal; then
          echo "Restore succeeded on attempt $i"
          break
        else
          if [ $i -eq 3 ]; then
            echo "Restore failed after 3 attempts"
            exit 1
          fi
          echo "Restore failed, waiting 10 seconds before retry..."
          sleep 10
        fi
      done
    - dotnet build MngGateway/MngGateway.sln --no-restore -c Release --verbosity normal
    - echo "=== Extracting OpenAPI specs from built services ==="
    - |
      # Create output directories
      mkdir -p docs/content/api/mngkeeper
      mkdir -p docs/content/api/mngdatagateway
      mkdir -p docs/content/api/mnghub
      mkdir -p docs/content/api/mnggateway
      
      # Method 1: Extract from built assemblies using Swashbuckle CLI
      # Find API project DLLs
      KEEPER_DLL=$(find MngKeeper -name "*.Api.dll" -path "*/bin/Release/*" | head -1)
      DATAGATEWAY_DLL=$(find MngDataGateway -name "*.Api.dll" -path "*/bin/Release/*" | head -1)
      GATEWAY_DLL=$(find MngGateway -name "*.Api.dll" -path "*/bin/Release/*" | head -1)
      
      # Extract MngKeeper spec
      if [ -n "$KEEPER_DLL" ]; then
        echo "Extracting MngKeeper OpenAPI spec from $KEEPER_DLL"
        swashbuckle aspnetcore tofile "$KEEPER_DLL" "v1" docs/content/api/mngkeeper/openapi.json || {
          echo "Swashbuckle extraction failed, trying alternative method..."
          # Fallback: Create placeholder with metadata
          echo '{"info":{"title":"MngKeeper API","version":"v1","description":"OpenAPI spec - extraction pending"}}' > docs/content/api/mngkeeper/openapi.json
        }
      else
        echo "MngKeeper API DLL not found, creating placeholder"
        echo '{"info":{"title":"MngKeeper API","version":"v1","description":"OpenAPI spec - build artifact not found"}}' > docs/content/api/mngkeeper/openapi.json
      fi
      
      # Extract MngDataGateway spec
      if [ -n "$DATAGATEWAY_DLL" ]; then
        echo "Extracting MngDataGateway OpenAPI spec from $DATAGATEWAY_DLL"
        swashbuckle aspnetcore tofile "$DATAGATEWAY_DLL" "v1.0" docs/content/api/mngdatagateway/openapi.json || {
          echo "Swashbuckle extraction failed, trying v1..."
          swashbuckle aspnetcore tofile "$DATAGATEWAY_DLL" "v1" docs/content/api/mngdatagateway/openapi.json || {
            echo "Swashbuckle extraction failed, creating placeholder"
            echo '{"info":{"title":"MngDataGateway API","version":"v1.0","description":"OpenAPI spec - extraction pending"}}' > docs/content/api/mngdatagateway/openapi.json
          }
        }
      else
        echo "MngDataGateway API DLL not found, creating placeholder"
        echo '{"info":{"title":"MngDataGateway API","version":"v1.0","description":"OpenAPI spec - build artifact not found"}}' > docs/content/api/mngdatagateway/openapi.json
      fi
      
      # MngHub placeholder (if needed)
      echo '{"info":{"title":"MngHub API","version":"v1","description":"OpenAPI spec - not yet available"}}' > docs/content/api/mnghub/openapi.json
      
      # Extract MngGateway spec
      if [ -n "$GATEWAY_DLL" ]; then
        echo "Extracting MngGateway OpenAPI spec from $GATEWAY_DLL"
        swashbuckle aspnetcore tofile "$GATEWAY_DLL" "v1" docs/content/api/mnggateway/openapi.json || {
          echo "Swashbuckle extraction failed, trying alternative method..."
          # Fallback: Create placeholder with metadata
          echo '{"info":{"title":"MngGateway API","version":"v1","description":"OpenAPI spec - extraction pending"}}' > docs/content/api/mnggateway/openapi.json
        }
      else
        echo "MngGateway API DLL not found, creating placeholder"
        echo '{"info":{"title":"MngGateway API","version":"v1","description":"OpenAPI spec - build artifact not found"}}' > docs/content/api/mnggateway/openapi.json
      fi
      
      echo "=== OpenAPI spec extraction completed ==="
      echo "Files created:"
      ls -la docs/content/api/*/
  artifacts:
    paths:
      - docs/content/api/
    expire_in: 1 day
  cache:
    key: openapi-specs-$CI_COMMIT_REF_SLUG
    paths:
      - docs/content/api/
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]|\[ci skip\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID
  # Note: If Swashbuckle CLI doesn't work, we can fall back to:
  # 1. Running services temporarily and extracting via HTTP
  # 2. Pre-generated spec files in repository
  # 3. Manual extraction script

# ============================================
# DOCKER BUILD STAGE
# ============================================

# Frontend (Mng.Ui) Docker Build
build-docker-ui:
  stage: build-docker
  image: docker:latest
  tags:
    - docker
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  before_script:
    - docker info
  script:
    - echo "Building Mng.Ui Docker image..."
    - cd Mng.Ui
    - docker build -t mngui:$CI_COMMIT_SHORT_SHA -t mngui:latest -f Dockerfile .
    - echo "Docker image built successfully"
    - docker images | grep mngui
  artifacts:
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]|\[ci skip\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID
  # Not: Runner'ın privileged mode'da olması ve Docker socket mount edilmesi gerekiyor

# MngGateway Docker Build
build-docker-gateway:
  stage: build-docker
  image: docker:latest
  tags:
    - docker
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  # Dependencies removed - Docker build uses source code, not artifacts
  before_script:
    - docker info
  script:
    - echo "Building MngGateway Docker image..."
    - cd MngGateway
    - docker build -t mnggateway:$CI_COMMIT_SHORT_SHA -t mnggateway:latest -f Presentation/MngGateway.Api/Dockerfile .
    - echo "Docker image built successfully"
    - docker images | grep mnggateway
  artifacts:
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]|\[ci skip\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID
  # Not: Runner'ın privileged mode'da olması ve Docker socket mount edilmesi gerekiyor

# ============================================
# DOCUMENTATION VALIDATION STAGE
# ============================================

# Validate documentation quality (links, linting, spelling)
validate-docs:
  stage: validate-docs
  image: node:18
  tags:
    - docker
  before_script:
    - npm install -g markdown-link-check@latest markdownlint-cli2@latest
  script:
    - echo "=== Validating documentation quality ==="
    - |
      # Markdown linting
      echo "Running markdown linting..."
      markdownlint-cli2 "docs/content/**/*.md" "!docs/content/**/node_modules/**" || {
        echo "WARNING: Markdown linting found issues (non-blocking)"
        exit 0  # Non-blocking, just warn
      }
    - |
      # Link checking (internal links only, external links can be flaky)
      echo "Checking internal links..."
      find docs/content -name "*.md" -type f | while read file; do
        echo "Checking links in: $file"
        markdown-link-check "$file" --config '{"timeout": "10s", "retryOn429": true, "retryCount": 3}' || true
      done
    - echo "=== Documentation validation completed ==="
  allow_failure: true  # Don't block pipeline on validation failures
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]|\[ci skip\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID
  cache:
    key: validate-docs-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/

# ============================================
# DOCS DEPLOYMENT STAGE
# ============================================

# MkDocs Build and Deploy to GitLab Pages
deploy-docs:
  stage: deploy-docs
  image: python:3.11
  tags:
    - docker
  dependencies:
    - extract-openapi-specs
  variables:
    PIP_CACHE_DIR: .pip-cache
  before_script:
    - python --version
    - pip --version
    - |
      # Incremental build: Check if documentation files changed
      if [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        CHANGED_FILES=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA | grep -E "docs/(content|mkdocs\.yml|requirements\.txt)" || true)
        if [ -z "$CHANGED_FILES" ]; then
          echo "No documentation changes detected. Skipping build."
          echo "CHANGED_FILES_EMPTY=true" >> .env
          exit 0
        else
          echo "Documentation changes detected:"
          echo "$CHANGED_FILES"
          echo "CHANGED_FILES_EMPTY=false" >> .env
        fi
      else
        echo "First commit or no previous commit, building all documentation"
        echo "CHANGED_FILES_EMPTY=false" >> .env
      fi
  script:
    - |
      # Check if we should skip build
      if [ -f .env ] && grep -q "CHANGED_FILES_EMPTY=true" .env; then
        echo "Skipping documentation build (no changes)"
        mkdir -p docs/site
        echo "<html><body>No changes in this commit</body></html>" > docs/site/index.html
        exit 0
      fi
    - echo "=== Building documentation with MkDocs ==="
    - cd docs
    - |
      # Install dependencies with cache (with retry)
      echo "Installing pip packages (with retry)..."
      for i in {1..3}; do
        echo "pip install attempt $i/3..."
        if pip install --cache-dir ../.pip-cache -r requirements.txt; then
          echo "pip install succeeded on attempt $i"
          break
        else
          if [ $i -eq 3 ]; then
            echo "pip install failed after 3 attempts"
            exit 1
          fi
          echo "pip install failed, waiting 10 seconds before retry..."
          sleep 10
        fi
      done
    - |
      # Build documentation
      echo "Building MkDocs site..."
      mkdocs build --verbose
    - |
      # Verify build output
      echo "=== Verifying build output ==="
      ls -la site/
      echo "Build completed successfully!"
      echo "Site size:"
      du -sh site/
    - cd ..
  after_script:
    - |
      # Build notifications
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        echo "❌ Documentation build failed!"
        echo "Pipeline: $CI_PIPELINE_URL"
        echo "Job: $CI_JOB_URL"
        # Slack/Teams notification can be added here
        # curl -X POST $SLACK_WEBHOOK_URL -d "{\"text\":\"❌ Docs build failed: $CI_PIPELINE_URL\"}"
      elif [ "$CI_JOB_STATUS" == "success" ]; then
        echo "✅ Documentation build succeeded!"
        echo "Pipeline: $CI_PIPELINE_URL"
      fi
  artifacts:
    paths:
      - docs/site/
    expire_in: 1 day
  cache:
    key: mkdocs-deps-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/
      - docs/.cache/
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]|\[ci skip\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  # Build timeout
  timeout: 15m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
  # GitLab Pages için pages job'u özel bir isim olmalı
  # Bu job'u "pages" olarak adlandırırsak GitLab otomatik deploy eder

# Preview Deployment for Merge Requests
# Deploys documentation preview for each MR
deploy-docs-preview:
  stage: deploy-docs
  image: python:3.11
  tags:
    - docker
  dependencies:
    - extract-openapi-specs
  variables:
    PIP_CACHE_DIR: .pip-cache
  before_script:
    - python --version
    - pip --version
  script:
    - echo "=== Building preview documentation for MR ==="
    - cd docs
    - |
      echo "Installing pip packages (with retry)..."
      for i in {1..3}; do
        echo "pip install attempt $i/3..."
        if pip install --cache-dir ../.pip-cache -r requirements.txt; then
          echo "pip install succeeded on attempt $i"
          break
        else
          if [ $i -eq 3 ]; then
            echo "pip install failed after 3 attempts"
            exit 1
          fi
          echo "pip install failed, waiting 10 seconds before retry..."
          sleep 10
        fi
      done
    - mkdocs build --verbose
    - cd ..
  artifacts:
    paths:
      - docs/site/
    expire_in: 7 days  # Preview artifacts last longer
  cache:
    key: mkdocs-deps-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/
      - docs/.cache/
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]|\[ci skip\]/i
      when: never
    - if: $CI_MERGE_REQUEST_IID
  environment:
    name: docs-preview/mr-$CI_MERGE_REQUEST_IID
    url: https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME/-/docs-preview/mr-$CI_MERGE_REQUEST_IID
    auto_stop_in: 7 days
  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        echo "❌ Preview documentation build failed for MR #$CI_MERGE_REQUEST_IID"
      elif [ "$CI_JOB_STATUS" == "success" ]; then
        echo "✅ Preview documentation ready for MR #$CI_MERGE_REQUEST_IID"
        echo "Preview URL: https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME/-/docs-preview/mr-$CI_MERGE_REQUEST_IID"
      fi

# GitLab Pages Deployment (otomatik)
# Not: pages job'u özel bir isimdir ve GitLab otomatik olarak Pages'e deploy eder
pages:
  stage: deploy-docs
  image: python:3.11
  tags:
    - docker
  needs:
    - deploy-docs
  dependencies:
    - deploy-docs
  variables:
    PIP_CACHE_DIR: .pip-cache
  script:
    - echo "=== Deploying to GitLab Pages ==="
    - echo "Checking for docs/site directory..."
    - |
      if [ ! -d "docs/site" ]; then
        echo "WARNING: docs/site directory not found. deploy-docs job may have failed."
        echo "Building documentation as fallback..."
        cd docs
        echo "Installing pip packages (with retry)..."
        for i in {1..3}; do
          echo "pip install attempt $i/3..."
          if pip install --cache-dir ../.pip-cache -r requirements.txt; then
            echo "pip install succeeded on attempt $i"
            break
          else
            if [ $i -eq 3 ]; then
              echo "pip install failed after 3 attempts"
              exit 1
            fi
            echo "pip install failed, waiting 10 seconds before retry..."
            sleep 10
          fi
        done
        mkdocs build --verbose
        cd ..
        
        if [ ! -d "docs/site" ]; then
          echo "ERROR: Failed to build documentation. Exiting."
          exit 1
        fi
      fi
    - |
      # Verify site structure
      echo "=== Verifying site structure ==="
      ls -la docs/site/
      echo "Site contains $(find docs/site -type f | wc -l) files"
    - |
      # Copy to public directory (GitLab Pages requirement)
      echo "=== Copying to public directory ==="
      mkdir -p public
      cp -r docs/site/* public/
      echo "Files copied successfully"
      # Gereksiz dosyaları temizle (artifacts size'ı küçültmek için)
      echo "Cleaning up unnecessary files to reduce artifacts size..."
      # Source map dosyaları
      find public -name "*.map" -type f -delete 2>/dev/null || true
      # Log dosyaları
      find public -name "*.log" -type f -delete 2>/dev/null || true
      # Cache klasörleri
      find public -type d -name ".cache" -exec rm -rf {} + 2>/dev/null || true
      find public -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      # Compressed dosyalar (gzip, brotli - bunlar zaten tarayıcı tarafından oluşturulabilir)
      find public -name "*.gz" -type f -delete 2>/dev/null || true
      find public -name "*.br" -type f -delete 2>/dev/null || true
      find public -name "*.bz2" -type f -delete 2>/dev/null || true
      # Temporary dosyalar
      find public -name "*.tmp" -type f -delete 2>/dev/null || true
      find public -name "*.temp" -type f -delete 2>/dev/null || true
      find public -name "*.swp" -type f -delete 2>/dev/null || true
      find public -name "*.swo" -type f -delete 2>/dev/null || true
      # Python cache
      find public -name "*.pyc" -type f -delete 2>/dev/null || true
      find public -name "*.pyo" -type f -delete 2>/dev/null || true
      # Node modules (eğer varsa)
      find public -type d -name "node_modules" -exec rm -rf {} + 2>/dev/null || true
      # Sitemap compressed dosyaları (sitemap.xml.gz gibi - bunlar gereksiz)
      find public -name "sitemap.xml.gz" -type f -delete 2>/dev/null || true
      find public -name "sitemap.xml.bz2" -type f -delete 2>/dev/null || true
      find public -name "sitemap.xml.br" -type f -delete 2>/dev/null || true
      # Büyük dosyaları bul ve listele (debug için)
      echo "=== Large files analysis ==="
      find public -type f -size +100k -exec ls -lh {} \; 2>/dev/null | head -30 || true
      
      # Agresif temizleme - 100KB'dan büyük tüm asset dosyalarını sil
      echo "Removing large asset files (>100KB)..."
      find public/assets -type f -size +100k -delete 2>/dev/null || true
      
      # Search index dosyasını agresif optimize et
      if [ -f "public/search/search_index.json" ]; then
        SEARCH_SIZE=$(du -k public/search/search_index.json | cut -f1)
        echo "Search index size: ${SEARCH_SIZE}KB"
        if [ "$SEARCH_SIZE" -gt 300 ]; then
          echo "Search index is large (${SEARCH_SIZE}KB), optimizing..."
          # Search index'i küçült - sadece temel alanları tut
          if command -v jq >/dev/null 2>&1; then
            jq '{
              config: .config,
              docs: [.docs[] | {
                location: .location,
                title: .title,
                text: (.text | .[0:500])  # İlk 500 karakter
              }]
            }' public/search/search_index.json > public/search/search_index.json.tmp 2>/dev/null && \
            mv public/search/search_index.json.tmp public/search/search_index.json 2>/dev/null || true
          else
            # jq yoksa, search index'i basitçe küçült
            head -c 500000 public/search/search_index.json > public/search/search_index.json.tmp 2>/dev/null && \
            mv public/search/search_index.json.tmp public/search/search_index.json 2>/dev/null || true
          fi
          echo "Search index optimized"
        fi
      fi
      
      # Tüm büyük dosyaları tekrar kontrol et ve sil (genel temizlik)
      echo "Final cleanup - removing any remaining large files (>150KB)..."
      find public -type f -size +150k -not -name "index.html" -delete 2>/dev/null || true
      echo "Cleanup completed"
      echo "After cleanup - Total files: $(find public -type f | wc -l)"
      echo "After cleanup - Total size: $(du -sh public | cut -f1)"
      # Dosya boyutlarını detaylı göster
      echo "=== File size distribution ==="
      du -h public | sort -rh | head -20 || true
      echo "Public directory contains:"
      ls -la public/ | head -20
      echo ""
      echo "=== Verifying Pages requirements ==="
      # Check for index.html in public/ or any subdirectory
      if [ ! -f "public/index.html" ]; then
        echo "WARNING: public/index.html not found in root, searching subdirectories..."
        INDEX_FILE=$(find public -name "index.html" -type f | head -1)
        if [ -n "$INDEX_FILE" ]; then
          echo "Found index.html at: $INDEX_FILE"
          echo "Copying to public/index.html..."
          cp "$INDEX_FILE" public/index.html
          echo "✓ public/index.html created from $INDEX_FILE"
        else
          echo "ERROR: No index.html found anywhere in public/ directory!"
          echo "Available files in public/:"
          find public -type f | head -10
          echo "Creating minimal index.html..."
          echo "<!DOCTYPE html><html><head><title>MonitraNG Documentation</title><meta http-equiv='refresh' content='0; url=./MkDocs/guides/IMPROVEMENTS_ROADMAP.html' /></head><body><p>Redirecting to <a href='./MkDocs/guides/IMPROVEMENTS_ROADMAP.html'>documentation</a>...</p></body></html>" > public/index.html
          echo "✓ Minimal index.html created"
        fi
      else
        echo "✓ public/index.html exists in root"
      fi
      echo "Total files in public/: $(find public -type f | wc -l)"
      echo "Public directory size: $(du -sh public | cut -f1)"
      # Boyut kontrolü - eğer çok büyükse uyar ve büyük dosyaları listele
      SIZE_MB=$(du -sm public | cut -f1)
      if [ "$SIZE_MB" -gt 5 ]; then
        echo "WARNING: Public directory size is ${SIZE_MB}MB, which may be too large for GitLab Pages"
        echo "GitLab CE default artifact size limit is usually 5MB"
        echo "Consider:"
        echo "  1. Increasing artifact size limit in GitLab config"
        echo "  2. Further file optimization"
        echo "  3. Removing large asset files"
        echo ""
        echo "Top 20 largest files:"
        find public -type f -exec ls -lh {} \; 2>/dev/null | sort -k5 -rh | head -20 || true
      fi
    - |
      # Add version info if available
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Documentation version: $CI_COMMIT_TAG" > public/VERSION.txt
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        echo "Documentation commit: $CI_COMMIT_SHORT_SHA" > public/VERSION.txt
        echo "Branch: $CI_COMMIT_REF_NAME" >> public/VERSION.txt
      fi
  after_script:
    - |
      # Build notifications for Pages deployment
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        echo "❌ GitLab Pages deployment failed!"
        echo "Pipeline: $CI_PIPELINE_URL"
        # Slack/Teams notification can be added here
        # curl -X POST $SLACK_WEBHOOK_URL -d "{\"text\":\"❌ Pages deploy failed: $CI_PIPELINE_URL\"}"
      elif [ "$CI_JOB_STATUS" == "success" ]; then
        echo "✅ GitLab Pages deployed successfully!"
        echo "Pages URL: https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME"
      fi
  artifacts:
    paths:
      - public
    exclude:
      # Gereksiz dosyaları hariç tut (cache, log, vb.)
      - public/**/*.map
      - public/**/*.log
      - public/**/*.gz
      - public/**/*.br
      - public/**/*.bz2
      - public/**/*.tmp
      - public/**/*.temp
      - public/**/*.swp
      - public/**/*.swo
      - public/**/*.pyc
      - public/**/*.pyo
      - public/.cache/
      - public/**/__pycache__/
      - public/**/node_modules/
    expire_in: 30 days  # Pages artifacts should last longer
    # GitLab Pages için public/ klasörü artifacts olarak yayınlanmalı
    # GitLab otomatik olarak pages job'unun artifacts'ını Pages'e deploy eder
    # Not: Artifacts size limit'i varsa, gereksiz dosyaları exclude ediyoruz
  cache:
    key: mkdocs-deps-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]|\[ci skip\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  # GitLab Pages için özel gereksinimler:
  # 1. Job adı "pages" olmalı (✓)
  # 2. artifacts.paths "public" içermeli (✓)
  # 3. public/ klasöründe index.html olmalı (✓)
  # 4. GitLab CE'de Pages özelliği aktif olmalı (Settings > General > Visibility)
  # 5. Pages URL: http://<gitlab-host>/<namespace>/<project-name>/-/pages
  #    veya: https://<namespace>.gitlab.io/<project-name>/
  timeout: 10m


# ============================================
# DEPLOYMENT STAGE
# ============================================

# Deployment job - Remote server'a deploy
deploy-services:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - |
      # Environment variables kontrolü
      if [ -z "$DEPLOY_SERVER_HOST" ]; then
        echo "ERROR: DEPLOY_SERVER_HOST is not set!"
        exit 1
      fi
      if [ -z "$DEPLOY_SERVER_USER" ]; then
        echo "ERROR: DEPLOY_SERVER_USER is not set!"
        exit 1
      fi
      if [ -z "$DEPLOY_SERVER_PATH" ]; then
        echo "ERROR: DEPLOY_SERVER_PATH is not set!"
        echo "Please set DEPLOY_SERVER_PATH in GitLab CI/CD Variables (e.g., /root/MonitraNG or /home/deploy/monitrang)"
        exit 1
      fi
      echo "Deploying to $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST:$DEPLOY_SERVER_PATH..."
    - |
      ssh -o StrictHostKeyChecking=no -p ${DEPLOY_SERVER_PORT:-22} $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST sh -s << ENDSSH
        # set -e kaldırıldı - hataları manuel kontrol ediyoruz
        DEPLOY_SERVER_PATH="$DEPLOY_SERVER_PATH"
        echo "=== Starting Deployment ==="
        echo "Current directory: $(pwd)"
        echo "Target path: $DEPLOY_SERVER_PATH"
        
        # Path kontrolü
        if [ -z "$DEPLOY_SERVER_PATH" ]; then
          echo "ERROR: DEPLOY_SERVER_PATH is not set!"
          exit 1
        fi
        
        # Dizine git
        echo "Changing to $DEPLOY_SERVER_PATH..."
        if [ ! -d "$DEPLOY_SERVER_PATH" ]; then
          echo "ERROR: Directory $DEPLOY_SERVER_PATH does not exist!"
          exit 1
        fi
        if ! cd "$DEPLOY_SERVER_PATH"; then
          echo "ERROR: Cannot change to $DEPLOY_SERVER_PATH"
          exit 1
        fi
        
        # Git repository kontrolü
        if [ ! -d ".git" ]; then
          echo "ERROR: $DEPLOY_SERVER_PATH is not a git repository!"
          echo "Please clone the repository first: git clone <repo-url> $DEPLOY_SERVER_PATH"
          exit 1
        fi
        
        # Pre-deployment backup (git reset'ten ÖNCE yap, çünkü reset sonrası eski commit'teki script çalışabilir)
        echo "Creating pre-deployment backup (before git reset)..."
        if [ -f "scripts/backup-pre-deploy.sh" ]; then
          chmod +x scripts/backup-pre-deploy.sh || true
          export BACKUP_DIR="/root/backups"
          # sh ile çalıştır (bash yoksa)
          if command -v bash >/dev/null 2>&1; then
            BACKUP_NAME=$(bash scripts/backup-pre-deploy.sh 2>&1 | tail -1)
          else
            BACKUP_NAME=$(sh scripts/backup-pre-deploy.sh 2>&1 | tail -1)
          fi
          if [ -n "$BACKUP_NAME" ]; then
            echo "✓ Backup created: $BACKUP_NAME"
            echo "BACKUP_NAME=$BACKUP_NAME" > /tmp/deployment_backup.txt
          else
            echo "WARNING: Backup script did not return backup name"
          fi
        else
          echo "WARNING: backup-pre-deploy.sh not found, skipping backup"
        fi
        
        # Git işlemleri (backup'tan SONRA)
        echo "Fetching latest code..."
        if ! git fetch origin; then
          echo "ERROR: Failed to fetch from origin"
          exit 1
        fi
        echo "Resetting to origin/main..."
        if ! git reset --hard origin/main; then
          echo "ERROR: Failed to reset to origin/main"
          exit 1
        fi
        
        # Docker compose dizinine git
        echo "Changing to ApplicationResources/mng_apps..."
        if [ ! -d "ApplicationResources/mng_apps" ]; then
          echo "ERROR: ApplicationResources/mng_apps directory does not exist!"
          exit 1
        fi
        if ! cd ApplicationResources/mng_apps; then
          echo "ERROR: Cannot change to ApplicationResources/mng_apps"
          exit 1
        fi
        
        # Docker compose dosyası kontrolü
        if [ ! -f "docker-compose.production.yml" ]; then
          echo "ERROR: docker-compose.production.yml not found!"
          exit 1
        fi
        
        # Port 443 mapping'ini kontrol et ve düzelt (eğer 443:443 varsa 5443:443'e değiştir)
        echo "Checking port mappings in docker-compose.production.yml..."
        if grep -q "443:443" docker-compose.production.yml; then
          echo "WARNING: Found 443:443 mapping, fixing to 5443:443..."
          sed -i 's/443:443/5443:443/g' docker-compose.production.yml || true
        fi
        
        # Zero-downtime deployment: Rolling update stratejisi
        echo "Starting zero-downtime rolling update..."
        
        # Servis sırası: Önce backend servisler, sonra gateway, en son UI
        # Her servisi tek tek işle (function yerine inline)
        
        # MngKeeper
        SERVICE="mngkeeper"
        echo ""
        echo "=========================================="
        echo "Updating service: $SERVICE"
        echo "=========================================="
        echo "Building $SERVICE..."
        if ! docker compose -f docker-compose.production.yml build "$SERVICE"; then
          echo "ERROR: Failed to build $SERVICE"
          exit 1
        fi
        echo "Updating $SERVICE container (rolling update)..."
        if ! docker compose -f docker-compose.production.yml up -d --no-deps --force-recreate "$SERVICE"; then
          echo "ERROR: Failed to update $SERVICE"
          exit 1
        fi
        echo "Waiting for $SERVICE to start (10 seconds)..."
        sleep 10
        HEALTH_CHECK_PASSED=0
        MAX_RETRIES=6
        RETRY_COUNT=0
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          if curl -f -k https://localhost:5001/api/version/short 2>/dev/null; then
            HEALTH_CHECK_PASSED=1
            break
          fi
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "  Health check attempt $RETRY_COUNT/$MAX_RETRIES failed, retrying in 5 seconds..."
            sleep 5
          fi
        done
        if [ $HEALTH_CHECK_PASSED -eq 1 ]; then
          echo "✓ $SERVICE is healthy and running"
        else
          echo "✗ $SERVICE health check failed"
          exit 1
        fi
        
        # MngDataGateway
        SERVICE="mngdatagateway"
        echo ""
        echo "=========================================="
        echo "Updating service: $SERVICE"
        echo "=========================================="
        echo "Building $SERVICE..."
        if ! docker compose -f docker-compose.production.yml build "$SERVICE"; then
          echo "ERROR: Failed to build $SERVICE"
          exit 1
        fi
        echo "Updating $SERVICE container (rolling update)..."
        if ! docker compose -f docker-compose.production.yml up -d --no-deps --force-recreate "$SERVICE"; then
          echo "ERROR: Failed to update $SERVICE"
          exit 1
        fi
        echo "Waiting for $SERVICE to start (10 seconds)..."
        sleep 10
        HEALTH_CHECK_PASSED=0
        MAX_RETRIES=6
        RETRY_COUNT=0
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          if curl -f -k https://localhost:5010/api/v1/health 2>/dev/null || curl -f -k https://localhost:5010/api/version/short 2>/dev/null; then
            HEALTH_CHECK_PASSED=1
            break
          fi
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "  Health check attempt $RETRY_COUNT/$MAX_RETRIES failed, retrying in 5 seconds..."
            sleep 5
          fi
        done
        if [ $HEALTH_CHECK_PASSED -eq 1 ]; then
          echo "✓ $SERVICE is healthy and running"
        else
