# GitLab CI/CD Pipeline Configuration for MonitraNG
# Bu dosya GitLab'da CI/CD pipeline'larını tanımlar

# Default image ve before_script
image: mcr.microsoft.com/dotnet/sdk:9.0

# Cache ayarları (daha hızlı build için)
cache:
  paths:
    - .nuget/

# Pipeline stages
stages:
  - test-setup
  - build
  - test
  - build-docker
  - deploy-docs

# Variables (genel değişkenler)
variables:
  DOTNET_VERSION: "9.0"
  NODE_VERSION: "18"

# ============================================
# TEST SETUP STAGE (Debug)
# ============================================

# Test Setup - Environment Check
test-setup:
  stage: test-setup
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  script:
    - echo "=== Environment Check ==="
    - echo "Working directory:"
    - pwd
    - echo "User:"
    - whoami
    - echo "Dotnet version:"
    - dotnet --version
    - echo "=== Directory Structure ==="
    - ls -la
    - echo "=== Checking Solution Files ==="
    - ls -la MngKeeper/MngKeeper.sln || echo "MngKeeper.sln NOT FOUND"
    - ls -la MngDataGateway/MngDataGateway.sln || echo "MngDataGateway.sln NOT FOUND"
    - ls -la MngHub/MngHub.sln || echo "MngHub.sln NOT FOUND"
    - echo "=== Test Setup Complete ==="
  only:
    - main
    - develop
    - merge_requests

# ============================================
# BUILD STAGE
# ============================================

# MngKeeper Build
build-mngkeeper:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  script:
    - echo "Building MngKeeper..."
    - dotnet restore MngKeeper/MngKeeper.sln
    - dotnet build MngKeeper/MngKeeper.sln --no-restore -c Release
  artifacts:
    paths:
      - MngKeeper/**/bin/
      - MngKeeper/**/obj/
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# MngDataGateway Build
build-mngdatagateway:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  script:
    - echo "Building MngDataGateway..."
    - dotnet restore MngDataGateway/MngDataGateway.sln
    - dotnet build MngDataGateway/MngDataGateway.sln --no-restore -c Release
  artifacts:
    paths:
      - MngDataGateway/**/bin/
      - MngDataGateway/**/obj/
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# MngHub Build
build-mnghub:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  script:
    - echo "Building MngHub..."
    - dotnet restore MngHub/MngHub.sln
    - dotnet build MngHub/MngHub.sln --no-restore -c Release
  artifacts:
    paths:
      - MngHub/**/bin/
      - MngHub/**/obj/
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# Frontend Build (Mng.Ui)
build-frontend:
  stage: build
  image: node:18
  tags:
    - docker
  script:
    - echo "Building Frontend (Mng.Ui)..."
    - cd Mng.Ui
    - npm ci
    - npm run build
  artifacts:
    paths:
      - Mng.Ui/.nuxt/
      - Mng.Ui/.output/
      - Mng.Ui/dist/
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# ============================================
# TEST STAGE
# ============================================

# MngKeeper Tests
test-mngkeeper:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  dependencies:
    - build-mngkeeper
  script:
    - echo "Running MngKeeper tests..."
    - dotnet test MngKeeper/MngKeeper.sln --no-build --verbosity normal
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# MngDataGateway Tests
test-mngdatagateway:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  dependencies:
    - build-mngdatagateway
  script:
    - echo "Running MngDataGateway tests..."
    - dotnet test MngDataGateway/MngDataGateway.sln --no-build --verbosity normal
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# MngHub Tests
test-mnghub:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  dependencies:
    - build-mnghub
  script:
    - echo "Running MngHub tests..."
    - dotnet test MngHub/MngHub.sln --no-build --verbosity normal
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# ============================================
# DOCKER BUILD STAGE (İleride)
# ============================================

# Docker build jobs buraya eklenecek (şimdilik boş)
# build-docker-mngkeeper:
#   stage: build-docker
#   script:
#     - docker build -t mngkeeper:latest -f MngKeeper/Presentation/MngKeeper.Api/Dockerfile .
#   only:
#     - main

# ============================================
# DOCS DEPLOYMENT STAGE
# ============================================

# MkDocs Build and Deploy to GitLab Pages
deploy-docs:
  stage: deploy-docs
  image: python:3.11
  tags:
    - docker
  script:
    - echo "Building documentation with MkDocs..."
    - cd docs
    - pip install -r requirements.txt
    - mkdocs build
  artifacts:
    paths:
      - docs/site/
    expire_in: 1 day
  only:
    - main
  # GitLab Pages için pages job'u özel bir isim olmalı
  # Bu job'u "pages" olarak adlandırırsak GitLab otomatik deploy eder

# GitLab Pages Deployment (otomatik)
pages:
  stage: deploy-docs
  image: python:3.11
  tags:
    - docker
  dependencies:
    - deploy-docs
  script:
    - echo "Deploying to GitLab Pages..."
    - mkdir -p public
    - cp -r docs/site/* public/
  artifacts:
    paths:
      - public
  only:
    - main

