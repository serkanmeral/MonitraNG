# GitLab CI/CD Pipeline Configuration for MonitraNG
# Pipeline restart - testing deployment script fixes
# Bu dosya GitLab'da CI/CD pipeline'larını tanımlar
# Artifacts optional - jobs build locally instead of using artifacts to avoid upload failures
# Pipeline skip desteği: [skip ci] veya [ci skip] kullanarak pipeline'ı atlayabilirsiniz
# Artifact size limit: 100MB (GitLab config'de ayarlandı)

# Default image ve before_script
image: mcr.microsoft.com/dotnet/sdk:9.0

# Cache ayarları (daha hızlı build için)
cache:
  paths:
    - .nuget/
    - .pip-cache/  # Python pip cache for MkDocs
    - docs/.cache/  # MkDocs cache

# Pipeline stages
stages:
  - test-setup
  - build
  - test
  - build-docker
  - openapi-extract  # Separate stage for OpenAPI extraction
  - validate-docs    # Documentation quality checks
  - deploy-docs
  - deploy  # Deployment to remote server

# Variables (genel değişkenler)
variables:
  DOTNET_VERSION: "9.0"
  NODE_VERSION: "18"
  # Pipeline skip kontrolü
  CI_SKIP_PATTERN: "\\[skip ci\\]|\\[ci skip\\]"
  # Network resilience ayarları
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "300"
  GIT_STRATEGY: "clone"
  # .NET network ayarları
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # NPM network ayarları
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  # PIP network ayarları
  PIP_DEFAULT_TIMEOUT: "300"
  PIP_RETRIES: "5"
  # Docker network ayarları
  DOCKER_CLIENT_TIMEOUT: "300"

# ============================================
# TEST SETUP STAGE (Debug)
# ============================================

# Test Setup - Environment Check
test-setup:
  stage: test-setup
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  script:
    - echo "=== Environment Check ==="
    - echo "Working directory:"
    - pwd
    - echo "User:"
    - whoami
    - echo "Dotnet version:"
    - dotnet --version
    - echo "=== Directory Structure ==="
    - ls -la
    - echo "=== Checking Solution Files ==="
    - ls -la MngKeeper/MngKeeper.sln
    - ls -la MngDataGateway/MngDataGateway.sln
    - ls -la MngHub/MngHub.sln
    - ls -la MngGateway/MngGateway.sln
    - echo "=== Test Setup Complete ==="
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]|\[ci skip\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

# ============================================
# BUILD STAGE
# ============================================

# MngKeeper Build
build-mngkeeper:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  script:
    - echo "=== Building MngKeeper ==="
    - echo "Working directory:"
    - pwd
    - echo "Checking solution file:"
    - ls -la MngKeeper/MngKeeper.sln
    - echo "Dotnet version:"
    - dotnet --version
    - echo "Restoring packages (with retry)..."
    - |
      for i in {1..3}; do
        echo "Restore attempt $i/3..."
        if dotnet restore MngKeeper/MngKeeper.sln --verbosity normal; then
          echo "Restore succeeded on attempt $i"
          break
        else
          if [ $i -eq 3 ]; then
            echo "Restore failed after 3 attempts"
            exit 1
          fi
          echo "Restore failed, waiting 10 seconds before retry..."
          sleep 10
        fi
      done
    - echo "Building solution..."
    - dotnet build MngKeeper/MngKeeper.sln --no-restore -c Release --verbosity normal
    - echo "=== Build completed successfully ==="
  # Artifacts removed - optional to avoid upload failures
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]|\[ci skip\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

# MngDataGateway Build
build-mngdatagateway:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  script:
    - echo "=== Building MngDataGateway ==="
    - echo "Working directory:"
    - pwd
    - echo "Checking solution file:"
    - ls -la MngDataGateway/MngDataGateway.sln
    - echo "Cleaning solution..."
    - dotnet clean MngDataGateway/MngDataGateway.sln
    - echo "Restoring packages (with retry)..."
    - |
      for i in {1..3}; do
        echo "Restore attempt $i/3..."
        if dotnet restore MngDataGateway/MngDataGateway.sln --force --verbosity normal; then
          echo "Restore succeeded on attempt $i"
          break
        else
          if [ $i -eq 3 ]; then
            echo "Restore failed after 3 attempts"
            exit 1
          fi
          echo "Restore failed, waiting 10 seconds before retry..."
          sleep 10
        fi
      done
    - echo "Building solution..."
    - dotnet build MngDataGateway/MngDataGateway.sln -c Release --no-incremental --verbosity normal
    - echo "=== Build completed successfully ==="
  # Artifacts removed - optional to avoid upload failures
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]|\[ci skip\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

