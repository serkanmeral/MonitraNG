# GitLab CI/CD Pipeline Configuration for MonitraNG
# Bu dosya GitLab'da CI/CD pipeline'larını tanımlar

# Default image ve before_script
image: mcr.microsoft.com/dotnet/sdk:9.0

# Cache ayarları (daha hızlı build için)
cache:
  paths:
    - .nuget/
    - .pip-cache/  # Python pip cache for MkDocs
    - docs/.cache/  # MkDocs cache

# Pipeline stages
stages:
  - test-setup
  - build
  - test
  - build-docker
  - openapi-extract  # Separate stage for OpenAPI extraction
  - validate-docs    # Documentation quality checks
  - deploy-docs
  - deploy  # Deployment to remote server

# Variables (genel değişkenler)
variables:
  DOTNET_VERSION: "9.0"
  NODE_VERSION: "18"

# ============================================
# TEST SETUP STAGE (Debug)
# ============================================

# Test Setup - Environment Check
test-setup:
  stage: test-setup
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  script:
    - echo "=== Environment Check ==="
    - echo "Working directory:"
    - pwd
    - echo "User:"
    - whoami
    - echo "Dotnet version:"
    - dotnet --version
    - echo "=== Directory Structure ==="
    - ls -la
    - echo "=== Checking Solution Files ==="
    - ls -la MngKeeper/MngKeeper.sln
    - ls -la MngDataGateway/MngDataGateway.sln
    - ls -la MngHub/MngHub.sln
    - ls -la MngGateway/MngGateway.sln
    - echo "=== Test Setup Complete ==="
  only:
    - main
    - develop
    - merge_requests

# ============================================
# BUILD STAGE
# ============================================

# MngKeeper Build
build-mngkeeper:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  script:
    - echo "=== Building MngKeeper ==="
    - echo "Working directory:"
    - pwd
    - echo "Checking solution file:"
    - ls -la MngKeeper/MngKeeper.sln
    - echo "Restoring packages..."
    - dotnet restore MngKeeper/MngKeeper.sln --verbosity normal
    - echo "Building solution..."
    - dotnet build MngKeeper/MngKeeper.sln --no-restore -c Release --verbosity normal
    - echo "=== Build completed successfully ==="
  artifacts:
    paths:
      - MngKeeper/**/bin/
      - MngKeeper/**/obj/
    expire_in: 1 hour
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  only:
    - main
    - develop
    - merge_requests

# MngDataGateway Build
build-mngdatagateway:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  script:
    - echo "=== Building MngDataGateway ==="
    - echo "Working directory:"
    - pwd
    - echo "Checking solution file:"
    - ls -la MngDataGateway/MngDataGateway.sln
    - echo "Cleaning solution..."
    - dotnet clean MngDataGateway/MngDataGateway.sln
    - echo "Restoring packages..."
    - dotnet restore MngDataGateway/MngDataGateway.sln --force --verbosity normal
    - echo "Building solution..."
    - dotnet build MngDataGateway/MngDataGateway.sln -c Release --no-incremental --verbosity normal
    - echo "=== Build completed successfully ==="
  artifacts:
    paths:
      - MngDataGateway/**/bin/
      - MngDataGateway/**/obj/
    expire_in: 1 hour
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  only:
    - main
    - develop
    - merge_requests

# MngHub Build
build-mnghub:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  script:
    - echo "=== Building MngHub ==="
    - echo "Working directory:"
    - pwd
    - echo "Checking solution file:"
    - ls -la MngHub/MngHub.sln
    - echo "Restoring packages..."
    - dotnet restore MngHub/MngHub.sln --verbosity normal
    - echo "Building solution..."
    - dotnet build MngHub/MngHub.sln --no-restore -c Release --verbosity normal
    - echo "=== Build completed successfully ==="
  artifacts:
    paths:
      - MngHub/**/bin/
      - MngHub/**/obj/
    expire_in: 1 hour
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  only:
    - main
    - develop
    - merge_requests

# MngGateway Build
build-mnggateway:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  script:
    - echo "=== Building MngGateway ==="
    - echo "Working directory:"
    - pwd
    - echo "Checking solution file:"
    - ls -la MngGateway/MngGateway.sln
    - echo "Restoring packages..."
    - dotnet restore MngGateway/MngGateway.sln --verbosity normal
    - echo "Building solution..."
    - dotnet build MngGateway/MngGateway.sln --no-restore -c Release --verbosity normal
    - echo "=== Build completed successfully ==="
  artifacts:
    paths:
      - MngGateway/**/bin/
      - MngGateway/**/obj/
    expire_in: 1 hour
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  only:
    - main
    - develop
    - merge_requests

# Frontend Build (Mng.Ui)
build-frontend:
  stage: build
  image: node:18
  tags:
    - docker
  script:
    - echo "Building Frontend (Mng.Ui)..."
    - cd Mng.Ui
    - npm ci || npm install
    - npm run generate
    - echo "Frontend build completed successfully"
  artifacts:
    paths:
      - Mng.Ui/.output/
      - Mng.Ui/.nuxt/
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# ============================================
# TEST STAGE
# ============================================

# MngKeeper Tests
test-mngkeeper:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  dependencies:
    - build-mngkeeper
  script:
    - echo "Running MngKeeper tests..."
    - dotnet test MngKeeper/MngKeeper.sln --no-build --verbosity normal
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# MngDataGateway Tests
test-mngdatagateway:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  dependencies:
    - build-mngdatagateway
  script:
    - echo "Running MngDataGateway tests..."
    - dotnet test MngDataGateway/MngDataGateway.sln --no-build --verbosity normal
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# MngHub Tests
test-mnghub:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  dependencies:
    - build-mnghub
  script:
    - echo "Running MngHub tests..."
    - dotnet test MngHub/MngHub.sln --no-build --verbosity normal
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# MngGateway Tests
test-mnggateway:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  dependencies:
    - build-mnggateway
  script:
    - echo "Running MngGateway tests..."
    - dotnet test MngGateway/MngGateway.sln --no-build --verbosity normal
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# ============================================
# OPENAPI EXTRACT STAGE
# ============================================

# ============================================
# OPENAPI EXTRACTION STAGE
# ============================================

# Extract OpenAPI specs from built services using Swashbuckle
# This job extracts OpenAPI specs directly from built assemblies
extract-openapi-specs:
  stage: openapi-extract
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - docker
  dependencies:
    - build-mngkeeper
    - build-mngdatagateway
    - build-mnggateway
  before_script:
    - apt-get update && apt-get install -y curl jq || true
    - |
      # Install Swashbuckle CLI tool for OpenAPI extraction
      dotnet tool install -g Swashbuckle.AspNetCore.Cli || dotnet tool update -g Swashbuckle.AspNetCore.Cli || true
  script:
    - echo "=== Extracting OpenAPI specs from built services ==="
    - |
      # Create output directories
      mkdir -p docs/content/api/mngkeeper
      mkdir -p docs/content/api/mngdatagateway
      mkdir -p docs/content/api/mnghub
      mkdir -p docs/content/api/mnggateway
      
      # Method 1: Extract from built assemblies using Swashbuckle CLI
      # Find API project DLLs
      KEEPER_DLL=$(find MngKeeper -name "*.Api.dll" -path "*/bin/Release/*" | head -1)
      DATAGATEWAY_DLL=$(find MngDataGateway -name "*.Api.dll" -path "*/bin/Release/*" | head -1)
      GATEWAY_DLL=$(find MngGateway -name "*.Api.dll" -path "*/bin/Release/*" | head -1)
      
      # Extract MngKeeper spec
      if [ -n "$KEEPER_DLL" ]; then
        echo "Extracting MngKeeper OpenAPI spec from $KEEPER_DLL"
        swashbuckle aspnetcore tofile "$KEEPER_DLL" "v1" docs/content/api/mngkeeper/openapi.json || {
          echo "Swashbuckle extraction failed, trying alternative method..."
          # Fallback: Create placeholder with metadata
          echo '{"info":{"title":"MngKeeper API","version":"v1","description":"OpenAPI spec - extraction pending"}}' > docs/content/api/mngkeeper/openapi.json
        }
      else
        echo "MngKeeper API DLL not found, creating placeholder"
        echo '{"info":{"title":"MngKeeper API","version":"v1","description":"OpenAPI spec - build artifact not found"}}' > docs/content/api/mngkeeper/openapi.json
      fi
      
      # Extract MngDataGateway spec
      if [ -n "$DATAGATEWAY_DLL" ]; then
        echo "Extracting MngDataGateway OpenAPI spec from $DATAGATEWAY_DLL"
        swashbuckle aspnetcore tofile "$DATAGATEWAY_DLL" "v1.0" docs/content/api/mngdatagateway/openapi.json || {
          echo "Swashbuckle extraction failed, trying v1..."
          swashbuckle aspnetcore tofile "$DATAGATEWAY_DLL" "v1" docs/content/api/mngdatagateway/openapi.json || {
            echo "Swashbuckle extraction failed, creating placeholder"
            echo '{"info":{"title":"MngDataGateway API","version":"v1.0","description":"OpenAPI spec - extraction pending"}}' > docs/content/api/mngdatagateway/openapi.json
          }
        }
      else
        echo "MngDataGateway API DLL not found, creating placeholder"
        echo '{"info":{"title":"MngDataGateway API","version":"v1.0","description":"OpenAPI spec - build artifact not found"}}' > docs/content/api/mngdatagateway/openapi.json
      fi
      
      # MngHub placeholder (if needed)
      echo '{"info":{"title":"MngHub API","version":"v1","description":"OpenAPI spec - not yet available"}}' > docs/content/api/mnghub/openapi.json
      
      # Extract MngGateway spec
      if [ -n "$GATEWAY_DLL" ]; then
        echo "Extracting MngGateway OpenAPI spec from $GATEWAY_DLL"
        swashbuckle aspnetcore tofile "$GATEWAY_DLL" "v1" docs/content/api/mnggateway/openapi.json || {
          echo "Swashbuckle extraction failed, trying alternative method..."
          # Fallback: Create placeholder with metadata
          echo '{"info":{"title":"MngGateway API","version":"v1","description":"OpenAPI spec - extraction pending"}}' > docs/content/api/mnggateway/openapi.json
        }
      else
        echo "MngGateway API DLL not found, creating placeholder"
        echo '{"info":{"title":"MngGateway API","version":"v1","description":"OpenAPI spec - build artifact not found"}}' > docs/content/api/mnggateway/openapi.json
      fi
      
      echo "=== OpenAPI spec extraction completed ==="
      echo "Files created:"
      ls -la docs/content/api/*/
  artifacts:
    paths:
      - docs/content/api/
    expire_in: 1 day
  cache:
    key: openapi-specs-$CI_COMMIT_REF_SLUG
    paths:
      - docs/content/api/
  only:
    - main
    - develop
    - merge_requests
  # Note: If Swashbuckle CLI doesn't work, we can fall back to:
  # 1. Running services temporarily and extracting via HTTP
  # 2. Pre-generated spec files in repository
  # 3. Manual extraction script

# ============================================
# DOCKER BUILD STAGE
# ============================================

# Frontend (Mng.Ui) Docker Build
build-docker-ui:
  stage: build-docker
  image: docker:latest
  tags:
    - docker
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - docker info
  script:
    - echo "Building Mng.Ui Docker image..."
    - cd Mng.Ui
    - docker build -t mngui:$CI_COMMIT_SHORT_SHA -t mngui:latest -f Dockerfile .
    - echo "Docker image built successfully"
    - docker images | grep mngui
  artifacts:
    expire_in: 1 day
  only:
    - main
    - develop
    - merge_requests
  # Not: Runner'ın privileged mode'da olması gerekiyor (config.toml'da privileged: true)

# MngGateway Docker Build
build-docker-gateway:
  stage: build-docker
  image: docker:latest
  tags:
    - docker
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: "tcp://docker:2375"
  dependencies:
    - build-mnggateway
  before_script:
    - docker info
  script:
    - echo "Building MngGateway Docker image..."
    - cd MngGateway
    - docker build -t mnggateway:$CI_COMMIT_SHORT_SHA -t mnggateway:latest -f Presentation/MngGateway.Api/Dockerfile .
    - echo "Docker image built successfully"
    - docker images | grep mnggateway
  artifacts:
    expire_in: 1 day
  only:
    - main
    - develop
    - merge_requests
  # Not: Runner'ın privileged mode'da olması gerekiyor (config.toml'da privileged: true)

# ============================================
# DOCUMENTATION VALIDATION STAGE
# ============================================

# Validate documentation quality (links, linting, spelling)
validate-docs:
  stage: validate-docs
  image: node:18
  tags:
    - docker
  before_script:
    - npm install -g markdown-link-check@latest markdownlint-cli2@latest
  script:
    - echo "=== Validating documentation quality ==="
    - |
      # Markdown linting
      echo "Running markdown linting..."
      markdownlint-cli2 "docs/content/**/*.md" "!docs/content/**/node_modules/**" || {
        echo "WARNING: Markdown linting found issues (non-blocking)"
        exit 0  # Non-blocking, just warn
      }
    - |
      # Link checking (internal links only, external links can be flaky)
      echo "Checking internal links..."
      find docs/content -name "*.md" -type f | while read file; do
        echo "Checking links in: $file"
        markdown-link-check "$file" --config '{"timeout": "10s", "retryOn429": true, "retryCount": 3}' || true
      done
    - echo "=== Documentation validation completed ==="
  allow_failure: true  # Don't block pipeline on validation failures
  only:
    - main
    - develop
    - merge_requests
  cache:
    key: validate-docs-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/

# ============================================
# DOCS DEPLOYMENT STAGE
# ============================================

# MkDocs Build and Deploy to GitLab Pages
deploy-docs:
  stage: deploy-docs
  image: python:3.11
  tags:
    - docker
  dependencies:
    - extract-openapi-specs
  variables:
    PIP_CACHE_DIR: .pip-cache
  before_script:
    - python --version
    - pip --version
    - |
      # Incremental build: Check if documentation files changed
      if [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        CHANGED_FILES=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA | grep -E "docs/(content|mkdocs\.yml|requirements\.txt)" || true)
        if [ -z "$CHANGED_FILES" ]; then
          echo "No documentation changes detected. Skipping build."
          echo "CHANGED_FILES_EMPTY=true" >> .env
          exit 0
        else
          echo "Documentation changes detected:"
          echo "$CHANGED_FILES"
          echo "CHANGED_FILES_EMPTY=false" >> .env
        fi
      else
        echo "First commit or no previous commit, building all documentation"
        echo "CHANGED_FILES_EMPTY=false" >> .env
      fi
  script:
    - |
      # Check if we should skip build
      if [ -f .env ] && grep -q "CHANGED_FILES_EMPTY=true" .env; then
        echo "Skipping documentation build (no changes)"
        mkdir -p docs/site
        echo "<html><body>No changes in this commit</body></html>" > docs/site/index.html
        exit 0
      fi
    - echo "=== Building documentation with MkDocs ==="
    - cd docs
    - |
      # Install dependencies with cache
      pip install --cache-dir ../.pip-cache -r requirements.txt
    - |
      # Build documentation
      echo "Building MkDocs site..."
      mkdocs build --verbose
    - |
      # Verify build output
      echo "=== Verifying build output ==="
      ls -la site/
      echo "Build completed successfully!"
      echo "Site size:"
      du -sh site/
    - cd ..
  after_script:
    - |
      # Build notifications
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        echo "❌ Documentation build failed!"
        echo "Pipeline: $CI_PIPELINE_URL"
        echo "Job: $CI_JOB_URL"
        # Slack/Teams notification can be added here
        # curl -X POST $SLACK_WEBHOOK_URL -d "{\"text\":\"❌ Docs build failed: $CI_PIPELINE_URL\"}"
      elif [ "$CI_JOB_STATUS" == "success" ]; then
        echo "✅ Documentation build succeeded!"
        echo "Pipeline: $CI_PIPELINE_URL"
      fi
  artifacts:
    paths:
      - docs/site/
    expire_in: 1 day
  cache:
    key: mkdocs-deps-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/
      - docs/.cache/
  only:
    - main
  # Build timeout
  timeout: 15m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  # GitLab Pages için pages job'u özel bir isim olmalı
  # Bu job'u "pages" olarak adlandırırsak GitLab otomatik deploy eder

# Preview Deployment for Merge Requests
# Deploys documentation preview for each MR
deploy-docs-preview:
  stage: deploy-docs
  image: python:3.11
  tags:
    - docker
  dependencies:
    - extract-openapi-specs
  variables:
    PIP_CACHE_DIR: .pip-cache
  before_script:
    - python --version
    - pip --version
  script:
    - echo "=== Building preview documentation for MR ==="
    - cd docs
    - pip install --cache-dir ../.pip-cache -r requirements.txt
    - mkdocs build --verbose
    - cd ..
  artifacts:
    paths:
      - docs/site/
    expire_in: 7 days  # Preview artifacts last longer
  cache:
    key: mkdocs-deps-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/
      - docs/.cache/
  only:
    - merge_requests
  environment:
    name: docs-preview/mr-$CI_MERGE_REQUEST_IID
    url: https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME/-/docs-preview/mr-$CI_MERGE_REQUEST_IID
    auto_stop_in: 7 days
  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        echo "❌ Preview documentation build failed for MR #$CI_MERGE_REQUEST_IID"
      elif [ "$CI_JOB_STATUS" == "success" ]; then
        echo "✅ Preview documentation ready for MR #$CI_MERGE_REQUEST_IID"
        echo "Preview URL: https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME/-/docs-preview/mr-$CI_MERGE_REQUEST_IID"
      fi

# GitLab Pages Deployment (otomatik)
# Not: pages job'u özel bir isimdir ve GitLab otomatik olarak Pages'e deploy eder
pages:
  stage: deploy-docs
  image: python:3.11
  tags:
    - docker
  needs:
    - deploy-docs
  dependencies:
    - deploy-docs
  variables:
    PIP_CACHE_DIR: .pip-cache
  script:
    - echo "=== Deploying to GitLab Pages ==="
    - echo "Checking for docs/site directory..."
    - |
      if [ ! -d "docs/site" ]; then
        echo "WARNING: docs/site directory not found. deploy-docs job may have failed."
        echo "Building documentation as fallback..."
        cd docs
        pip install --cache-dir ../.pip-cache -r requirements.txt
        mkdocs build --verbose
        cd ..
        
        if [ ! -d "docs/site" ]; then
          echo "ERROR: Failed to build documentation. Exiting."
          exit 1
        fi
      fi
    - |
      # Verify site structure
      echo "=== Verifying site structure ==="
      ls -la docs/site/
      echo "Site contains $(find docs/site -type f | wc -l) files"
    - |
      # Copy to public directory (GitLab Pages requirement)
      echo "=== Copying to public directory ==="
      mkdir -p public
      cp -r docs/site/* public/
      echo "Files copied successfully"
      echo "Public directory contains:"
      ls -la public/ | head -20
      echo ""
      echo "=== Verifying Pages requirements ==="
      # Check for index.html in public/ or any subdirectory
      if [ ! -f "public/index.html" ]; then
        echo "WARNING: public/index.html not found in root, searching subdirectories..."
        INDEX_FILE=$(find public -name "index.html" -type f | head -1)
        if [ -n "$INDEX_FILE" ]; then
          echo "Found index.html at: $INDEX_FILE"
          echo "Copying to public/index.html..."
          cp "$INDEX_FILE" public/index.html
          echo "✓ public/index.html created from $INDEX_FILE"
        else
          echo "ERROR: No index.html found anywhere in public/ directory!"
          echo "Available files in public/:"
          find public -type f | head -10
          echo "Creating minimal index.html..."
          echo "<!DOCTYPE html><html><head><title>MonitraNG Documentation</title><meta http-equiv='refresh' content='0; url=./MkDocs/guides/IMPROVEMENTS_ROADMAP.html' /></head><body><p>Redirecting to <a href='./MkDocs/guides/IMPROVEMENTS_ROADMAP.html'>documentation</a>...</p></body></html>" > public/index.html
          echo "✓ Minimal index.html created"
        fi
      else
        echo "✓ public/index.html exists in root"
      fi
      echo "Total files in public/: $(find public -type f | wc -l)"
      echo "Public directory size: $(du -sh public | cut -f1)"
    - |
      # Add version info if available
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Documentation version: $CI_COMMIT_TAG" > public/VERSION.txt
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        echo "Documentation commit: $CI_COMMIT_SHORT_SHA" > public/VERSION.txt
        echo "Branch: $CI_COMMIT_REF_NAME" >> public/VERSION.txt
      fi
  after_script:
    - |
      # Build notifications for Pages deployment
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        echo "❌ GitLab Pages deployment failed!"
        echo "Pipeline: $CI_PIPELINE_URL"
        # Slack/Teams notification can be added here
        # curl -X POST $SLACK_WEBHOOK_URL -d "{\"text\":\"❌ Pages deploy failed: $CI_PIPELINE_URL\"}"
      elif [ "$CI_JOB_STATUS" == "success" ]; then
        echo "✅ GitLab Pages deployed successfully!"
        echo "Pages URL: https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME"
      fi
  artifacts:
    paths:
      - public
    expire_in: 30 days  # Pages artifacts should last longer
    # GitLab Pages için public/ klasörü artifacts olarak yayınlanmalı
    # GitLab otomatik olarak pages job'unun artifacts'ını Pages'e deploy eder
  cache:
    key: mkdocs-deps-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/
  only:
    - main
  # GitLab Pages için özel gereksinimler:
  # 1. Job adı "pages" olmalı (✓)
  # 2. artifacts.paths "public" içermeli (✓)
  # 3. public/ klasöründe index.html olmalı (✓)
  # 4. GitLab CE'de Pages özelliği aktif olmalı (Settings > General > Visibility)
  # 5. Pages URL: http://<gitlab-host>/<namespace>/<project-name>/-/pages
  #    veya: https://<namespace>.gitlab.io/<project-name>/
  timeout: 10m


# ============================================
# DEPLOYMENT STAGE
# ============================================

# Deployment job - Remote server'a deploy
# TEMPORARILY DISABLED FOR DEBUGGING
# deploy-services:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
    - production
  before_script:
    - apk add --no-cache openssh-client rsync git
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_SERVER_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "=== Deploying to Remote Server ==="
    - export SSH_PORT="${DEPLOY_SERVER_PORT:-22}"
    - echo "Server: $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST:$SSH_PORT"
    - echo "Path: $DEPLOY_SERVER_PATH"
    - ssh -o StrictHostKeyChecking=no -p $SSH_PORT $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST "cd $DEPLOY_SERVER_PATH && git fetch origin"
    - ssh -o StrictHostKeyChecking=no -p $SSH_PORT $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST "cd $DEPLOY_SERVER_PATH && git reset --hard origin/main"
    - ssh -o StrictHostKeyChecking=no -p $SSH_PORT $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST "cd $DEPLOY_SERVER_PATH/ApplicationResources/mng_common && docker compose pull || true"
    - ssh -o StrictHostKeyChecking=no -p $SSH_PORT $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST "cd $DEPLOY_SERVER_PATH/ApplicationResources/mng_common && docker compose up -d"
    - sleep 10
    - ssh -o StrictHostKeyChecking=no -p $SSH_PORT $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST "cd $DEPLOY_SERVER_PATH/ApplicationResources/mng_apps && docker compose -f docker-compose.production.yml pull || true"
    - ssh -o StrictHostKeyChecking=no -p $SSH_PORT $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST "cd $DEPLOY_SERVER_PATH/ApplicationResources/mng_apps && docker compose -f docker-compose.production.yml up -d --build"
    - sleep 15
    - ssh -o StrictHostKeyChecking=no -p $SSH_PORT $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST "cd $DEPLOY_SERVER_PATH/ApplicationResources/mng_apps && docker compose -f docker-compose.production.yml ps"
    - echo "Services deployed successfully"
  after_script:
    - echo "Pipeline status: $CI_JOB_STATUS"
    - if [ "$CI_JOB_STATUS" == "failed" ]; then echo "Deployment failed!"; fi
    - if [ "$CI_JOB_STATUS" == "success" ]; then echo "Deployment succeeded!"; fi
  only:
    - main
  when: manual  # Manuel tetikleme için (güvenlik)
  environment:
    name: production
    url: http://$DEPLOY_SERVER_HOST
  timeout: 30m
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
