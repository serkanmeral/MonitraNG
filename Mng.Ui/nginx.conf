server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — proxy_pass hostname'lerini yeniden çöz (mngoperations redeploy sonrası 502 önleme)
    resolver 127.0.0.11 valid=10s ipv6=off;
    
    # Port numarasını korumak için redirect ayarları
    port_in_redirect off;
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API proxy - Auth token endpoint
    location /api/auth/ {
        proxy_pass http://mngkeeper:5001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CORS headers (backend'den gelen CORS header'ları geçir)
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # API proxy - Keeper endpoints
    # Authorization: header yoksa query'deki access_token ile Bearer ekle (profil fotoğrafı vb. için)
    location /api/keeper/ {
        set $keeper_auth $http_authorization;
        if ($arg_access_token != "") {
            set $keeper_auth "Bearer $arg_access_token";
        }
        proxy_pass http://mngkeeper:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $keeper_auth;
        # CORS headers
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # API proxy - MngAdmin endpoints (backup, domain admin, etc.)
    # Client: POST /api/admin/backup/domain/{name} -> MngAdmin: POST /api/v1/backup/domain/{name}
    location /api/admin/ {
        proxy_pass http://mngadmin:5080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # CORS headers
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # API proxy - MngLLM endpoints (chatbot, llm, etc.)
    # Client: POST /api/llm/v1/chatbot/chat -> MngLLM: POST /api/v1/chatbot/chat
    location /api/llm/ {
        proxy_pass http://mngllm:5030/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # CORS headers
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # API proxy - DataGateway endpoints (for static build - server routes don't work)
    # Client requests: /api/data/v1/data/@side_menu
    # Should proxy to: http://mngdatagateway:5010/api/v1/data/@side_menu
    location /api/data/ {
        set $data_auth $http_authorization;
        if ($arg_access_token != "") { set $data_auth "Bearer $arg_access_token"; }
        proxy_pass http://mngdatagateway:5010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $data_auth;
        # CORS headers
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # API proxy - DataGateway direct endpoints (alternative path)
    location /api/v1/ {
        proxy_pass http://mngdatagateway:5010/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # CORS headers
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # API proxy - MngOperations (Operation Core runtime: board context/list, profil, transition, bildirim)
    # Client: /api/operations/v1/runtime/... -> mngoperations: /api/v1/runtime/...
    location /api/operations/ {
        set $oc_auth $http_authorization;
        if ($arg_access_token != "") { set $oc_auth "Bearer $arg_access_token"; }
        set $oc_upstream http://mngoperations:5086;
        client_max_body_size 50m;
        rewrite ^/api/operations/(.*)$ /api/$1 break;
        proxy_pass $oc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $oc_auth;
        # CORS headers
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # API proxy - MngScheduler (admin zamanlanmış görevler, system/user jobs)
    # Client: /api/scheduler/v1/system/jobs -> mngscheduler:5090/api/v1/system/jobs
    location /api/scheduler/ {
        set $sched_auth $http_authorization;
        if ($arg_access_token != "") { set $sched_auth "Bearer $arg_access_token"; }
        set $sched_upstream http://mngscheduler:5090;
        rewrite ^/api/scheduler/(.*)$ /api/$1 break;
        proxy_pass $sched_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $sched_auth;
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # API proxy - MngAlarm (alarm kuralları, açık alarmlar)
    # Client: /api/alarm/v1/rules -> mngalarm:5087/api/v1/rules
    location /api/alarm/ {
        set $alarm_auth $http_authorization;
        if ($arg_access_token != "") { set $alarm_auth "Bearer $arg_access_token"; }
        set $alarm_upstream http://mngalarm:5087;
        rewrite ^/api/alarm/(.*)$ /api/$1 break;
        proxy_pass $alarm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $alarm_auth;
        proxy_set_header X-Domain-Name $http_x_domain_name;
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # API proxy - MngWorkflow (onaylar, tanımlar, run geçmişi)
    # Client: /api/workflow/v1/approvals -> mngworkflow:5085/api/v1/approvals
    location /api/workflow/ {
        set $wf_auth $http_authorization;
        if ($arg_access_token != "") { set $wf_auth "Bearer $arg_access_token"; }
        set $wf_upstream http://mngworkflow:5085;
        rewrite ^/api/workflow/(.*)$ /api/$1 break;
        proxy_pass $wf_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $wf_auth;
        proxy_set_header X-Domain-Name $http_x_domain_name;
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # API proxy - MngDocument (Document Intelligence: resources, klasör/dosya/markdown)
    # Client: /api/documents/v1/resources/... -> mngdocument: /api/v1/resources/...
    location /api/documents/ {
        set $doc_auth $http_authorization;
        if ($arg_access_token != "") { set $doc_auth "Bearer $arg_access_token"; }
        client_max_body_size 50m;
        proxy_pass http://mngdocument:5095/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $doc_auth;
        # CORS headers
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # Static assets with long-term caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA routing - all routes should serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Disable logging for favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Disable logging for robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}

