<svg width="200" height="32" viewBox="0 0 200 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- MonitraNG Logo with IoT Monitoring Icon (RTL version) -->
  
  <!-- MonitraNG text (left side for RTL) -->
  <text x="0" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#525C65" text-anchor="start">MonitraNG</text>
  
  <!-- Icon (right side for RTL) -->
  <g transform="translate(160, 0)">
    <!-- Background gradient circle -->
    <defs>
      <linearGradient id="rtlLogoBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
        <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.1" />
      </linearGradient>
    </defs>
    <circle cx="16" cy="16" r="15" fill="url(#rtlLogoBgGradient)"/>
    
    <!-- Central monitoring center -->
    <rect x="11" y="11" width="10" height="10" rx="2" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
    
    <!-- Monitoring waves -->
    <path d="M 13 15 Q 14 14, 15 15 T 17 15 T 19 15" stroke="#ffffff" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M 13 17 Q 14 16, 15 17 T 17 17 T 19 17" stroke="#ffffff" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 13 19 Q 14 18, 15 19 T 17 19 T 19 19" stroke="#ffffff" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- IoT sensors -->
    <circle cx="16" cy="5" r="1.75" fill="#10b981" stroke="#059669" stroke-width="0.75"/>
    <line x1="16" y1="6.75" x2="16" y2="11" stroke="#3b82f6" stroke-width="1.25" stroke-linecap="round"/>
    
    <circle cx="27" cy="16" r="1.75" fill="#10b981" stroke="#059669" stroke-width="0.75"/>
    <line x1="25.25" y1="16" x2="21" y2="16" stroke="#3b82f6" stroke-width="1.25" stroke-linecap="round"/>
    
    <circle cx="16" cy="27" r="1.75" fill="#10b981" stroke="#059669" stroke-width="0.75"/>
    <line x1="16" y1="25.25" x2="16" y2="21" stroke="#3b82f6" stroke-width="1.25" stroke-linecap="round"/>
    
    <circle cx="5" cy="16" r="1.75" fill="#10b981" stroke="#059669" stroke-width="0.75"/>
    <line x1="6.75" y1="16" x2="11" y2="16" stroke="#3b82f6" stroke-width="1.25" stroke-linecap="round"/>
  </g>
</svg>
