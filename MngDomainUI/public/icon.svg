<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- IoT Monitoring Icon: Network of connected sensors with monitoring dashboard -->
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#3b82f6" opacity="0.1"/>
  
  <!-- Central monitoring hub (dashboard) -->
  <rect x="20" y="20" width="24" height="24" rx="3" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>
  
  <!-- Dashboard grid lines (monitoring display) -->
  <line x1="24" y1="28" x2="40" y2="28" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <line x1="24" y1="32" x2="40" y2="32" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <line x1="24" y1="36" x2="40" y2="36" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Connected IoT sensors (4 sensors around the hub) -->
  <!-- Top sensor -->
  <circle cx="32" cy="8" r="4" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <circle cx="32" cy="8" r="2" fill="#ffffff"/>
  <line x1="32" y1="12" x2="32" y2="20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Right sensor -->
  <circle cx="56" cy="32" r="4" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <circle cx="56" cy="32" r="2" fill="#ffffff"/>
  <line x1="52" y1="32" x2="44" y2="32" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Bottom sensor -->
  <circle cx="32" cy="56" r="4" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <circle cx="32" cy="56" r="2" fill="#ffffff"/>
  <line x1="32" y1="52" x2="32" y2="44" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Left sensor -->
  <circle cx="8" cy="32" r="4" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <circle cx="8" cy="32" r="2" fill="#ffffff"/>
  <line x1="12" y1="32" x2="20" y2="32" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Data flow indicators (small dots on connection lines) -->
  <circle cx="32" cy="16" r="1.5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="48" cy="32" r="1.5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="32" cy="48" r="1.5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="16" cy="32" r="1.5" fill="#60a5fa" opacity="0.8"/>
</svg>
