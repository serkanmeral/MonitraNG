# Odak PRODUCTION (192.168.20.8) — yalnizca production sunucuda kullanilir
# Test sunucu (20.20) icin docker-compose.odak.yml kullanilir; bu dosya oraya deploy edilmez.
# On kosul: ayni host'ta mng_common (docker-compose.odak.prod.yml) ayakta
#   docker compose -f docker-compose.production.yml -f docker-compose.odak.prod.yml --env-file .env up -d --build
# .env: cp .env.odak.prod.example .env (test .env KOPYALANMAZ)

services:
  mnggateway:
    ports:
      - "5040:5000"
    environment:
      - MngGatewaySettings__Server__Scheme=http
      - MngGatewaySettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-http://192.168.20.8:5040}
      - MngGatewaySettings__Jwt__Authority=http://keycloak:8080/keycloak/realms/monitra
      - MngGatewaySettings__Jwt__RequireHttpsMetadata=false
      - MngGatewaySettings__Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_1:-http://192.168.20.8:3000}

  mngkeeper:
    ports:
      - "5001:5001"
    environment:
      - MngKeeperSettings__OpenApiServerPath=http://192.168.20.8:5001

  mngdatagateway:
    ports:
      - "5010:5010"

  mngreactor:
    ports:
      - "5003:5003"
    environment:
      - MngReactorSettings__OpenApiServerPath=http://192.168.20.8:5040/reactor
      - MngReactorSettings__MongoDB__Host=mongo
      - MngReactorSettings__MongoDB__Password=${MONGO_PASSWORD:-admin123}
      - MngReactorSettings__RabbitMQ__Host=rabbitmq
      - MngReactorSettings__RabbitMQ__Password=${RABBITMQ_PASSWORD:-admin123}
      - MngReactorSettings__Mqtt__Host=mosquitto
      - MngReactorSettings__ObservationPublish__Enabled=true
      # G1: dual-write normalized sec_events to OpenSearch (mng_common)
      - MngReactorSettings__SecEvents__OpenSearchDualWriteEnabled=true
      - MngReactorSettings__SecEvents__OpenSearchReadEnabled=true
      - MngReactorSettings__SecEvents__OpenSearchUrl=http://opensearch:9200

  mngengine:
    ports:
      - "5037:5037"
      - "5514:5514/udp"
      # IT merkezi toplayici portlari (NxLog JSON / FortiGate syslog) — relay yerine dogrudan dinleme
      - "1514:1514/udp"
      - "1541:1541/udp"
      - "1542:1542/udp"
      - "541:541/udp"
      - "542:542/udp"
    environment:
      - MngEngine__SecEventQueue__UdpPort=5514
      - MngEngine__SecEventQueue__UdpListeners__0__UdpPort=5514
      - MngEngine__SecEventQueue__UdpListeners__0__SourceType=endpoint
      - MngEngine__SecEventQueue__UdpListeners__0__SourceProduct=linux-syslog
      - MngEngine__SecEventQueue__UdpListeners__1__UdpPort=1514
      - MngEngine__SecEventQueue__UdpListeners__1__SourceType=ad
      - MngEngine__SecEventQueue__UdpListeners__1__SourceProduct=windows-nxlog
      - MngEngine__SecEventQueue__UdpListeners__2__UdpPort=1541
      - MngEngine__SecEventQueue__UdpListeners__2__SourceType=ad
      - MngEngine__SecEventQueue__UdpListeners__2__SourceProduct=windows-nxlog
      - MngEngine__SecEventQueue__UdpListeners__3__UdpPort=1542
      - MngEngine__SecEventQueue__UdpListeners__3__SourceType=ad
      - MngEngine__SecEventQueue__UdpListeners__3__SourceProduct=windows-nxlog
      - MngEngine__SecEventQueue__UdpListeners__4__UdpPort=541
      - MngEngine__SecEventQueue__UdpListeners__4__SourceType=firewall
      - MngEngine__SecEventQueue__UdpListeners__4__SourceProduct=fortigate
      - MngEngine__SecEventQueue__UdpListeners__5__UdpPort=542
      - MngEngine__SecEventQueue__UdpListeners__5__SourceType=firewall
      - MngEngine__SecEventQueue__UdpListeners__5__SourceProduct=fortigate

  mnghub:
    ports:
      - "5020:5020"

  ollama:
    build: !reset null
    image: alpine:3.19
    container_name: ollama
    command: ["sleep", "infinity"]
    networks:
      - mng_common_mng_network
    restart: unless-stopped

  mngllm:
    build: !reset null
    image: alpine:3.19
    container_name: mngllm
    command: ["sleep", "infinity"]
    depends_on:
      - ollama
    networks:
      - mng_common_mng_network
    restart: unless-stopped

  mngscheduler:
    ports:
      - "5090:5090"

  mngworkflow:
    ports:
      - "5085:5085"
    environment:
      - EnableDevWorkflowEndpoints=true
      - MngWorkflowSettings__MongoDb__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngWorkflowSettings__Secrets__EncryptionKeyBase64=MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXY=

  mngworkflow-worker:
    environment:
      - MngWorkflowSettings__MongoDb__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngWorkflowSettings__Secrets__EncryptionKeyBase64=MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXY=
      - MngWorkflowSettings__EngineCommand__DevLogOnly=true

  mngalarm:
    ports:
      - "5087:5087"
    environment:
      - EnableDevAlarmEndpoints=true
      - MngAlarmSettings__MongoDb__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngAlarmSettings__Engine__ConsumeObservations=false

  mngalarm-worker:
    environment:
      - MngAlarmSettings__MongoDb__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngAlarmSettings__Engine__ReactorBridge__Enabled=false

  mnglogcollector:
    ports:
      - "5091:5091"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - EnableSwagger=false
      - MngLogCollectorSettings__OpenSearch__Url=http://opensearch:9200
      - MngLogCollectorSettings__OpenSearch__WriteEnabled=true
      # Set a real key in .env before exposing ingest beyond the lab network
      - MngLogCollectorSettings__Ingest__ApiKey=${MNGLOGCOLLECTOR_INGEST_API_KEY:-}
      - MngLogCollectorSettings__MongoDB__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngLogCollectorSettings__MongoDB__KeeperDatabaseName=mngkeeper

  mngoperations:
    ports:
      - "5086:5086"
    environment:
      - Jwt__Authority=http://keycloak:8080/keycloak/realms/monitra
      - MngOperationsSettings__OpenApiServerPath=http://192.168.20.8:5040/operations
      - MngOperationsSettings__Actors__KeycloakBaseUrl=http://keycloak:8080/keycloak
      - MngOperationsSettings__PerfDiagnostics=false

  mngdocument:
    ports:
      - "5095:5095"
    environment:
      - Jwt__Authority=http://keycloak:8080/keycloak/realms/monitra
      - MngDocumentSettings__OpenApiServerPath=http://192.168.20.8:5040/documents
      - MngDocumentSettings__Collabora__Enabled=true
      - MngDocumentSettings__Collabora__PublicBaseUrl=http://192.168.20.8:9980
      - MngDocumentSettings__Wopi__HostBaseUrl=http://mngdocument:5095

  collabora:
    ports:
      - "9980:9980"
    environment:
      - aliasgroup1=http://192.168.20.8:9980,http://192.168.20.8:5040,http://192.168.20.8:3000,http://192.168.20.20:3000,http://localhost:3000,http://127.0.0.1:3000,https://mng.odaksavunma.com,http://mngdocument:5095
    command:
      - --o:ssl.enable=false
      - --o:ssl.termination=false
      - --o:user_interface.mode=compact
      - --o:home_mode.enable=true
      - "--o:net.content_security_policy=frame-ancestors localhost:* 127.0.0.1:* 192.168.20.8:* 192.168.20.20:* mng.odaksavunma.com:* mngdocument:*;"

  mngadmin:
    ports:
      - "5080:5080"

  mngnotifier:
    ports:
      - "5070:5070"

  mngui:
    ports:
      - "3000:80"
    build:
      context: ../../Mng.Ui
      dockerfile: Dockerfile
      args:
        GATEWAY_URL: ${GATEWAY_URL:-http://192.168.20.8:5040}
        HUB_URL: ${HUB_URL:-http://192.168.20.8:5020}

  mngdomainui:
    ports:
      - "3001:3000"
