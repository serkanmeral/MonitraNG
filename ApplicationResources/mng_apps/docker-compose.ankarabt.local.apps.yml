# AbtAppServer — mng_apps override (Nginx yok, doğrudan IP)
# Ön koşul: mng_common ayakta, ağ mng_common_mng_network mevcut
#
#   docker compose -f docker-compose.production.yml -f docker-compose.ankarabt.local.apps.yml --env-file .env up -d --build
#
# UI: http://192.168.1.249:3000   DomainUI: http://192.168.1.249:3001
# Ollama ve MngLLM production tanımıyla açılır. Collabora, draw.io ve Gotenberg açık.
# Portal override'ı (docker-compose.ankarabt.apps.yml) bu makinede kullanılmaz.

services:
  mnggateway:
    ports:
      - "5040:5000"
    environment:
      - MngGatewaySettings__Server__Scheme=http
      - MngGatewaySettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-http://192.168.1.249:5040}
      - MngGatewaySettings__Jwt__Authority=http://keycloak:8080/keycloak/realms/monitra
      - MngGatewaySettings__Jwt__RequireHttpsMetadata=false
      - MngGatewaySettings__Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_1:-http://192.168.1.249:3000}
      - MngGatewaySettings__Cors__AllowedOrigins__1=${CORS_ALLOWED_ORIGIN_2:-http://192.168.1.249:3001}
      - MngGatewaySettings__Cors__AllowedOrigins__2=http://localhost:3000
      - MngGatewaySettings__Cors__AllowedOrigins__3=http://127.0.0.1:3000
      - Kestrel__Limits__MaxRequestBodySize=83886080

  mngkeeper:
    ports:
      - "5001:5001"
    extra_hosts:
      - "dc01.ankarabt.local:192.168.1.254"
    environment:
      - MngKeeperSettings__OpenApiServerPath=http://192.168.1.249:5001

  mngdatagateway:
    ports:
      - "5010:5010"
    environment:
      - Kestrel__Limits__MaxRequestBodySize=83886080

  mngreactor:
    ports:
      - "5003:5003"
    environment:
      - MngReactorSettings__OpenApiServerPath=http://192.168.1.249:5040/reactor
      - MngReactorSettings__EngineServerUrl=http://mngreactor:5003
      - MngReactorSettings__Actors__MngKeeperEngineUrl=http://mngkeeper:5001
      - MngReactorSettings__MongoDB__Host=mongo
      - MngReactorSettings__MongoDB__Password=${MONGO_PASSWORD:-admin123}
      - MngReactorSettings__RabbitMQ__Host=rabbitmq
      - MngReactorSettings__RabbitMQ__Password=${RABBITMQ_PASSWORD:-admin123}
      - MngReactorSettings__Mqtt__Host=mosquitto
      - MngReactorSettings__ObservationPublish__Enabled=true
      - MngReactorSettings__SecEvents__OpenSearchDualWriteEnabled=true
      - MngReactorSettings__SecEvents__OpenSearchReadEnabled=true
      - MngReactorSettings__SecEvents__OpenSearchUrl=http://opensearch:9200

  mngengine:
    ports:
      - "5037:5037"

  mnghub:
    ports:
      - "5020:5020"
    environment:
      - MngHubSettings__Cors__AllowedOrigins__2=http://localhost:3000
      - MngHubSettings__Cors__AllowedOrigins__3=http://127.0.0.1:3000

  mnglogcollector:
    ports:
      - "5091:5091"

  mngscheduler:
    ports:
      - "5090:5090"

  mngworkflow:
    ports:
      - "5085:5085"

  mngalarm:
    ports:
      - "5087:5087"

  mngoperations:
    ports:
      - "5086:5086"
    environment:
      - Jwt__Authority=http://keycloak:8080/keycloak/realms/monitra
      - MngOperationsSettings__OpenApiServerPath=http://192.168.1.249:5040/operations
      - MngOperationsSettings__Actors__KeycloakBaseUrl=http://keycloak:8080/keycloak

  clamav:
    image: clamav/clamav:1.4
    container_name: clamav
    environment:
      - CLAMD_CONF_StreamMaxLength=50M
      - CLAMD_CONF_MaxScanSize=50M
      - CLAMD_CONF_MaxFileSize=50M
      - CLAMD_CONF_AlertEncrypted=yes
      - CLAMD_CONF_AlertEncryptedArchive=yes
    networks:
      - mng_common_mng_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  mngdocument:
    ports:
      - "5095:5095"
    environment:
      - Jwt__Authority=http://keycloak:8080/keycloak/realms/monitra
      - MngDocumentSettings__OpenApiServerPath=http://192.168.1.249:5040/documents
      - MngDocumentSettings__Collabora__Enabled=true
      - MngDocumentSettings__Collabora__PublicBaseUrl=${COLLABORA_PUBLIC_URL:-http://192.168.1.249:9980}
      - MngDocumentSettings__Collabora__PostMessageOrigin=http://192.168.1.249:3000 http://127.0.0.1:3000 http://localhost:3000
      - MngDocumentSettings__Notifications__UiBaseUrl=http://192.168.1.249:3000
      - MngDocumentSettings__Antivirus__Enabled=true
      - MngDocumentSettings__Antivirus__Host=clamav
      - MngDocumentSettings__Antivirus__Port=3310
      - Kestrel__Limits__MaxRequestBodySize=83886080

  collabora:
    environment:
      - aliasgroup1=${COLLABORA_ALIASGROUP:-http://192.168.1.249:9980,http://192.168.1.249:5040,http://192.168.1.249:3000,http://localhost:3000,http://127.0.0.1:3000,http://mngdocument:5095}
    command:
      - --o:ssl.enable=false
      - --o:ssl.termination=false
      - --o:user_interface.mode=compact
      - --o:home_mode.enable=true
      - "--o:net.content_security_policy=frame-ancestors localhost:* 127.0.0.1:* 192.168.1.249:* mngdocument:*;"

  mngadmin:
    ports:
      - "5080:5080"

  mngnotifier:
    ports:
      - "5070:5070"

  mngui:
    ports:
      - "3000:80"
    build:
      context: ../../Mng.Ui
      dockerfile: Dockerfile
      args:
        GATEWAY_URL: https://app.ankarabt.com
        HUB_URL: ""
        DRAWIO_PUBLIC_URL: ${DRAWIO_PUBLIC_URL:-http://192.168.1.249:8088}
        SERVER_ADMIN_URL: http://192.168.1.249:5080
        SCHEDULER_URL: http://192.168.1.249:5090
        MNGLOGCOLLECTOR_URL: http://192.168.1.249:5091

  mngdomainui:
    ports:
      - "3001:3000"
