version: '3.9'

services:
  mnggateway:
    build:
      context: ../../MngGateway
      dockerfile: Presentation/MngGateway.Api/Dockerfile
    image: mnggateway:${VERSION:-latest}
    container_name: mnggateway
    # Port mapping removed - Access via Nginx reverse proxy only
    # ports:
    #   - "${GATEWAY_PORT:-5000}:5000"
    #   - "55443:443"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Production
      
      # Server Configuration
      - MngGatewaySettings__Server__Host=0.0.0.0
      - MngGatewaySettings__Server__Port=5000
      - MngGatewaySettings__Server__Scheme=https
      - MngGatewaySettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-https://api.monitra.local}
      
      # JWT Configuration
      - MngGatewaySettings__Jwt__Authority=${KEYCLOAK_BASE_URL}/realms/monitra
      - MngGatewaySettings__Jwt__Audience=account
      - MngGatewaySettings__Jwt__RequireHttpsMetadata=${JWT_REQUIRE_HTTPS_METADATA:-true}
      
      # CORS Configuration
      - MngGatewaySettings__Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_1:-https://app.monitra.local}
      - MngGatewaySettings__Cors__AllowedOrigins__1=${CORS_ALLOWED_ORIGIN_2:-}
      - MngGatewaySettings__Cors__AllowCredentials=true
      
      # Rate Limit Configuration
      - MngGatewaySettings__RateLimit__EnableRateLimiting=${RATE_LIMIT_ENABLED:-true}
      - MngGatewaySettings__RateLimit__AnonymousLimit=${RATE_LIMIT_ANONYMOUS:-30}
      - MngGatewaySettings__RateLimit__AuthenticatedLimit=${RATE_LIMIT_AUTHENTICATED:-100}
      - MngGatewaySettings__RateLimit__AdminLimit=${RATE_LIMIT_ADMIN:-500}
      - MngGatewaySettings__RateLimit__Period=1m
      
      # Backend Services Configuration
      - MngGatewaySettings__BackendServices__MngKeeper=${MNGKEEPER_URL:-http://mngkeeper:5001}
      - MngGatewaySettings__BackendServices__MngDataGateway=${MNGDATAGATEWAY_URL:-http://mngdatagateway:5010}
      - MngGatewaySettings__BackendServices__MngHub=${MNGHUB_URL:-http://mnghub:5020}
      - MngGatewaySettings__BackendServices__MngReactor=${MNGREACTOR_URL:-http://mngreactor:5003}
      - MngGatewaySettings__BackendServices__MngWorkflow=${MNGWORKFLOW_URL:-http://mngworkflow:5085}
      - MngGatewaySettings__BackendServices__KeyCloak=${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      
      # Certificate Settings
      - MngGatewaySettings__CertificateSettings__DNS=${CERTIFICATE_DNS:-mnggateway}
    
    networks:
      - mng_common_mng_network
    
    depends_on:
      - mngkeeper
      - mngdatagateway
      - mngreactor
      - mnghub
      - mngworkflow

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:5000/health 2>/dev/null || curl -sf http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  mngkeeper:
    build:
      context: ../../MngKeeper
      dockerfile: Presentation/MngKeeper.Api/Dockerfile
    image: mngkeeper:${VERSION:-latest}
    container_name: mngkeeper
    # Port mapping removed - Access via Nginx reverse proxy only
    # ports:
    #   - "5001:5001"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Production
      
      # Swagger Configuration (enable in production)
      - EnableSwagger=true
      
      # Server Configuration
      - MngKeeperSettings__Server__Host=0.0.0.0
      - MngKeeperSettings__Server__Port=5001
      - MngKeeperSettings__Server__Scheme=https
      - MngKeeperSettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-https://localhost:5001}
      
      # MongoDB Configuration
      - MngKeeperSettings__MongoDB__ConnectionString=${MONGO_CONNECTION_STRING}
      - MngKeeperSettings__MongoDB__DatabaseName=${MONGO_DATABASE_NAME:-mngkeeper}
      
      # Keycloak Configuration (BaseUrl origin only, e.g. http://keycloak:8080; path prefix e.g. /keycloak)
      - MngKeeperSettings__Keycloak__BaseUrl=${KEYCLOAK_BASE_URL}
      - MngKeeperSettings__Keycloak__PathPrefix=${KEYCLOAK_PATH_PREFIX:-/keycloak}
      - MngKeeperSettings__Keycloak__AdminUsername=${KEYCLOAK_ADMIN_USERNAME}
      - MngKeeperSettings__Keycloak__AdminPassword=${KEYCLOAK_ADMIN_PASSWORD}
      - MngKeeperSettings__Keycloak__ClientId=${KEYCLOAK_CLIENT_ID}
      - MngKeeperSettings__Keycloak__ClientSecret=${KEYCLOAK_CLIENT_SECRET}
      - MngKeeperSettings__Keycloak__DefaultAdminPassword=${KEYCLOAK_DEFAULT_ADMIN_PASSWORD}
      
      # Redis Configuration
      - MngKeeperSettings__Redis__ConnectionString=${REDIS_CONNECTION_STRING}
      
      # RabbitMQ Configuration
      - MngKeeperSettings__RabbitMQ__Host=${RABBITMQ_HOST}
      - MngKeeperSettings__RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - MngKeeperSettings__RabbitMQ__Username=${RABBITMQ_USERNAME}
      - MngKeeperSettings__RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - MngKeeperSettings__RabbitMQ__VirtualHost=${RABBITMQ_VIRTUALHOST:-/}
      
      # MQTT Configuration
      - MngKeeperSettings__Mqtt__BrokerHost=${MQTT_BROKER_HOST}
      - MngKeeperSettings__Mqtt__BrokerPort=${MQTT_BROKER_PORT:-1883}
      - MngKeeperSettings__Mqtt__Username=${MQTT_USERNAME}
      - MngKeeperSettings__Mqtt__Password=${MQTT_PASSWORD}
      - MngKeeperSettings__Mqtt__TopicPrefix=${MQTT_TOPIC_PREFIX:-MNG}
      
      # MinIO Configuration
      - MngKeeperSettings__MinIO__Endpoint=${MINIO_ENDPOINT}
      - MngKeeperSettings__MinIO__AccessKey=${MINIO_ACCESS_KEY}
      - MngKeeperSettings__MinIO__SecretKey=${MINIO_SECRET_KEY}
      - MngKeeperSettings__MinIO__UseSSL=${MINIO_USE_SSL:-false}
      - MngKeeperSettings__MinIO__Region=${MINIO_REGION:-us-east-1}
      
      # Certificate Settings
      - MngKeeperSettings__CertificateSettings__DNS=${CERTIFICATE_DNS:-mngkeeper}
      
      # License encryption (required for Create Domain / trial license)
      - MngKeeperSettings__License__MasterKey=${MNGKEEPER_LICENSE_MASTER_KEY}
      
      # Notifier (şifre sıfırlama / e-posta bildirimleri – container içinden mngnotifier servisi)
      - MngKeeperSettings__Notifier__BaseUrl=${NOTIFIER_BASE_URL:-http://mngnotifier:5070}
      - MngKeeperSettings__Notifier__ApiVersion=${NOTIFIER_API_VERSION:-v1}
      # UI base URL (şifre sıfırlama mailindeki link – production'da app.monitrang.com)
      - MngKeeperSettings__UiBaseUrl=${MNG_KEEPER_UI_BASE_URL:-https://app.monitrang.com}
    
    networks:
      - mng_common_mng_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/api/version/short || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  mngdatagateway:
    build:
      context: ../../MngDataGateway
      dockerfile: Presentation/MngDataGateway.Api/Dockerfile
    image: mngdatagateway:${VERSION:-latest}
    container_name: mngdatagateway
    # Port mapping removed - Access via Nginx reverse proxy only
    # ports:
    #   - "5010:5010"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MngDataGatewaySettings__Server__Host=0.0.0.0
      - MngDataGatewaySettings__Server__Port=5010
      - MngDataGatewaySettings__Server__Scheme=https
      - MngDataGatewaySettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-https://localhost:5010}
      - MngDataGatewaySettings__MongoDB__ConnectionString=${MONGO_CONNECTION_STRING}
      - MngDataGatewaySettings__Actors__MngKeeper=${MNGKEEPER_URL}
      - MngDataGatewaySettings__Actors__MngNotifier=${MNGNOTIFIER_URL:-http://mngnotifier:5070}
      - MngDataGatewaySettings__Actors__MngNotifierNotifyApiKey=${INTERNAL_NOTIFY_API_KEY:-}
      - MngDataGatewaySettings__RabbitMQ__Host=${RABBITMQ_HOST}
      - MngDataGatewaySettings__RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - MngDataGatewaySettings__RabbitMQ__Username=${RABBITMQ_USERNAME}
      - MngDataGatewaySettings__RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - MngDataGatewaySettings__RabbitMQ__VirtualHost=${RABBITMQ_VIRTUALHOST:-/}
      - MngDataGatewaySettings__CertificateSettings__DNS=mngdatagateway
      # FileStorage / MinIO (file field uploads): container içinden MinIO'ya erişim için servis adresi
      - MngDataGatewaySettings__FileStorage__Minio__Endpoint=${MINIO_ENDPOINT:-minio:9000}
      - MngDataGatewaySettings__FileStorage__Minio__AccessKey=${MINIO_ACCESS_KEY}
      - MngDataGatewaySettings__FileStorage__Minio__SecretKey=${MINIO_SECRET_KEY}
      - MngDataGatewaySettings__FileStorage__Minio__UseSSL=${MINIO_USE_SSL:-false}
    networks:
      - mng_common_mng_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 10 http://127.0.0.1:5010/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  mngreactor:
    build:
      context: ../../MngReactor
      dockerfile: Dockerfile
    image: mngreactor:${VERSION:-latest}
    container_name: mngreactor
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MngReactorSettings__Server__Host=0.0.0.0
      - MngReactorSettings__Server__Port=5003
      - MngReactorSettings__Server__Scheme=http
      - MngReactorSettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-https://api.monitra.local/reactor}
      - MngReactorSettings__EngineServerUrl=${MNGREACTOR_ENGINE_URL:-}
      - MngReactorSettings__Actors__MngKeeper=${MNGKEEPER_URL:-http://mngkeeper:5001}
      # Engine host'ta çalışıyorsa Keeper erişilemez; MNGKEEPER_ENGINE_URL=http://localhost:5001
      - MngReactorSettings__Actors__MngKeeperEngineUrl=${MNGKEEPER_ENGINE_URL:-}
      - MngReactorSettings__DataGateway__BaseUrl=${MNGDATAGATEWAY_URL:-http://mngdatagateway:5010}
      - MngReactorSettings__DataGateway__ApiVersion=v1
      - MngReactorSettings__MongoDB__Host=${MONGO_HOST:-mongo}
      - MngReactorSettings__MongoDB__Port=${MONGO_PORT:-27017}
      - MngReactorSettings__MongoDB__Username=${MONGO_USERNAME:-admin}
      - MngReactorSettings__MongoDB__Password=${MONGO_PASSWORD}
      - MngReactorSettings__RabbitMQ__Host=${RABBITMQ_HOST}
      - MngReactorSettings__RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - MngReactorSettings__RabbitMQ__Username=${RABBITMQ_USERNAME}
      - MngReactorSettings__RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - MngReactorSettings__RabbitMQ__VirtualHost=${RABBITMQ_VIRTUALHOST:-/}
      - MngReactorSettings__Mqtt__Host=${MQTT_BROKER_HOST:-mosquitto}
      - MngReactorSettings__Mqtt__Port=${MQTT_BROKER_PORT:-1883}
      - MngReactorSettings__Mqtt__UserName=${MQTT_USERNAME}
      - MngReactorSettings__Mqtt__Password=${MQTT_PASSWORD}
      - MngReactorSettings__Crypt__IngestDecryptKey=${MNGREACTOR_INGEST_DECRYPT_KEY:-0123456789abcdef}
      - MngReactorSettings__Crypt__IngestEncryptKey=${MNGREACTOR_INGEST_ENCRYPT_KEY:-abcdef0123456789}
    networks:
      - mng_common_mng_network
    depends_on:
      - mngkeeper
      - mngdatagateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5003/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  mnghub:
    build:
      context: ../../MngHub
      dockerfile: Presentation/MngHub.Api/Dockerfile
    image: mnghub:${VERSION:-latest}
    container_name: mnghub
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MngHubSettings__Server__Host=0.0.0.0
      - MngHubSettings__Server__Port=5020
      - MngHubSettings__Server__Scheme=http
      - MngHubSettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-http://localhost:5020}
      - MngHubSettings__RabbitMQ__Host=${RABBITMQ_HOST}
      - MngHubSettings__RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - MngHubSettings__RabbitMQ__Username=${RABBITMQ_USERNAME}
      - MngHubSettings__RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - MngHubSettings__RabbitMQ__VirtualHost=${RABBITMQ_VIRTUALHOST:-/}
      - MngHubSettings__Actors__MngKeeper=${MNGKEEPER_URL}
      # CORS: MngGateway ile aynı origin listesi kullanılmalı (MngUI doğrudan Hub'a bağlanıyorsa CORS burada uygulanır)
      - MngHubSettings__Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_1:-https://app.monitra.local}
      - MngHubSettings__Cors__AllowedOrigins__1=${CORS_ALLOWED_ORIGIN_2:-}
      - MngHubSettings__Cors__AllowCredentials=true
    networks:
      - mng_common_mng_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5020/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  mngllm:
    build:
      context: ../../MngLLM
      dockerfile: Presentation/MngLLM.Api/Dockerfile
    image: mngllm:${VERSION:-latest}
    container_name: mngllm
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MngLLMSettings__Server__Host=0.0.0.0
      - MngLLMSettings__Server__Port=5030
      - MngLLMSettings__Server__Scheme=http
      - MngLLMSettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-http://localhost:5030}
      - MngLLMSettings__Jwt__Authority=${MNGLLM_JWT_AUTHORITY:-}
      - MngLLMSettings__Ollama__BaseUrl=${OLLAMA_BASE_URL:-http://ollama:11434}
      - MngLLMSettings__Actors__MngKeeper=${MNGKEEPER_URL:-http://mngkeeper:5001}
      - MngLLMSettings__Actors__MngDataGateway=${MNGDATAGATEWAY_URL:-http://mngdatagateway:5010}
    networks:
      - mng_common_mng_network
    depends_on:
      - mngkeeper
      - mngdatagateway
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5030/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - mng_common_mng_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'
        reservations:
          memory: 2G
          cpus: '1'
    # Ollama: root URL hafif yanıt verir; /api/tags model listesi döner (daha ağır olabilir)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --connect-timeout 3 --max-time 10 http://127.0.0.1:11434/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s

  mngscheduler:
    build:
      context: ../../MngScheduler
      dockerfile: Presentation/MngScheduler.Api/Dockerfile
    image: mngscheduler:${VERSION:-latest}
    container_name: mngscheduler
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MngSchedulerSettings__Server__Host=0.0.0.0
      - MngSchedulerSettings__Server__Port=5090
      - MngSchedulerSettings__Server__Scheme=http
      - MngSchedulerSettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-http://localhost:5090}
      - MngSchedulerSettings__MongoDB__ConnectionString=${MONGO_CONNECTION_STRING}
      - MngSchedulerSettings__MongoDB__KeeperDatabaseName=${MONGO_DATABASE_NAME:-mngkeeper}
      - MngSchedulerSettings__Actors__MngKeeper=${MNGKEEPER_URL:-http://mngkeeper:5001}
      - MngSchedulerSettings__DataGateway__BaseUrl=${MNGDATAGATEWAY_URL:-http://mngdatagateway:5010}
      - MngSchedulerSettings__RabbitMQ__Host=${RABBITMQ_HOST}
      - MngSchedulerSettings__RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - MngSchedulerSettings__RabbitMQ__Username=${RABBITMQ_USERNAME}
      - MngSchedulerSettings__RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - MngSchedulerSettings__RabbitMQ__VirtualHost=${RABBITMQ_VIRTUALHOST:-/}
    networks:
      - mng_common_mng_network
    depends_on:
      - mngkeeper
      - mngdatagateway
      - mnghub
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5090/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  mngworkflow:
    build:
      context: ../../MngWorkflow
      dockerfile: Presentation/MngWorkflow.Api/Dockerfile
    image: mngworkflow:${VERSION:-latest}
    container_name: mngworkflow
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5085
      - MngWorkflowSettings__DataGatewayBaseUrl=${MNGDATAGATEWAY_URL:-http://mngdatagateway:5010}
      - MngWorkflowSettings__NotifierBaseUrl=${MNGNOTIFIER_URL:-http://mngnotifier:5070}
      - MngWorkflowSettings__RabbitMq__Host=${RABBITMQ_HOST}
      - MngWorkflowSettings__RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - MngWorkflowSettings__RabbitMq__VirtualHost=${RABBITMQ_VIRTUALHOST:-/}
      - MngWorkflowSettings__RabbitMq__Username=${RABBITMQ_USERNAME}
      - MngWorkflowSettings__RabbitMq__Password=${RABBITMQ_PASSWORD}
      - Jwt__Authority=${KEYCLOAK_BASE_URL}/realms/monitra
      - EnableSwagger=${ENABLE_WORKFLOW_SWAGGER:-false}
    networks:
      - mng_common_mng_network
    depends_on:
      - mngdatagateway
      - mngnotifier
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5085/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  mngadmin:
    build:
      context: ../../MngAdmin
      dockerfile: Presentation/MngAdmin.Api/Dockerfile
    image: mngadmin:${VERSION:-latest}
    container_name: mngadmin
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MngAdminSettings__Server__Host=0.0.0.0
      - MngAdminSettings__Server__Port=5080
      - MngAdminSettings__Server__Scheme=http
      - MngAdminSettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-http://localhost:5080}
      - MngAdminSettings__MongoDB__ConnectionString=${MONGO_CONNECTION_STRING}
      - MngAdminSettings__Actors__MngKeeper=${MNGKEEPER_URL:-http://mngkeeper:5001}
      - MngAdminSettings__RabbitMQ__Host=${RABBITMQ_HOST}
      - MngAdminSettings__RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - MngAdminSettings__RabbitMQ__Username=${RABBITMQ_USERNAME}
      - MngAdminSettings__RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - MngAdminSettings__RabbitMQ__VirtualHost=${RABBITMQ_VIRTUALHOST:-/}
      - MngAdminSettings__Backup__MinIO__SystemBucket=system
      # MinIO bağlantısı — MngAdminSettings:MinIO altına bind olması için MngAdminSettings__MinIO__* kullanılmalı
      - MngAdminSettings__MinIO__Endpoint=${MINIO_ENDPOINT:-minio:9000}
      - MngAdminSettings__MinIO__AccessKey=${MINIO_ACCESS_KEY}
      - MngAdminSettings__MinIO__SecretKey=${MINIO_SECRET_KEY}
      - MngAdminSettings__MinIO__UseSSL=${MINIO_USE_SSL:-false}
    networks:
      - mng_common_mng_network
    depends_on:
      - mngkeeper
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  mngnotifier:
    build:
      context: ../../MngNotifier
      dockerfile: Presentation/MngNotifier.Api/Dockerfile
    image: mngnotifier:${VERSION:-latest}
    container_name: mngnotifier
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MngNotifierSettings__Server__Host=0.0.0.0
      - MngNotifierSettings__Server__Port=5070
      - MngNotifierSettings__Server__Scheme=http
      - MngNotifierSettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-http://localhost:5070}
      - MngNotifierSettings__RabbitMQ__Host=${RABBITMQ_HOST}
      - MngNotifierSettings__RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - MngNotifierSettings__RabbitMQ__Username=${RABBITMQ_USERNAME}
      - MngNotifierSettings__RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - MngNotifierSettings__RabbitMQ__VirtualHost=${RABBITMQ_VIRTUALHOST:-/}
      - MngNotifierSettings__Mail__Provider=SMTP
      - MngNotifierSettings__Mail__DefaultFrom__Email=${SMTP_FROM_EMAIL:-noreply@monitrang.com}
      - MngNotifierSettings__Mail__DefaultFrom__Name=${SMTP_FROM_NAME:-MonitraNG}
      # SMTP: host.docker.internal (extra_hosts) veya .env'de SMTP_HOST=172.17.0.1 (Linux gateway)
      - MngNotifierSettings__Mail__Smtp__Host=${SMTP_HOST:-host.docker.internal}
      - MngNotifierSettings__Mail__Smtp__Port=${SMTP_PORT:-25}
      - MngNotifierSettings__Mail__Smtp__Username=${SMTP_USERNAME:-}
      - MngNotifierSettings__Mail__Smtp__Password=${SMTP_PASSWORD:-}
      - MngNotifierSettings__Mail__Smtp__EnableSsl=false
      - MngNotifierSettings__InternalNotifyApiKey=${INTERNAL_NOTIFY_API_KEY:-}
    networks:
      - mng_common_mng_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5070/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  mngui:
    build:
      context: ../../Mng.Ui
      dockerfile: Dockerfile
      args:
        # Build-time: Hub aynı origin üzerinden gitsin (app.monitrang.com/hub) — CORS gerektirmez
        GATEWAY_URL: ${GATEWAY_URL:-https://app.monitrang.com}
        HUB_URL: ${HUB_URL:-}
    image: mngui:${VERSION:-latest}
    container_name: mngui
    # Port mapping removed - Access via Nginx reverse proxy only
    # ports:
    #   - "${UI_PORT:-3000}:80"
    environment:
      # Individual service URLs (Gateway kullanılmıyor şimdilik)
      - KEEPER_URL=${KEEPER_URL:-https://mngkeeper:5001}
      - DATAGATEWAY_URL=${DATAGATEWAY_URL:-https://mngdatagateway:5010}
      - HUB_URL=${HUB_URL:-http://mnghub:5020}
      # Gateway URL boş bırakılıyor (şimdilik direkt servisler kullanılıyor)
      - GATEWAY_URL=${GATEWAY_URL:-}
    networks:
      - mng_common_mng_network
    depends_on:
      - mngkeeper
      - mngdatagateway
      - mnghub
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  mngdomainui:
    build:
      context: ../../MngDomainUI
      dockerfile: Dockerfile
    image: mngdomainui:${VERSION:-latest}
    container_name: mngdomainui
    # Port mapping removed - Access via Nginx reverse proxy only
    # ports:
    #   - "3001:3000"
    environment:
      # Backend service URLs (server-side, container-to-container: use http — services listen HTTP inside network)
      - SERVER_KEEPER_URL=${SERVER_KEEPER_URL:-http://mngkeeper:5001}
      - SERVER_DATAGATEWAY_URL=${SERVER_DATAGATEWAY_URL:-http://mngdatagateway:5010}
      - SERVER_HUB_URL=${SERVER_HUB_URL:-http://mnghub:5020}
      - SERVER_SCHEDULER_URL=${SERVER_SCHEDULER_URL:-http://mngscheduler:5090}
      # Public service URLs (client-side for browser access)
      - KEEPER_URL=${KEEPER_URL:-https://mngkeeper:5001}
      - DATAGATEWAY_URL=${DATAGATEWAY_URL:-https://mngdatagateway:5010}
      - HUB_URL=${HUB_URL:-http://mnghub:5020}
      # Gateway URL (optional)
      - GATEWAY_URL=${GATEWAY_URL:-}
      # Node.js environment
      - NODE_ENV=production
      - PORT=3000
      # Nuxt base URL - Nuxt.js handles /domain/ prefix internally
      - BASE_URL=/domain/
      - NUXT_APP_BASE_URL=/domain/
      # Keycloak Configuration (server-side)
      # Note: Keycloak runs under /keycloak path (KC_HTTP_RELATIVE_PATH)
      # MngKeeper uses BaseAddress=http://keycloak:8080 and PathPrefix=/keycloak
      # For MngDomainUI, we use the same approach: BaseURL + PathPrefix
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      - KEYCLOAK_PATH_PREFIX=${KEYCLOAK_PATH_PREFIX:-/keycloak}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-master}
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      # MinIO Configuration (server-side)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-admin123}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
    networks:
      - mng_common_mng_network
    depends_on:
      - mngkeeper
      - mngdatagateway
      - mnghub
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/domain/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  ollama_data:
    driver: local

networks:
  mng_common_mng_network:
    external: true

