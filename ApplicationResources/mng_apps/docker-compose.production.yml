version: '3.9'

services:
  mnggateway:
    build:
      context: ../../MngGateway
      dockerfile: Presentation/MngGateway.Api/Dockerfile
    image: mnggateway:${VERSION:-latest}
    container_name: mnggateway
    # Port mapping removed - Access via Nginx reverse proxy only
    # ports:
    #   - "${GATEWAY_PORT:-5000}:5000"
    #   - "5443:443"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Production
      
      # Server Configuration
      - MngGatewaySettings__Server__Host=0.0.0.0
      - MngGatewaySettings__Server__Port=5000
      - MngGatewaySettings__Server__Scheme=https
      - MngGatewaySettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-https://api.monitra.local}
      
      # JWT Configuration
      - MngGatewaySettings__Jwt__Authority=${KEYCLOAK_BASE_URL}/realms/monitra
      - MngGatewaySettings__Jwt__Audience=account
      - MngGatewaySettings__Jwt__RequireHttpsMetadata=${JWT_REQUIRE_HTTPS_METADATA:-true}
      
      # CORS Configuration
      - MngGatewaySettings__Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_1:-https://app.monitra.local}
      - MngGatewaySettings__Cors__AllowedOrigins__1=${CORS_ALLOWED_ORIGIN_2:-}
      - MngGatewaySettings__Cors__AllowCredentials=true
      
      # Rate Limit Configuration
      - MngGatewaySettings__RateLimit__EnableRateLimiting=${RATE_LIMIT_ENABLED:-true}
      - MngGatewaySettings__RateLimit__AnonymousLimit=${RATE_LIMIT_ANONYMOUS:-30}
      - MngGatewaySettings__RateLimit__AuthenticatedLimit=${RATE_LIMIT_AUTHENTICATED:-100}
      - MngGatewaySettings__RateLimit__AdminLimit=${RATE_LIMIT_ADMIN:-500}
      - MngGatewaySettings__RateLimit__Period=1m
      
      # Backend Services Configuration
      - MngGatewaySettings__BackendServices__MngKeeper=${MNGKEEPER_URL:-http://mngkeeper:5001}
      - MngGatewaySettings__BackendServices__MngDataGateway=${MNGDATAGATEWAY_URL:-http://mngdatagateway:5010}
      - MngGatewaySettings__BackendServices__MngHub=${MNGHUB_URL:-http://mnghub:5020}
      - MngGatewaySettings__BackendServices__MngReactor=${MNGREACTOR_URL:-http://mngreactor:5003}
      - MngGatewaySettings__BackendServices__KeyCloak=${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      
      # Certificate Settings
      - MngGatewaySettings__CertificateSettings__DNS=${CERTIFICATE_DNS:-mnggateway}
    
    networks:
      - mng_common_mng_network
    
    depends_on:
      - mngkeeper
      - mngdatagateway
      - mnghub
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  mngkeeper:
    build:
      context: ../../MngKeeper
      dockerfile: Presentation/MngKeeper.Api/Dockerfile
    image: mngkeeper:${VERSION:-latest}
    container_name: mngkeeper
    # Port mapping removed - Access via Nginx reverse proxy only
    # ports:
    #   - "5001:5001"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Production
      
      # Swagger Configuration (enable in production)
      - EnableSwagger=true
      
      # Server Configuration
      - MngKeeperSettings__Server__Host=0.0.0.0
      - MngKeeperSettings__Server__Port=5001
      - MngKeeperSettings__Server__Scheme=https
      - MngKeeperSettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-https://localhost:5001}
      
      # MongoDB Configuration
      - MngKeeperSettings__MongoDB__ConnectionString=${MONGO_CONNECTION_STRING}
      - MngKeeperSettings__MongoDB__DatabaseName=${MONGO_DATABASE_NAME:-mngkeeper}
      
      # Keycloak Configuration
      - MngKeeperSettings__Keycloak__BaseUrl=${KEYCLOAK_BASE_URL}
      - MngKeeperSettings__Keycloak__AdminUsername=${KEYCLOAK_ADMIN_USERNAME}
      - MngKeeperSettings__Keycloak__AdminPassword=${KEYCLOAK_ADMIN_PASSWORD}
      - MngKeeperSettings__Keycloak__ClientId=${KEYCLOAK_CLIENT_ID}
      - MngKeeperSettings__Keycloak__ClientSecret=${KEYCLOAK_CLIENT_SECRET}
      - MngKeeperSettings__Keycloak__DefaultAdminPassword=${KEYCLOAK_DEFAULT_ADMIN_PASSWORD}
      
      # Redis Configuration
      - MngKeeperSettings__Redis__ConnectionString=${REDIS_CONNECTION_STRING}
      
      # RabbitMQ Configuration
      - MngKeeperSettings__RabbitMQ__Host=${RABBITMQ_HOST}
      - MngKeeperSettings__RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - MngKeeperSettings__RabbitMQ__Username=${RABBITMQ_USERNAME}
      - MngKeeperSettings__RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - MngKeeperSettings__RabbitMQ__VirtualHost=${RABBITMQ_VIRTUALHOST:-/}
      
      # MQTT Configuration
      - MngKeeperSettings__Mqtt__BrokerHost=${MQTT_BROKER_HOST}
      - MngKeeperSettings__Mqtt__BrokerPort=${MQTT_BROKER_PORT:-1883}
      - MngKeeperSettings__Mqtt__Username=${MQTT_USERNAME}
      - MngKeeperSettings__Mqtt__Password=${MQTT_PASSWORD}
      - MngKeeperSettings__Mqtt__TopicPrefix=${MQTT_TOPIC_PREFIX:-MNG}
      
      # MinIO Configuration
      - MngKeeperSettings__MinIO__Endpoint=${MINIO_ENDPOINT}
      - MngKeeperSettings__MinIO__AccessKey=${MINIO_ACCESS_KEY}
      - MngKeeperSettings__MinIO__SecretKey=${MINIO_SECRET_KEY}
      - MngKeeperSettings__MinIO__UseSSL=${MINIO_USE_SSL:-false}
      - MngKeeperSettings__MinIO__Region=${MINIO_REGION:-us-east-1}
      
      # Certificate Settings
      - MngKeeperSettings__CertificateSettings__DNS=${CERTIFICATE_DNS:-mngkeeper}
    
    networks:
      - mng_common_mng_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:5001/api/version/short || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  mngdatagateway:
    build:
      context: ../../MngDataGateway
      dockerfile: Presentation/MngDataGateway.Api/Dockerfile
    image: mngdatagateway:${VERSION:-latest}
    container_name: mngdatagateway
    # Port mapping removed - Access via Nginx reverse proxy only
    # ports:
    #   - "5010:5010"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MngDataGatewaySettings__Server__Host=0.0.0.0
      - MngDataGatewaySettings__Server__Port=5010
      - MngDataGatewaySettings__Server__Scheme=https
      - MngDataGatewaySettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-https://localhost:5010}
      - MngDataGatewaySettings__MongoDB__ConnectionString=${MONGO_CONNECTION_STRING}
      - MngDataGatewaySettings__Actors__MngKeeper=${MNGKEEPER_URL}
      - MngDataGatewaySettings__RabbitMQ__Host=${RABBITMQ_HOST}
      - MngDataGatewaySettings__RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - MngDataGatewaySettings__RabbitMQ__Username=${RABBITMQ_USERNAME}
      - MngDataGatewaySettings__RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - MngDataGatewaySettings__RabbitMQ__VirtualHost=${RABBITMQ_VIRTUALHOST:-/}
      - MngDataGatewaySettings__CertificateSettings__DNS=mngdatagateway
    networks:
      - mng_common_mng_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:5010/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  mnghub:
    build:
      context: ../../MngHub
      dockerfile: Presentation/MngHub.Api/Dockerfile
    image: mnghub:${VERSION:-latest}
    container_name: mnghub
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MngHubSettings__Server__Host=0.0.0.0
      - MngHubSettings__Server__Port=5020
      - MngHubSettings__Server__Scheme=http
      - MngHubSettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-http://localhost:5020}
      - MngHubSettings__RabbitMQ__Host=${RABBITMQ_HOST}
      - MngHubSettings__RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - MngHubSettings__RabbitMQ__Username=${RABBITMQ_USERNAME}
      - MngHubSettings__RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - MngHubSettings__RabbitMQ__VirtualHost=${RABBITMQ_VIRTUALHOST:-/}
      - MngHubSettings__Actors__MngKeeper=${MNGKEEPER_URL}
    networks:
      - mng_common_mng_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5020/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  mngui:
    build:
      context: ../../Mng.Ui
      dockerfile: Dockerfile
    image: mngui:${VERSION:-latest}
    container_name: mngui
    # Port mapping removed - Access via Nginx reverse proxy only
    # ports:
    #   - "${UI_PORT:-3000}:80"
    environment:
      # Individual service URLs (Gateway kullanılmıyor şimdilik)
      - KEEPER_URL=${KEEPER_URL:-https://mngkeeper:5001}
      - DATAGATEWAY_URL=${DATAGATEWAY_URL:-https://mngdatagateway:5010}
      - HUB_URL=${HUB_URL:-http://mnghub:5020}
      # Gateway URL boş bırakılıyor (şimdilik direkt servisler kullanılıyor)
      - GATEWAY_URL=${GATEWAY_URL:-}
    networks:
      - mng_common_mng_network
    depends_on:
      - mngkeeper
      - mngdatagateway
      - mnghub
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  mngdomainui:
    build:
      context: ../../MngDomainUI
      dockerfile: Dockerfile
    image: mngdomainui:${VERSION:-latest}
    container_name: mngdomainui
    # Port mapping removed - Access via Nginx reverse proxy only
    # ports:
    #   - "3001:3000"
    environment:
      # Backend service URLs (server-side for container-to-container communication)
      - SERVER_KEEPER_URL=${SERVER_KEEPER_URL:-https://mngkeeper:5001}
      - SERVER_DATAGATEWAY_URL=${SERVER_DATAGATEWAY_URL:-https://mngdatagateway:5010}
      - SERVER_HUB_URL=${SERVER_HUB_URL:-http://mnghub:5020}
      # Public service URLs (client-side for browser access)
      - KEEPER_URL=${KEEPER_URL:-https://mngkeeper:5001}
      - DATAGATEWAY_URL=${DATAGATEWAY_URL:-https://mngdatagateway:5010}
      - HUB_URL=${HUB_URL:-http://mnghub:5020}
      # Gateway URL (optional)
      - GATEWAY_URL=${GATEWAY_URL:-}
      # Node.js environment
      - NODE_ENV=production
      - PORT=3000
      # Nuxt base URL - Nuxt.js handles /domain/ prefix internally
      - BASE_URL=/domain/
      - NUXT_APP_BASE_URL=/domain/
      # Keycloak Configuration (server-side)
      # Note: Keycloak runs under /keycloak path (KC_HTTP_RELATIVE_PATH)
      # MngKeeper uses BaseAddress=http://keycloak:8080 and adds /keycloak to paths
      # For MngDomainUI, we include /keycloak in BASE_URL to match
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL:-http://keycloak:8080/keycloak}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-master}
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      # MinIO Configuration (server-side)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-admin123}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
    networks:
      - mng_common_mng_network
    depends_on:
      - mngkeeper
      - mngdatagateway
      - mnghub
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/domain/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  mng_common_mng_network:
    external: true

