services:
  mnggateway:
    build:
      context: ../../MngGateway
      dockerfile: Presentation/MngGateway.Api/Dockerfile
    image: localhost:5000/mnggateway:1.0.0
    container_name: mnggateway
    ports:
      - "5040:5000"  # HTTP port
      - "5443:5000"  # HTTPS port (alternative)
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Development
      
      # Server Configuration
      - MngGatewaySettings__Server__Host=0.0.0.0
      - MngGatewaySettings__Server__Port=5000
      - MngGatewaySettings__Server__Scheme=https
      - MngGatewaySettings__OpenApiServerPath=https://api.monitra.local
      
      # JWT Configuration
      - MngGatewaySettings__Jwt__Authority=http://keycloak:8080/realms/monitra
      - MngGatewaySettings__Jwt__Audience=account
      - MngGatewaySettings__Jwt__RequireHttpsMetadata=false
      
      # CORS Configuration
      - MngGatewaySettings__Cors__AllowedOrigins__0=https://app.monitra.local
      - MngGatewaySettings__Cors__AllowedOrigins__1=http://localhost:3000
      - MngGatewaySettings__Cors__AllowCredentials=true
      
      # Rate Limit Configuration
      - MngGatewaySettings__RateLimit__EnableRateLimiting=true
      - MngGatewaySettings__RateLimit__AnonymousLimit=30
      - MngGatewaySettings__RateLimit__AuthenticatedLimit=100
      - MngGatewaySettings__RateLimit__AdminLimit=500
      - MngGatewaySettings__RateLimit__Period=1m
      
      # Backend Services Configuration (HTTP for internal communication)
      - MngGatewaySettings__BackendServices__MngKeeper=http://mngkeeper:5001
      - MngGatewaySettings__BackendServices__MngDataGateway=http://mngdatagateway:5010
      - MngGatewaySettings__BackendServices__MngHub=http://mnghub:5020
      - MngGatewaySettings__BackendServices__MngReactor=http://mngreactor:5003
      - MngGatewaySettings__BackendServices__MngLLM=http://mngllm:5030
      - MngGatewaySettings__BackendServices__MngNotifier=http://mngnotifier:5070
      - MngGatewaySettings__BackendServices__MngAdmin=http://mngadmin:5080
      - MngGatewaySettings__BackendServices__MngScheduler=http://mngscheduler:5090
      - MngGatewaySettings__BackendServices__MngWorkflow=http://mngworkflow:5085
      - MngGatewaySettings__BackendServices__MngOperations=http://mngoperations:5086
      - MngGatewaySettings__BackendServices__MngDocument=http://mngdocument:5095
      - MngGatewaySettings__BackendServices__KeyCloak=http://keycloak:8080
      
      # Certificate Settings
      - MngGatewaySettings__CertificateSettings__DNS=mnggateway
    
    networks:
      - mng_common_mng_network
    
    depends_on:
      - mngkeeper
      - mngdatagateway
      - mngreactor
      - mnghub
      - mngllm
      - mngadmin
      - mngscheduler
      - mngworkflow
      - mngoperations
      - mngdocument

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mngkeeper:
    build:
      context: ../../MngKeeper
      dockerfile: Presentation/MngKeeper.Api/Dockerfile
    image: localhost:5000/mngkeeper:1.2.1
    container_name: mngkeeper
    ports:
      - "5001:5001"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Development
      
      # Server Configuration
      - MngKeeperSettings__Server__Host=0.0.0.0
      - MngKeeperSettings__Server__Port=5001
      - MngKeeperSettings__Server__Scheme=http
      - MngKeeperSettings__OpenApiServerPath=http://localhost:5001
      
      # MongoDB Configuration
      - MngKeeperSettings__MongoDB__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngKeeperSettings__MongoDB__DatabaseName=mngkeeper
      
      # Keycloak Configuration
      - MngKeeperSettings__Keycloak__BaseUrl=http://keycloak:8080
      - MngKeeperSettings__Keycloak__PathPrefix=
      - MngKeeperSettings__Keycloak__AdminUsername=admin
      - MngKeeperSettings__Keycloak__AdminPassword=admin123
      - MngKeeperSettings__Keycloak__ClientId=mng-keeper-admin
      - MngKeeperSettings__Keycloak__ClientSecret=MSG9QBXtnFNlPHCA8DrmTqXpQHXhZ2HK
      - MngKeeperSettings__Keycloak__DefaultAdminPassword=Admin123!
      
      # Redis Configuration
      - MngKeeperSettings__Redis__ConnectionString=redis:6379,password=redis123
      
      # RabbitMQ Configuration
      - MngKeeperSettings__RabbitMQ__Host=rabbitmq
      - MngKeeperSettings__RabbitMQ__Port=5672
      - MngKeeperSettings__RabbitMQ__Username=admin
      - MngKeeperSettings__RabbitMQ__Password=admin123
      - MngKeeperSettings__RabbitMQ__VirtualHost=/
      
      # MQTT Configuration
      - MngKeeperSettings__Mqtt__BrokerHost=mosquitto
      - MngKeeperSettings__Mqtt__BrokerPort=1883
      - MngKeeperSettings__Mqtt__Username=monitrang
      - MngKeeperSettings__Mqtt__Password=!2345qawsedrf
      - MngKeeperSettings__Mqtt__TopicPrefix=MNG
      
      # MinIO Configuration
      - MngKeeperSettings__MinIO__Endpoint=minio:9000
      - MngKeeperSettings__MinIO__AccessKey=admin
      - MngKeeperSettings__MinIO__SecretKey=admin123
      - MngKeeperSettings__MinIO__UseSSL=false
      - MngKeeperSettings__MinIO__Region=us-east-1
      - MngKeeperSettings__MinIO__SystemFolderPath=System
      
      # Notifier Configuration
      - MngKeeperSettings__Notifier__BaseUrl=http://mngnotifier:5070
      - MngKeeperSettings__Notifier__ApiVersion=v1
      
      # License Configuration
      - MngKeeperSettings__License__MasterKey=your-secure-master-key-change-in-production-min-32-chars
      - MngKeeperSettings__License__DefaultTrialDays=15
      
    networks:
      - mng_common_mng_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mnghub:
    build:
      context: ../../MngHub
      dockerfile: Presentation/MngHub.Api/Dockerfile
    image: localhost:5000/mnghub:1.0.0
    container_name: mnghub
    ports:
      - "5020:5020"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Development
      
      # Server Configuration
      - MngHubSettings__Server__Host=0.0.0.0
      - MngHubSettings__Server__Port=5020
      - MngHubSettings__Server__Scheme=http
      - MngHubSettings__OpenApiServerPath=http://localhost:5020
      
      # RabbitMQ Configuration
      - MngHubSettings__RabbitMQ__Host=rabbitmq
      - MngHubSettings__RabbitMQ__Port=5672
      - MngHubSettings__RabbitMQ__Username=admin
      - MngHubSettings__RabbitMQ__Password=admin123
      - MngHubSettings__RabbitMQ__VirtualHost=/
      - MngHubSettings__RabbitMQ__ExchangeName=mng.topics
      - MngHubSettings__RabbitMQ__EventPublisherExchangeName=mngkeeper.events
      
      # Actors Configuration
      - MngHubSettings__Actors__MngKeeper=http://mngkeeper:5001
      
      # Certificate Settings
      - MngHubSettings__CertificateSettings__DNS=mnghub
    
    networks:
      - mng_common_mng_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5020/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mngreactor:
    build:
      context: ../../MngReactor
      dockerfile: Dockerfile
    image: localhost:5000/mngreactor:1.0.0
    container_name: mngreactor
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MngReactorSettings__Server__Host=0.0.0.0
      - MngReactorSettings__Server__Port=5003
      - MngReactorSettings__Server__Scheme=http
      - MngReactorSettings__OpenApiServerPath=http://localhost:5003
      - MngReactorSettings__EngineServerUrl=${MNGREACTOR_ENGINE_URL:-}
      - MngReactorSettings__Actors__MngKeeper=http://mngkeeper:5001
      # Engine host'ta çalışıyorsa token alamaz; MngKeeperEngineUrl=localhost:5001 verin
      - MngReactorSettings__Actors__MngKeeperEngineUrl=${MNGKEEPER_ENGINE_URL:-}
      - MngReactorSettings__DataGateway__BaseUrl=http://mngdatagateway:5010
      - MngReactorSettings__DataGateway__ApiVersion=v1
      - MngReactorSettings__MongoDB__Host=mongo
      - MngReactorSettings__MongoDB__Port=27017
      - MngReactorSettings__MongoDB__Username=admin
      - MngReactorSettings__MongoDB__Password=admin123
      - MngReactorSettings__RabbitMQ__Host=rabbitmq
      - MngReactorSettings__RabbitMQ__Port=5672
      - MngReactorSettings__RabbitMQ__Username=admin
      - MngReactorSettings__RabbitMQ__Password=admin123
      - MngReactorSettings__RabbitMQ__VirtualHost=/
      - MngReactorSettings__Mqtt__Host=mosquitto
      - MngReactorSettings__Mqtt__Port=1883
      - MngReactorSettings__Mqtt__UserName=monitrang
      - MngReactorSettings__Mqtt__Password=!2345qawsedrf
      - MngReactorSettings__Crypt__IngestDecryptKey=0123456789abcdef
      - MngReactorSettings__Crypt__IngestEncryptKey=abcdef0123456789
    networks:
      - mng_common_mng_network
    depends_on:
      - mngkeeper
      - mngdatagateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5003/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mngdatagateway:
    build:
      context: ../../MngDataGateway
      dockerfile: Presentation/MngDataGateway.Api/Dockerfile
    image: localhost:5000/mngdatagateway:1.0.0
    container_name: mngdatagateway
    ports:
      - "5010:5010"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Development
      
      # Server Configuration
      - MngDataGatewaySettings__Server__Host=0.0.0.0
      - MngDataGatewaySettings__Server__Port=5010
      - MngDataGatewaySettings__Server__Scheme=http
      - MngDataGatewaySettings__OpenApiServerPath=http://localhost:5010
      
      # MongoDB Configuration
      - MngDataGatewaySettings__MongoDB__ConnectionString=mongodb://admin:admin123@mongo:27017
      
      # Actors Configuration (MngKeeper)
      - MngDataGatewaySettings__Actors__MngKeeper=http://mngkeeper:5001
      - MngDataGatewaySettings__Actors__MngNotifier=http://mngnotifier:5070
      - MngDataGatewaySettings__Actors__MngNotifierNotifyApiKey=${INTERNAL_NOTIFY_API_KEY:-}
      
      # RabbitMQ Configuration
      - MngDataGatewaySettings__RabbitMQ__Host=rabbitmq
      - MngDataGatewaySettings__RabbitMQ__Port=5672
      - MngDataGatewaySettings__RabbitMQ__Username=admin
      - MngDataGatewaySettings__RabbitMQ__Password=admin123
      - MngDataGatewaySettings__RabbitMQ__VirtualHost=/
      
      # Query Configuration
      - MngDataGatewaySettings__Query__RelationExpansionMaxDepth=2
      - MngDataGatewaySettings__Query__DefaultPageSize=50
      - MngDataGatewaySettings__Query__MaxPageSize=1000
      
      # History Configuration
      - MngDataGatewaySettings__History__MaxHistoryEntries=50
      
      # Deleted Data Configuration
      - MngDataGatewaySettings__DeletedData__RetentionDays=7
      
      # Validation Configuration
      - MngDataGatewaySettings__Validation__HttpValidationTimeout=30
      
      # FileStorage Configuration (MinIO)
      - MngDataGatewaySettings__FileStorage__Minio__Endpoint=minio:9000
      - MngDataGatewaySettings__FileStorage__Minio__AccessKey=admin
      - MngDataGatewaySettings__FileStorage__Minio__SecretKey=admin123
      - MngDataGatewaySettings__FileStorage__Minio__BucketName=datasets
      - MngDataGatewaySettings__FileStorage__Minio__UseSSL=false
      
      # FileStorage Encryption Configuration
      - MngDataGatewaySettings__FileStorage__Encryption__Enabled=true
      - MngDataGatewaySettings__FileStorage__Encryption__Algorithm=AES-256-GCM
      - MngDataGatewaySettings__FileStorage__Encryption__Key=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      - MngDataGatewaySettings__FileStorage__Encryption__KeyDerivation=PBKDF2
      - MngDataGatewaySettings__FileStorage__Encryption__Iterations=10000
      - MngDataGatewaySettings__FileStorage__Encryption__SaltLength=16
      
      # FileStorage Compression Configuration
      - MngDataGatewaySettings__FileStorage__Compression__Algorithm=gzip
      - MngDataGatewaySettings__FileStorage__Compression__Level=6
      - MngDataGatewaySettings__FileStorage__Compression__Enabled=true
      
      # FileStorage Validation Configuration
      - MngDataGatewaySettings__FileStorage__Validation__MaxFileSize=5242880
      - MngDataGatewaySettings__FileStorage__Validation__AllowedMimeTypes=
      - MngDataGatewaySettings__FileStorage__Validation__AllowedExtensions=
      - MngDataGatewaySettings__FileStorage__Validation__FolderPathPattern=^[a-zA-Z0-9_\\-/]+$
      - MngDataGatewaySettings__FileStorage__Validation__MaxFolderDepth=10
      - MngDataGatewaySettings__FileStorage__Validation__MaxPathLength=512
      
      # FileStorage Retry Configuration
      - MngDataGatewaySettings__FileStorage__Retry__MaxAttempts=3
      - MngDataGatewaySettings__FileStorage__Retry__InitialDelayMs=1000
      - MngDataGatewaySettings__FileStorage__Retry__MaxDelayMs=10000
      - MngDataGatewaySettings__FileStorage__Retry__BackoffMultiplier=2.0
    
    networks:
      - mng_common_mng_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5010/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mngllm:
    build:
      context: ../../MngLLM
      dockerfile: Presentation/MngLLM.Api/Dockerfile
    image: localhost:5000/mngllm:1.0.0
    container_name: mngllm
    ports:
      - "5030:5030"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Development
      
      # Server Configuration
      - MngLLMSettings__Server__Host=0.0.0.0
      - MngLLMSettings__Server__Port=5030
      - MngLLMSettings__Server__Scheme=http
      - MngLLMSettings__OpenApiServerPath=https://api.monitra.local/llm
      
      # Ollama Configuration
      - MngLLMSettings__Ollama__BaseUrl=http://ollama:11434
      - MngLLMSettings__Ollama__DefaultModel=qwen2.5:3b
      - MngLLMSettings__Ollama__Timeout=120
      - MngLLMSettings__Ollama__MaxRetries=2
      - MngLLMSettings__Ollama__EnableStreaming=false
      
      # Translation Configuration
      - MngLLMSettings__Translation__SupportedLanguages__0=tr
      - MngLLMSettings__Translation__SupportedLanguages__1=en
      - MngLLMSettings__Translation__SupportedLanguages__2=fr
      - MngLLMSettings__Translation__SupportedLanguages__3=ar
      - MngLLMSettings__Translation__SupportedLanguages__4=zh
      - MngLLMSettings__Translation__CacheEnabled=true
      - MngLLMSettings__Translation__CacheTTL=3600
      
      # Actors Configuration
      - MngLLMSettings__Actors__MngKeeper=http://mngkeeper:5001
      - MngLLMSettings__Actors__MngDataGateway=http://mngdatagateway:5010
      
      # Documentation Configuration
      - MngLLMSettings__Documentation__MarkdownPath=/app/docs/content
      - MngLLMSettings__Documentation__SearchLimit=5
      - MngLLMSettings__Documentation__ReindexIntervalMinutes=60
      - MngLLMSettings__Documentation__EnableAutoReindex=true
      
      # Documentation Service Endpoints
      - MngLLMSettings__Documentation__ServiceEndpoints__0__ServiceName=MngDataGateway
      - MngLLMSettings__Documentation__ServiceEndpoints__0__BaseUrl=http://mngdatagateway:5010
      - MngLLMSettings__Documentation__ServiceEndpoints__0__OpenApiPath=/api-docs/v1/swagger.json
      - MngLLMSettings__Documentation__ServiceEndpoints__1__ServiceName=MngKeeper
      - MngLLMSettings__Documentation__ServiceEndpoints__1__BaseUrl=http://mngkeeper:5001
      - MngLLMSettings__Documentation__ServiceEndpoints__1__OpenApiPath=/api-docs/v1/swagger.json
      - MngLLMSettings__Documentation__ServiceEndpoints__2__ServiceName=MngHub
      - MngLLMSettings__Documentation__ServiceEndpoints__2__BaseUrl=http://mnghub:5020
      - MngLLMSettings__Documentation__ServiceEndpoints__2__OpenApiPath=/api-docs/v1/swagger.json
      - MngLLMSettings__Documentation__ServiceEndpoints__3__ServiceName=MngLLM
      - MngLLMSettings__Documentation__ServiceEndpoints__3__BaseUrl=http://mngllm:5030
      - MngLLMSettings__Documentation__ServiceEndpoints__3__OpenApiPath=/api-docs/v1/swagger.json
      - MngLLMSettings__Documentation__ServiceEndpoints__4__ServiceName=MngGateway
      - MngLLMSettings__Documentation__ServiceEndpoints__4__BaseUrl=http://mnggateway:5040
      - MngLLMSettings__Documentation__ServiceEndpoints__4__OpenApiPath=/api-docs/v1/swagger.json
      - MngLLMSettings__Documentation__ServiceEndpoints__5__ServiceName=MngNotifier
      - MngLLMSettings__Documentation__ServiceEndpoints__5__BaseUrl=http://mngnotifier:5070
      - MngLLMSettings__Documentation__ServiceEndpoints__5__OpenApiPath=/api-docs/v1/swagger.json
      - MngLLMSettings__Documentation__ServiceEndpoints__6__ServiceName=MngScheduler
      - MngLLMSettings__Documentation__ServiceEndpoints__6__BaseUrl=http://mngscheduler:5090
      - MngLLMSettings__Documentation__ServiceEndpoints__6__OpenApiPath=/api-docs/v1/swagger.json
      - MngLLMSettings__Documentation__ServiceEndpoints__7__ServiceName=MngAdmin
      - MngLLMSettings__Documentation__ServiceEndpoints__7__BaseUrl=http://mngadmin:5080
      - MngLLMSettings__Documentation__ServiceEndpoints__7__OpenApiPath=/api-docs/v1/swagger.json
      
      # Certificate Settings (not needed - HTTP behind Gateway)
      - MngLLMSettings__CertificateSettings__DNS=
    
    volumes:
      # Mount documentation content
      - ../../docs/content:/app/docs/content:ro
    
    networks:
      - mng_common_mng_network
    
    depends_on:
      - ollama
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5030/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mngnotifier:
    build:
      context: ../../MngNotifier
      dockerfile: Presentation/MngNotifier.Api/Dockerfile
    image: localhost:5000/mngnotifier:1.0.0
    container_name: mngnotifier
    ports:
      - "5070:5070"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Development
      
      # Server Configuration
      - MngNotifierSettings__Server__Host=0.0.0.0
      - MngNotifierSettings__Server__Port=5070
      - MngNotifierSettings__Server__Scheme=http
      
      # RabbitMQ Configuration
      - MngNotifierSettings__RabbitMQ__Host=rabbitmq
      - MngNotifierSettings__RabbitMQ__Port=5672
      - MngNotifierSettings__RabbitMQ__Username=admin
      - MngNotifierSettings__RabbitMQ__Password=admin123
      - MngNotifierSettings__RabbitMQ__VirtualHost=/
      
      # Mail Configuration (Gmail for testing)
      - MngNotifierSettings__Mail__Provider=SMTP
      - MngNotifierSettings__Mail__DefaultFrom__Email=sermeral@gmail.com
      - MngNotifierSettings__Mail__DefaultFrom__Name=MonitraNG Test
      - MngNotifierSettings__Mail__Smtp__Host=smtp.gmail.com
      - MngNotifierSettings__Mail__Smtp__Port=587
      - MngNotifierSettings__Mail__Smtp__Username=sermeral@gmail.com
      - MngNotifierSettings__Mail__Smtp__Password=uluhrleijgwhjxmw
      - MngNotifierSettings__Mail__Smtp__EnableSsl=true
      
      # DataGateway Configuration
      - MngNotifierSettings__DataGateway__BaseUrl=http://mngdatagateway:5010
      - MngNotifierSettings__DataGateway__ApiVersion=v1
      - MngNotifierSettings__InternalNotifyApiKey=${INTERNAL_NOTIFY_API_KEY:-}
    
    networks:
      - mng_common_mng_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5070/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mngui:
    build:
      context: ../../Mng.Ui
      dockerfile: Dockerfile
    image: localhost:5000/mngui:1.0.0
    container_name: mngui
    ports:
      - "4000:80"
    environment:
      # Individual service URLs (Browser'dan erişilebilir URL'ler kullanılmalı)
      # Docker container içinde değil, browser'da çalıştığı için localhost kullanıyoruz
      - KEEPER_URL=http://localhost:5001
      - DATAGATEWAY_URL=http://localhost:5010
      - HUB_URL=http://localhost:5020
      # Gateway URL boş bırakılıyor (şimdilik direkt servisler kullanılıyor)
      - GATEWAY_URL=
    networks:
      - mng_common_mng_network
    depends_on:
      - mngkeeper
      - mngdatagateway
      - mnghub
      - mngllm
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mngdomainui:
    build:
      context: ../../MngDomainUI
      dockerfile: Dockerfile
    image: localhost:5000/mngdomainui:1.0.0
    container_name: mngdomainui
    ports:
      - "3001:3000"
    environment:
      # Server-side only (private) - Keycloak and MinIO config
      # Note: keycloak and minio are in mng_common network, accessible via hostnames
      - KEYCLOAK_BASE_URL=http://keycloak:8080
      - KEYCLOAK_PATH_PREFIX=
      - KEYCLOAK_ADMIN_USER=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_USE_SSL=false
      # Server-side API URLs (for container-to-container communication)
      - SERVER_KEEPER_URL=http://mngkeeper:5001
      - SERVER_DATAGATEWAY_URL=http://mngdatagateway:5010
      - SERVER_HUB_URL=http://mnghub:5020
      - SERVER_SCHEDULER_URL=http://mngscheduler:5090
      - SERVER_ADMIN_URL=http://mngadmin:5080
      # Public (client-side) - API URLs (Browser'dan erişilebilir URL'ler)
      - KEEPER_URL=http://localhost:5001
      - DATAGATEWAY_URL=http://localhost:5010
      - HUB_URL=http://localhost:5020
      - SCHEDULER_URL=http://localhost:5090
      - ADMIN_URL=http://localhost:5080
      - GATEWAY_URL=
    networks:
      - mng_common_mng_network
    depends_on:
      - mngkeeper
      - mngdatagateway
      - mnghub
      - mngllm
      - mngscheduler
      - mngadmin
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mngadmin:
    build:
      context: ../../MngAdmin
      dockerfile: Presentation/MngAdmin.Api/Dockerfile
    image: localhost:5000/mngadmin:1.0.0
    container_name: mngadmin
    ports:
      - "5080:5080"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Development
      
      # Server Configuration
      - MngAdminSettings__Server__Host=0.0.0.0
      - MngAdminSettings__Server__Port=5080
      - MngAdminSettings__Server__Scheme=http
      - MngAdminSettings__OpenApiServerPath=https://api.monitra.local/admin
      
      # MongoDB Configuration
      - MngAdminSettings__MongoDB__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngAdminSettings__MongoDB__MngKeeperDatabaseName=mngkeeper
      
      # Actors Configuration
      - MngAdminSettings__Actors__MngKeeper=http://mngkeeper:5001
      
      # RabbitMQ Configuration
      - MngAdminSettings__RabbitMQ__Host=rabbitmq
      - MngAdminSettings__RabbitMQ__Port=5672
      - MngAdminSettings__RabbitMQ__Username=admin
      - MngAdminSettings__RabbitMQ__Password=admin123
      - MngAdminSettings__RabbitMQ__VirtualHost=/
      
      # Backup Configuration
      - MngAdminSettings__Backup__MaxBackupCount=10
      - MngAdminSettings__Backup__MinIO__SystemBucket=system
      - MngAdminSettings__Backup__MinIO__SystemBackupPath=backup
      - MngAdminSettings__Backup__MinIO__DomainBackupPath=backups
      - MngAdminSettings__Backup__MongoDB__Compression=zip
      - MngAdminSettings__Backup__PostgreSQL__Compression=gzip
      - MngAdminSettings__Backup__PostgreSQL__Databases__0=keycloak
      - MngAdminSettings__Backup__PostgreSQL__ConnectionString=Host=postgres;Port=5432;Database={database};Username=keycloak;Password=keycloak123
      # PgDumpPath is not needed in Docker (pg_dump is in PATH)
      
      # MinIO Configuration
      - MngAdminSettings__MinIO__Endpoint=minio:9000
      - MngAdminSettings__MinIO__AccessKey=admin
      - MngAdminSettings__MinIO__SecretKey=admin123
      - MngAdminSettings__MinIO__UseSSL=false
      - MngAdminSettings__MinIO__Region=us-east-1
      
      # Certificate Settings
      - MngAdminSettings__CertificateSettings__DNS=mngadmin
    
    networks:
      - mng_common_mng_network
      - mng_network  # PostgreSQL erişimi için
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mngscheduler:
    build:
      context: ../../MngScheduler
      dockerfile: Presentation/MngScheduler.Api/Dockerfile
    image: localhost:5000/mngscheduler:1.0.0
    container_name: mngscheduler
    ports:
      - "5090:5090"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Development
      
      # Server Configuration
      - MngSchedulerSettings__Server__Host=0.0.0.0
      - MngSchedulerSettings__Server__Port=5090
      - MngSchedulerSettings__Server__Scheme=http
      - MngSchedulerSettings__OpenApiServerPath=https://api.monitra.local/scheduler
      
      # MongoDB Configuration
      - MngSchedulerSettings__MongoDB__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngSchedulerSettings__MongoDB__KeeperDatabaseName=mngkeeper
      
      # Actors Configuration
      - MngSchedulerSettings__Actors__MngKeeper=http://mngkeeper:5001
      
      # RabbitMQ Configuration
      - MngSchedulerSettings__RabbitMQ__Host=rabbitmq
      - MngSchedulerSettings__RabbitMQ__Port=5672
      - MngSchedulerSettings__RabbitMQ__Username=admin
      - MngSchedulerSettings__RabbitMQ__Password=admin123
      - MngSchedulerSettings__RabbitMQ__VirtualHost=/
      
      # DataGateway Configuration
      - MngSchedulerSettings__DataGateway__BaseUrl=http://mngdatagateway:5010
      - MngSchedulerSettings__DataGateway__ApiVersion=v1
      
      # JobSync Configuration
      - MngSchedulerSettings__JobSync__SyncIntervalSeconds=30
      - MngSchedulerSettings__JobSync__Enabled=true
      
      # Quartz Configuration
      - MngSchedulerSettings__Quartz__SchedulerName=MngScheduler
      - MngSchedulerSettings__Quartz__ThreadPool__ThreadCount=10
      
      # HttpClient Configuration
      - MngSchedulerSettings__HttpClient__TimeoutSeconds=300
      - MngSchedulerSettings__HttpClient__MaxRetries=3
      
      # Certificate Settings
      - MngSchedulerSettings__CertificateSettings__DNS=mngscheduler
    
    networks:
      - mng_common_mng_network
    
    depends_on:
      - mngkeeper
      - mngdatagateway
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5090/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mngworkflow:
    build:
      context: ../../MngWorkflow
      dockerfile: Presentation/MngWorkflow.Api/Dockerfile
    image: localhost:5000/mngworkflow:1.0.0
    container_name: mngworkflow
    ports:
      - "5085:5085"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5085
      - MngWorkflowSettings__DataGatewayBaseUrl=http://mngdatagateway:5010
      - MngWorkflowSettings__NotifierBaseUrl=http://mngnotifier:5070
      - MngWorkflowSettings__RabbitMq__Host=rabbitmq
      - MngWorkflowSettings__RabbitMq__Port=5672
      - MngWorkflowSettings__RabbitMq__VirtualHost=/
      - MngWorkflowSettings__RabbitMq__Username=admin
      - MngWorkflowSettings__RabbitMq__Password=admin123
      - Jwt__Authority=http://keycloak:8080/realms/monitra
    networks:
      - mng_common_mng_network
    depends_on:
      - mngdatagateway
      - mngnotifier
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5085/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  mngoperations:
    build:
      context: ../../MngOperations
      dockerfile: Presentation/MngOperations.Api/Dockerfile
    image: localhost:5000/mngoperations:1.0.0
    container_name: mngoperations
    ports:
      - "5086:5086"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - EnableSwagger=true
      - Jwt__Authority=http://keycloak:8080/realms/monitra
      - Jwt__RequireHttpsMetadata=false
      - MngOperationsSettings__Server__Host=0.0.0.0
      - MngOperationsSettings__Server__Port=5086
      - MngOperationsSettings__Server__Scheme=http
      - MngOperationsSettings__OpenApiServerPath=https://api.monitra.local/operations
      - MngOperationsSettings__Actors__MngKeeper=http://mngkeeper:5001
      - MngOperationsSettings__Actors__KeycloakBaseUrl=http://keycloak:8080
      - MngOperationsSettings__DataGateway__BaseUrl=http://mngdatagateway:5010
      - MngOperationsSettings__DataGateway__ApiVersion=v1
      - MngOperationsSettings__MngNotifiers__Enabled=true
      - MngOperationsSettings__MngNotifiers__BaseUrl=http://mngnotifier:5070
      - MngOperationsSettings__MngNotifiers__ApiVersion=v1
      - MngOperationsSettings__RabbitMq__Host=rabbitmq
      - MngOperationsSettings__RabbitMq__Port=5672
      - MngOperationsSettings__RabbitMq__Username=admin
      - MngOperationsSettings__RabbitMq__Password=admin123
      - MngOperationsSettings__RabbitMq__VirtualHost=/
      - MngOperationsSettings__RabbitMq__Exchange=oc.events
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:80
    networks:
      - mng_common_mng_network
    depends_on:
      - mngdatagateway
      - mngnotifier
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5086/api/v1/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mngdocument:
    build:
      context: ../../MngDocument
      dockerfile: Presentation/MngDocument.Api/Dockerfile
    image: localhost:5000/mngdocument:1.0.0
    container_name: mngdocument
    ports:
      - "5095:5095"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - EnableSwagger=true
      - Jwt__Authority=http://keycloak:8080/realms/monitra
      - Jwt__RequireHttpsMetadata=false
      - MngDocumentSettings__Server__Host=0.0.0.0
      - MngDocumentSettings__Server__Port=5095
      - MngDocumentSettings__Server__Scheme=http
      - MngDocumentSettings__OpenApiServerPath=https://api.monitra.local/documents
      - MngDocumentSettings__DataGateway__BaseUrl=http://mngdatagateway:5010
      - MngDocumentSettings__DataGateway__ApiVersion=v1
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:80
    networks:
      - mng_common_mng_network
    depends_on:
      - mngdatagateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5095/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - mng_common_mng_network
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'
        reservations:
          memory: 2G
          cpus: '2'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mkdocs:
    build:
      context: ../../docs
      dockerfile: Dockerfile
    image: localhost:5000/mkdocs:1.0.0
    container_name: mkdocs
    ports:
      - "6010:80"  # Documentation site port
    networks:
      - mng_common_mng_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ollama_data:
    driver: local

networks:
  mng_common_mng_network:
    external: true
  mng_network:
    external: true