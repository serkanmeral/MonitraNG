services:
  mnggateway:
    build:
      context: ../../MngGateway
      dockerfile: Presentation/MngGateway.Api/Dockerfile
    image: localhost:5000/mnggateway:1.0.0
    container_name: mnggateway
    ports:
      - "5040:5000"  # HTTP port
      - "5443:5000"  # HTTPS port (alternative)
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Development
      
      # Server Configuration
      - MngGatewaySettings__Server__Host=0.0.0.0
      - MngGatewaySettings__Server__Port=5000
      - MngGatewaySettings__Server__Scheme=https
      - MngGatewaySettings__OpenApiServerPath=https://api.monitra.local
      
      # JWT Configuration
      - MngGatewaySettings__Jwt__Authority=http://keycloak:8080/realms/monitra
      - MngGatewaySettings__Jwt__Audience=account
      - MngGatewaySettings__Jwt__RequireHttpsMetadata=false
      
      # CORS Configuration
      - MngGatewaySettings__Cors__AllowedOrigins__0=https://app.monitra.local
      - MngGatewaySettings__Cors__AllowedOrigins__1=http://localhost:3000
      - MngGatewaySettings__Cors__AllowCredentials=true
      
      # Rate Limit Configuration
      - MngGatewaySettings__RateLimit__EnableRateLimiting=true
      - MngGatewaySettings__RateLimit__AnonymousLimit=30
      - MngGatewaySettings__RateLimit__AuthenticatedLimit=100
      - MngGatewaySettings__RateLimit__AdminLimit=500
      - MngGatewaySettings__RateLimit__Period=1m
      
      # Backend Services Configuration
      - MngGatewaySettings__BackendServices__MngKeeper=http://mngkeeper:5001
      - MngGatewaySettings__BackendServices__MngDataGateway=http://mngdatagateway:5010
      - MngGatewaySettings__BackendServices__MngHub=http://mnghub:5020
      - MngGatewaySettings__BackendServices__MngReactor=http://mngreactor:5003
      - MngGatewaySettings__BackendServices__KeyCloak=http://keycloak:8080
      
      # Certificate Settings
      - MngGatewaySettings__CertificateSettings__DNS=mnggateway
    
    networks:
      - mng_common_mng_network
    
    depends_on:
      - mngkeeper
      - mngdatagateway
      - mnghub
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mngkeeper:
    build:
      context: ../../MngKeeper
      dockerfile: Presentation/MngKeeper.Api/Dockerfile
    image: localhost:5000/mngkeeper:1.1.0
    container_name: mngkeeper
    ports:
      - "5001:5001"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Development
      
      # Server Configuration
      - MngKeeperSettings__Server__Host=0.0.0.0
      - MngKeeperSettings__Server__Port=5001
      - MngKeeperSettings__Server__Scheme=https
      - MngKeeperSettings__OpenApiServerPath=https://localhost:5001
      
      # MongoDB Configuration
      - MngKeeperSettings__MongoDB__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngKeeperSettings__MongoDB__DatabaseName=mngkeeper
      
      # Keycloak Configuration
      - MngKeeperSettings__Keycloak__BaseUrl=http://keycloak:8080
      - MngKeeperSettings__Keycloak__AdminUsername=admin
      - MngKeeperSettings__Keycloak__AdminPassword=admin123
      - MngKeeperSettings__Keycloak__ClientId=mng-keeper-admin
      - MngKeeperSettings__Keycloak__ClientSecret=MSG9QBXtnFNlPHCA8DrmTqXpQHXhZ2HK
      - MngKeeperSettings__Keycloak__DefaultAdminPassword=Admin123!
      
      # Redis Configuration
      - MngKeeperSettings__Redis__ConnectionString=redis:6379,password=redis123
      
      # RabbitMQ Configuration
      - MngKeeperSettings__RabbitMQ__Host=rabbitmq
      - MngKeeperSettings__RabbitMQ__Port=5672
      - MngKeeperSettings__RabbitMQ__Username=admin
      - MngKeeperSettings__RabbitMQ__Password=admin123
      - MngKeeperSettings__RabbitMQ__VirtualHost=/
      
      # MQTT Configuration
      - MngKeeperSettings__Mqtt__BrokerHost=mosquitto
      - MngKeeperSettings__Mqtt__BrokerPort=1883
      - MngKeeperSettings__Mqtt__Username=monitrang
      - MngKeeperSettings__Mqtt__Password=!2345qawsedrf
      - MngKeeperSettings__Mqtt__TopicPrefix=MNG
      
      # MinIO Configuration
      - MngKeeperSettings__MinIO__Endpoint=minio:9000
      - MngKeeperSettings__MinIO__AccessKey=admin
      - MngKeeperSettings__MinIO__SecretKey=admin123
      - MngKeeperSettings__MinIO__UseSSL=false
      - MngKeeperSettings__MinIO__Region=us-east-1
      
      # Certificate Settings (auto-generate self-signed)
      - MngKeeperSettings__CertificateSettings__DNS=mngkeeper
    
    networks:
      - mng_common_mng_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:5001/api/version/short || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mnghub:
    build:
      context: ../../MngHub
      dockerfile: Presentation/MngHub.Api/Dockerfile
    image: localhost:5000/mnghub:1.0.0
    container_name: mnghub
    ports:
      - "5020:5020"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Development
      
      # Server Configuration
      - MngHubSettings__Server__Host=0.0.0.0
      - MngHubSettings__Server__Port=5020
      - MngHubSettings__Server__Scheme=http
      - MngHubSettings__OpenApiServerPath=http://localhost:5020
      
      # RabbitMQ Configuration
      - MngHubSettings__RabbitMQ__Host=rabbitmq
      - MngHubSettings__RabbitMQ__Port=5672
      - MngHubSettings__RabbitMQ__Username=admin
      - MngHubSettings__RabbitMQ__Password=admin123
      - MngHubSettings__RabbitMQ__VirtualHost=/
      - MngHubSettings__RabbitMQ__ExchangeName=mng.topics
      - MngHubSettings__RabbitMQ__EventPublisherExchangeName=mngkeeper.events
      
      # Actors Configuration
      - MngHubSettings__Actors__MngKeeper=https://mngkeeper:5001
      
      # CORS Configuration
      - MngHubSettings__Cors__AllowedOrigins__0=http://localhost:3000
      - MngHubSettings__Cors__AllowedOrigins__1=https://localhost:3000
      - MngHubSettings__Cors__AllowCredentials=true
      
      # Certificate Settings
      - MngHubSettings__CertificateSettings__DNS=mnghub
    
    networks:
      - mng_common_mng_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5020/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mngdatagateway:
    build:
      context: ../../MngDataGateway
      dockerfile: Presentation/MngDataGateway.Api/Dockerfile
    image: localhost:5000/mngdatagateway:1.0.0
    container_name: mngdatagateway
    ports:
      - "5010:5010"
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Development
      
      # Server Configuration
      - MngDataGatewaySettings__Server__Host=0.0.0.0
      - MngDataGatewaySettings__Server__Port=5010
      - MngDataGatewaySettings__Server__Scheme=https
      - MngDataGatewaySettings__OpenApiServerPath=https://localhost:5010
      
      # MongoDB Configuration
      - MngDataGatewaySettings__MongoDB__ConnectionString=mongodb://admin:admin123@mongo:27017
      
      # Actors Configuration (MngKeeper)
      - MngDataGatewaySettings__Actors__MngKeeper=https://mngkeeper:5001
      
      # RabbitMQ Configuration
      - MngDataGatewaySettings__RabbitMQ__Host=rabbitmq
      - MngDataGatewaySettings__RabbitMQ__Port=5672
      - MngDataGatewaySettings__RabbitMQ__Username=admin
      - MngDataGatewaySettings__RabbitMQ__Password=admin123
      - MngDataGatewaySettings__RabbitMQ__VirtualHost=/
      
      # Query Configuration
      - MngDataGatewaySettings__Query__RelationExpansionMaxDepth=2
      - MngDataGatewaySettings__Query__DefaultPageSize=50
      - MngDataGatewaySettings__Query__MaxPageSize=1000
      
      # History Configuration
      - MngDataGatewaySettings__History__MaxHistoryEntries=50
      
      # Deleted Data Configuration
      - MngDataGatewaySettings__DeletedData__RetentionDays=7
      
      # Validation Configuration
      - MngDataGatewaySettings__Validation__HttpValidationTimeout=30
      
      # Certificate Settings (auto-generate self-signed)
      - MngDataGatewaySettings__CertificateSettings__DNS=mngdatagateway
    
    networks:
      - mng_common_mng_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:5010/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mngui:
    build:
      context: ../../Mng.Ui
      dockerfile: Dockerfile
    image: localhost:5000/mngui:1.0.0
    container_name: mngui
    ports:
      - "3000:80"
    environment:
      # Individual service URLs (Browser'dan erişilebilir URL'ler kullanılmalı)
      # Docker container içinde değil, browser'da çalıştığı için localhost kullanıyoruz
      - KEEPER_URL=https://localhost:5001
      - DATAGATEWAY_URL=https://localhost:5010
      - HUB_URL=http://localhost:5020
      # Gateway URL boş bırakılıyor (şimdilik direkt servisler kullanılıyor)
      - GATEWAY_URL=
    networks:
      - mng_common_mng_network
    depends_on:
      - mngkeeper
      - mngdatagateway
      - mnghub
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mng_common_mng_network:
    external: true
