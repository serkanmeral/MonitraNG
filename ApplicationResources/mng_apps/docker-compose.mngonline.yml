# monitrang.com (host nginx) overlay — publish ports expected by /etc/nginx/sites-enabled/monitrang
# Usage: docker compose -f docker-compose.production.yml -f docker-compose.mngonline.yml ...
#
# Host nginx:
#   app.monitrang.com  → http://localhost:3000  (mngui)
#   api.monitrang.com  → https://127.0.0.1:5000 (mnggateway)
#   /hub/              → https://127.0.0.1:5000/hub/

services:
  mnggateway:
    ports:
      - "${GATEWAY_PORT:-5000}:5000"

  mngui:
    ports:
      - "${UI_PORT:-3000}:80"

  mngdomainui:
    ports:
      - "${DOMAINUI_PORT:-3001}:3000"
