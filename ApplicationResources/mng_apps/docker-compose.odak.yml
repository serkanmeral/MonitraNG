# Odak — Nginx yok; host portları açık, Ollama kapalı (RAM)
# Ön koşul: mng_common (docker-compose.odak.yml) ayakta, mng_common_mng_network mevcut
#
#   docker compose -f docker-compose.production.yml -f docker-compose.odak.yml --env-file .env up -d --build

services:
  mnggateway:
    ports:
      - "5040:5000"
    environment:
      - MngGatewaySettings__Server__Scheme=http
      - MngGatewaySettings__OpenApiServerPath=${OPENAPI_SERVER_PATH:-http://192.168.20.20:5040}
      - MngGatewaySettings__Jwt__Authority=http://keycloak:8080/keycloak/realms/monitra
      - MngGatewaySettings__Jwt__RequireHttpsMetadata=false
      - MngGatewaySettings__Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_1:-http://192.168.20.20:3000}

  mngkeeper:
    ports:
      - "5001:5001"
    environment:
      # Scalar :5001 üzerinde Try it out → doğrudan Keeper (5040 gateway kökü 404 verir)
      - MngKeeperSettings__OpenApiServerPath=http://192.168.20.20:5001

  mngdatagateway:
    ports:
      - "5010:5010"

  # C6: gercek MngReactor (production.yml build/image inherit) + native observation publish
  mngreactor:
    ports:
      - "5003:5003"
    environment:
      - MngReactorSettings__OpenApiServerPath=http://192.168.20.20:5040/reactor
      - MngReactorSettings__EngineServerUrl=http://mngreactor:5003
      - MngReactorSettings__Actors__MngKeeperEngineUrl=http://mngkeeper:5001
      - MngReactorSettings__MongoDB__Host=mongo
      - MngReactorSettings__MongoDB__Password=${MONGO_PASSWORD:-admin123}
      - MngReactorSettings__RabbitMQ__Host=rabbitmq
      - MngReactorSettings__RabbitMQ__Password=${RABBITMQ_PASSWORD:-admin123}
      - MngReactorSettings__Mqtt__Host=mosquitto
      - MngReactorSettings__ObservationPublish__Enabled=true
      - MngReactorSettings__SecEvents__HotTtlDays=60
      - MngReactorSettings__SecEvents__DropUnknownEvents=true
      - MngReactorSettings__SecEvents__PersistFullRaw=false
      # Agent host events live in OpenSearch via LogCollector — SIEM reads OS
      - MngReactorSettings__SecEvents__OpenSearchDualWriteEnabled=true
      - MngReactorSettings__SecEvents__OpenSearchReadEnabled=true
      - MngReactorSettings__SecEvents__OpenSearchUrl=http://opensearch:9200
      # NXLog + Linux UDP syslog retired — host Windows/Linux via MngLogs agent only
      - MngReactorSettings__SecEvents__AcceptNxlogIngest=false
      - MngReactorSettings__SecEvents__AcceptLinuxSyslogIngest=false

  mngengine:
    ports:
      - "5037:5037"
      # FortiGate syslog only (NXLog + Linux rsyslog UDP removed)
      - "541:541/udp"
      - "542:542/udp"
    environment:
      - MngEngine__Mqtt__Host=mosquitto
      - MngEngine__Mqtt__UserName=${MQTT_USERNAME:-monitrang}
      - MngEngine__Mqtt__Password=${MQTT_PASSWORD:-!2345qawsedrf}
      - MngEngine__SecEventQueue__AcceptNxlogIngest=false
      - MngEngine__SecEventQueue__AcceptLinuxSyslogIngest=false
      - MngEngine__SecEventQueue__WecIngestEnabled=false
      - MngEngine__SecEventQueue__UdpPort=541
      - MngEngine__SecEventQueue__UdpListeners__0__UdpPort=541
      - MngEngine__SecEventQueue__UdpListeners__0__SourceType=firewall
      - MngEngine__SecEventQueue__UdpListeners__0__SourceProduct=fortigate
      - MngEngine__SecEventQueue__UdpListeners__1__UdpPort=542
      - MngEngine__SecEventQueue__UdpListeners__1__SourceType=firewall
      - MngEngine__SecEventQueue__UdpListeners__1__SourceProduct=fortigate

  mnghub:
    ports:
      - "5020:5020"

  mnglogcollector:
    ports:
      - "5091:5091"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - EnableSwagger=false
      - MngLogCollectorSettings__OpenSearch__Url=http://opensearch:9200
      - MngLogCollectorSettings__OpenSearch__WriteEnabled=true
      - MngLogCollectorSettings__Ingest__ApiKey=${MNGLOGCOLLECTOR_INGEST_API_KEY:-}
      - MngLogCollectorSettings__MongoDB__ConnectionString=mongodb://admin:${MONGO_PASSWORD:-admin123}@mongo:27017
      - MngLogCollectorSettings__MongoDB__KeeperDatabaseName=mngkeeper
      - MngLogCollectorSettings__MongoDB__EventLogCatalogDatabaseName=mng_odak
      - MngLogCollectorSettings__Discovery__Prefixes__0__Cidr=192.168.20.0/24
      - MngLogCollectorSettings__Discovery__Prefixes__0__Label=Odak ofis
      - MngLogCollectorSettings__RabbitMq__Host=rabbitmq
      - MngLogCollectorSettings__RabbitMq__Port=5672
      - MngLogCollectorSettings__RabbitMq__VirtualHost=/
      - MngLogCollectorSettings__RabbitMq__Username=admin
      - MngLogCollectorSettings__RabbitMq__Password=${RABBITMQ_PASSWORD:-admin123}
      - MngLogCollectorSettings__ObservationPublish__Enabled=true
      - MngLogCollectorSettings__ObservationPublish__SourceProducts__0=*

  # Ollama/MngLLM kapalı; mngui nginx "mngllm" upstream + depends_on için stub
  ollama:
    build: !reset null
    image: alpine:3.19
    container_name: ollama
    command: ["sleep", "infinity"]
    networks:
      - mng_common_mng_network
    restart: unless-stopped

  mngllm:
    build: !reset null
    image: alpine:3.19
    container_name: mngllm
    command: ["sleep", "infinity"]
    depends_on:
      - ollama
    networks:
      - mng_common_mng_network
    restart: unless-stopped

  mngscheduler:
    ports:
      - "5090:5090"

  mngworkflow:
    ports:
      - "5085:5085"
    environment:
      - EnableDevWorkflowEndpoints=true
      - MngWorkflowSettings__MongoDb__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngWorkflowSettings__Secrets__EncryptionKeyBase64=MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXY=

  mngworkflow-worker:
    environment:
      - MngWorkflowSettings__MongoDb__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngWorkflowSettings__Secrets__EncryptionKeyBase64=MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXY=
      - MngWorkflowSettings__EngineCommand__DevLogOnly=false
      - MngWorkflowSettings__EngineCommand__ReactorBaseUrl=http://mngreactor:5003
      - MngWorkflowSettings__Engine__PrefetchCount=32
      - MngWorkflowSettings__Engine__EventTrigger__PrefetchCount=32

  mngalarm:
    ports:
      - "5087:5087"
    environment:
      - EnableDevAlarmEndpoints=true
      - MngAlarmSettings__MongoDb__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngAlarmSettings__Engine__ConsumeObservations=false

  mngalarm-worker:
    environment:
      - MngAlarmSettings__MongoDb__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MngAlarmSettings__Engine__ReactorBridge__Enabled=false
      - MngAlarmSettings__Engine__ObservationPrefetch=32
      - MngAlarmSettings__Engine__UpdatedPublishMinIntervalSeconds=5

  mngoperations:
    ports:
      - "5086:5086"
    environment:
      - Jwt__Authority=http://keycloak:8080/keycloak/realms/monitra
      - MngOperationsSettings__OpenApiServerPath=http://192.168.20.20:5040/operations
      - MngOperationsSettings__Actors__KeycloakBaseUrl=http://keycloak:8080/keycloak
      # perf/oc-optimization ölçüm bayrağı (flag-gated; ölçüm için 'true' yapılır, üretimde kapalı).
      - MngOperationsSettings__PerfDiagnostics=false

  mngdocument:
    ports:
      - "5095:5095"
    environment:
      - Jwt__Authority=http://keycloak:8080/keycloak/realms/monitra
      - MngDocumentSettings__OpenApiServerPath=http://192.168.20.20:5040/documents
      - MngDocumentSettings__Collabora__Enabled=true
      - MngDocumentSettings__Collabora__PublicBaseUrl=http://192.168.20.20:9980
      - MngDocumentSettings__Collabora__EditorPath=/browser/dist/cool.html
      - MngDocumentSettings__Collabora__PostMessageOrigin=http://192.168.20.20:3000 http://127.0.0.1:3000 http://localhost:3000
      - MngDocumentSettings__Wopi__HostBaseUrl=http://mngdocument:5095
      - MngDocumentSettings__Wopi__SessionMinutes=480

  # Collabora — test host IP (prod: docker-compose.odak.prod.yml)
  collabora:
    ports:
      - "9980:9980"
    environment:
      - aliasgroup1=http://192.168.20.20:9980,http://192.168.20.20:5040,http://192.168.20.20:3000,http://192.168.20.8:3000,http://localhost:3000,http://127.0.0.1:3000,https://mng.odaksavunma.com,http://mngdocument:5095
    command:
      - --o:ssl.enable=false
      - --o:ssl.termination=false
      - --o:user_interface.mode=compact
      - --o:home_mode.enable=true
      - "--o:net.content_security_policy=frame-ancestors localhost:* 127.0.0.1:* 192.168.20.20:* 192.168.20.8:* mng.odaksavunma.com:* mngdocument:*;"

  mngadmin:
    ports:
      - "5080:5080"

  mngnotifier:
    ports:
      - "5070:5070"

  mngui:
    ports:
      - "3000:80"
    build:
      context: ../../Mng.Ui
      dockerfile: Dockerfile
      args:
        GATEWAY_URL: ${GATEWAY_URL:-http://192.168.20.20:5040}
        HUB_URL: ${HUB_URL:-http://192.168.20.20:5020}

  mngdomainui:
    ports:
      - "3001:3000"

