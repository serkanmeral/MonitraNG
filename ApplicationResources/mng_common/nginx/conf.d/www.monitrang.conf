# ============================================
# www.monitrang.com - Public landing (static HTML)
# Deploy: MngLanding/ → /var/www/www.monitrang.com/
# app.monitrang.com is unchanged (MngUI via monitrang.conf)
# ============================================

# monitrang.com → canonical www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitrang.com;

    ssl_certificate /etc/letsencrypt/live/monitrang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitrang.com/privkey.pem;
    include /etc/nginx/ssl/ssl-params.conf;

    return 301 https://www.monitrang.com$request_uri;
}

# www → static landing
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.monitrang.com;

    ssl_certificate /etc/letsencrypt/live/monitrang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitrang.com/privkey.pem;
    include /etc/nginx/ssl/ssl-params.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    access_log /var/log/nginx/www.monitrang.com-access.log;
    error_log /var/log/nginx/www.monitrang.com-error.log;

    root /var/www/www.monitrang.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
