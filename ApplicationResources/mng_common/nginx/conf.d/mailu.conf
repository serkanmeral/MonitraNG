# ============================================
# mail.monitrang.com - Mailu Mail Server
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name mail.monitrang.com;

    # Let's Encrypt verification için
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # HTTP → HTTPS redirect
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.monitrang.com;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/monitrang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitrang.com/privkey.pem;
    
    # SSL Configuration
    include /etc/nginx/ssl/ssl-params.conf;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/mail.monitrang.com-access.log;
    error_log /var/log/nginx/mail.monitrang.com-error.log;

    # Mailu Front (Nginx) - Container name kullanarak
    # Not: Mailu'nun kendi network'ünde olması durumunda network'e bağlanılması gerekebilir
    location / {
        proxy_pass http://mailu-front-1:80;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Mailu specific headers
        proxy_set_header X-Forwarded-Ssl on;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Request size limit (mail attachments için)
        client_max_body_size 50M;
        
        # Buffering
        proxy_buffering off;
    }
}

