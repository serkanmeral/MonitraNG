# ============================================
# admin.monitrang.com - Admin Tools Dashboard
# HTTP Basic Auth protected admin interface
# ============================================

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name admin.monitrang.com;

    # Let's Encrypt verification için
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # HTTP → HTTPS redirect
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server with HTTP Basic Auth
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.monitrang.com;

    # SSL Certificate (Let's Encrypt wildcard)
    ssl_certificate /etc/letsencrypt/live/monitrang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitrang.com/privkey.pem;
    
    # SSL Configuration
    include /etc/nginx/ssl/ssl-params.conf;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/admin.monitrang.com-access.log;
    error_log /var/log/nginx/admin.monitrang.com-error.log;

    # HTTP Basic Authentication (tüm admin UI'lar için)
    # ⚠️ DEVRE DIŞI: 7 Ocak 2026 - Tüm admin UI'lar için Basic Auth geçici olarak devre dışı bırakıldı
    # Her location'da auth_basic off; ile devre dışı bırakıldı
    # TODO: Güvenlik için Basic Auth'u tekrar aktif etmek gerekiyor (orta vade)
    # auth_basic "MonitraNG Admin Tools - Team Access Only";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # ============================================
    # Root - Admin Dashboard (Simple HTML)
    # ============================================
    location = / {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonitraNG Admin Tools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .tool-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: block;
        }
        .tool-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        .tool-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .tool-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
            text-align: center;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ MonitraNG Admin Tools</h1>
        <p class="subtitle">Infrastructure Management Dashboard</p>
        
        <div class="tools-grid">
            <a href="/portainer/" class="tool-card">
                <div class="tool-name">🐳 Portainer</div>
                <div class="tool-desc">Docker container management</div>
            </a>
            
            <a href="/rabbitmq/" class="tool-card">
                <div class="tool-name">🐰 RabbitMQ</div>
                <div class="tool-desc">Message queue management</div>
            </a>
            
            <a href="/seq/" class="tool-card">
                <div class="tool-name">📊 Seq</div>
                <div class="tool-desc">Centralized logging</div>
            </a>
            
            <a href="/mongo/" class="tool-card">
                <div class="tool-name">🍃 Mongo Express</div>
                <div class="tool-desc">MongoDB web admin</div>
            </a>
            
            <a href="/redis/" class="tool-card">
                <div class="tool-name">🔴 Redis Commander</div>
                <div class="tool-desc">Redis management UI</div>
            </a>
            
            <a href="/nodered/" class="tool-card">
                <div class="tool-name">🔴 Node-RED</div>
                <div class="tool-desc">Flow-based automation</div>
            </a>
        </div>
        
        <div class="footer">
            MonitraNG Test/Development Environment<br>
            Protected by HTTP Basic Authentication
        </div>
    </div>
</body>
</html>';
    }

    # ============================================
    # Portainer - Docker Container Management
    # ============================================
    location /portainer/ {
        # Disable Basic Auth for Portainer (it has its own authentication)
        auth_basic off;
        
        proxy_pass http://portainer:9000/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # RabbitMQ Management UI
    # ============================================
    location /rabbitmq/ {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        # RabbitMQ Management UI path rewrite
        rewrite ^/rabbitmq$ /rabbitmq/ permanent;
        rewrite ^/rabbitmq/(.*)$ /$1 break;
        
        proxy_pass http://rabbitmq:15672;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Seq - Centralized Logging
    # ============================================
    location /seq/ {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        proxy_pass http://seq:80/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Mongo Express - MongoDB Web Admin
    # ============================================
    location /mongo/ {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        # Mongo Express path rewrite
        rewrite ^/mongo$ /mongo/ permanent;
        rewrite ^/mongo/(.*)$ /$1 break;
        
        proxy_pass http://mongo_express:8081;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Redis Commander - Redis Management UI
    # ============================================
    location /redis/ {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        # Redis Commander path rewrite
        rewrite ^/redis$ /redis/ permanent;
        rewrite ^/redis/(.*)$ /$1 break;
        
        proxy_pass http://redis-commander:8081;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Node-RED - Flow-based Automation
    # ============================================
    location /nodered/ {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        # Use Docker embedded DNS for service name resolution at runtime
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 5s;
        set $nodered_upstream nodered;
        proxy_pass http://$nodered_upstream:1880/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

