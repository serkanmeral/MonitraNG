# ============================================
# admin.monitrang.com - Admin Tools Dashboard
# HTTP Basic Auth protected admin interface
# ============================================

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name admin.monitrang.com;

    # Let's Encrypt verification için
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # HTTP → HTTPS redirect
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server with HTTP Basic Auth
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.monitrang.com;

    # SSL Certificate (Let's Encrypt wildcard)
    ssl_certificate /etc/letsencrypt/live/monitrang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitrang.com/privkey.pem;
    
    # SSL Configuration
    include /etc/nginx/ssl/ssl-params.conf;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/admin.monitrang.com-access.log;
    error_log /var/log/nginx/admin.monitrang.com-error.log;

    # HTTP Basic Authentication (tüm admin UI'lar için)
    # ⚠️ DEVRE DIŞI: 7 Ocak 2026 - Tüm admin UI'lar için Basic Auth geçici olarak devre dışı bırakıldı
    # Her location'da auth_basic off; ile devre dışı bırakıldı
    # TODO: Güvenlik için Basic Auth'u tekrar aktif etmek gerekiyor (orta vade)
    # auth_basic "MonitraNG Admin Tools - Team Access Only";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # ============================================
    # Root - Admin Dashboard (Simple HTML)
    # ============================================
    location = / {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        root /var/www/html;
        try_files /admin-dashboard.html =404;
    }

    # ============================================

    # ============================================
    # Portainer - Docker Container Management
    # ============================================
    location /portainer/ {
        # Disable Basic Auth for Portainer (it has its own authentication)
        auth_basic off;
        
        proxy_pass http://portainer:9000/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # RabbitMQ Management UI
    # ============================================
    location /rabbitmq/ {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        # RabbitMQ Management UI path rewrite
        rewrite ^/rabbitmq$ /rabbitmq/ permanent;
        rewrite ^/rabbitmq/(.*)$ /$1 break;
        
        proxy_pass http://rabbitmq:15672;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Seq - Centralized Logging
    # ============================================
    location /seq/ {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        proxy_pass http://seq:80/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Mongo Express - MongoDB Web Admin
    # ============================================
    # Static files (CSS, JS) - must be before main location
    location /mongo/public/ {
        auth_basic off;
        proxy_pass http://mongo_express:8081/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /mongo/ {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        # Mongo Express path rewrite
        rewrite ^/mongo$ /mongo/ permanent;
        rewrite ^/mongo/(.*)$ /$1 break;
        
        # Mongo Express Basic Auth bypass - always send default credentials
        # Mongo Express default: admin:pass (if Basic Auth is enabled)
        # Remove any existing Authorization header and set default
        proxy_set_header Authorization "Basic YWRtaW46cGFzcw==";  # admin:pass base64 encoded
        
        proxy_pass http://mongo_express:8081;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Fix CSS/JS paths in HTML - replace /public/ with /mongo/public/
        sub_filter '/public/' '/mongo/public/';
        sub_filter_once off;
        sub_filter_types text/html;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Redis Commander - Redis Management UI
    # ============================================
    location /redis/ {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        # Redis Commander path rewrite
        rewrite ^/redis$ /redis/ permanent;
        rewrite ^/redis/(.*)$ /$1 break;
        
        proxy_pass http://redis-commander:8081;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Node-RED - Flow-based Automation
    # ============================================
    # Static files (vendor, red, icons) - must be before main location
    location ~ ^/nodered/(vendor|red|icons|ui_base)/ {
        auth_basic off;
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 5s;
        set $nodered_upstream nodered;
        proxy_pass http://$nodered_upstream:1880/$1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    location /nodered/ {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        # Use Docker embedded DNS for service name resolution at runtime
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 5s;
        set $nodered_upstream nodered;
        proxy_pass http://$nodered_upstream:1880/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Fix static file paths in HTML - replace /vendor/, /red/, etc. with /nodered/vendor/, /nodered/red/
        sub_filter 'src="/vendor/' 'src="/nodered/vendor/';
        sub_filter 'src="/red/' 'src="/nodered/red/';
        sub_filter 'href="/icons/' 'href="/nodered/icons/';
        sub_filter_once off;
        sub_filter_types text/html;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Keycloak - Identity and Access Management
    # ============================================
    location /keycloak/ {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        # Keycloak path rewrite
        rewrite ^/keycloak$ /keycloak/ permanent;
        rewrite ^/keycloak/(.*)$ /$1 break;
        
        proxy_pass http://keycloak:8080/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Server $host;
        
        # Fix Keycloak redirects - add /keycloak/ prefix to redirects
        proxy_redirect http://$host/ /keycloak/;
        proxy_redirect https://$host/ /keycloak/;
        proxy_redirect / /keycloak/;
        proxy_redirect /admin/ /keycloak/admin/;
        proxy_redirect /realms/ /keycloak/realms/;
        
        # WebSocket support (Keycloak uses WebSockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # MinIO Console - Object Storage Management
    # ============================================
    location /minio/ {
        # Basic Auth devre dışı (geçici - 7 Ocak 2026)
        auth_basic off;
        
        # MinIO Console path rewrite
        rewrite ^/minio$ /minio/ permanent;
        rewrite ^/minio/(.*)$ /$1 break;
        
        proxy_pass http://minio:9091/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Fix MinIO base href and static file paths
        sub_filter '<base href="/"/>' '<base href="/minio/"/>';
        sub_filter 'href="./' 'href="./minio/';
        sub_filter 'src="./' 'src="./minio/';
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript;
        
        # WebSocket support (MinIO Console uses WebSockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

