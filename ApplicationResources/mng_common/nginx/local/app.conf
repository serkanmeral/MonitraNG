# MonitraNG uygulaması. Kendinden imzalı sertifika, HSTS yok.
# https://app.ankarabt.com
# İstekler mngui nginx'ine gider; /api ve /hub oradan servislere dağılır.

server {
    listen 80;
    listen [::]:80;
    server_name app.ankarabt.com;
    return 301 https://app.ankarabt.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.ankarabt.com 192.168.1.249 abtserver;

    ssl_certificate /etc/nginx/certs/abtserver.crt;
    ssl_certificate_key /etc/nginx/certs/abtserver.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 100m;

    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    location / {
        set $ui_upstream mngui;
        proxy_pass http://$ui_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
