services:
  # Keycloak Identity Management
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.3
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_PROXY: edge
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - mng_network
    restart: unless-stopped

  # PostgreSQL for Keycloak
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mng_network
    restart: unless-stopped

  # MongoDB 7.0
  mongo:
    image: mongo:7.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: mngkeeper
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - mng_network
    restart: unless-stopped

  # MongoDB Express (Web UI)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: mongo_express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    networks:
      - mng_network
    restart: unless-stopped

  # Redis (Caching & Session Store)
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass redis123 --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mng_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Commander (Redis GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis123
    ports:
      - "8001:8081"
    networks:
      - mng_network
    restart: unless-stopped
    depends_on:
      - redis

  # RabbitMQ (Message Queue)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - mng_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"      # MQTT
      - "9001:9001"      # WebSockets
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - mng_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "test", "-m", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO (S3-Compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9090:9000"      # MinIO API
      - "9091:9091"      # MinIO Console
    volumes:
      - minio_data:/data
    networks:
      - mng_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Portainer (Container Management)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - mng_network
    restart: unless-stopped

  # Seq (Logging)
  seq:
    image: datalust/seq:latest
    container_name: seq
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=admin123
    volumes:
      - seq_data:/data
    networks:
      - mng_network
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    ports:
      - "1880:1880"
    volumes:
      - ./data:/data
    environment:
      - NODE_RED_USERNAME=admin
      - NODE_RED_PASSWORD=password
      - TZ=Europe/Istanbul
    restart: always    
    networks:
      - mng_network

  # PostgreSQL for GitLab
  gitlab-postgres:
    image: postgres:16-alpine
    container_name: gitlab-postgres
    environment:
      POSTGRES_DB: gitlab
      POSTGRES_USER: gitlab
      POSTGRES_PASSWORD: gitlab123
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - gitlab_postgres_data:/var/lib/postgresql/data
    networks:
      - mng_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitlab"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for GitLab
  gitlab-redis:
    image: redis:7-alpine
    container_name: gitlab-redis
    command: redis-server --requirepass gitlab123 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - gitlab_redis_data:/data
    networks:
      - mng_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # GitLab CE
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    hostname: gitlab.local
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://45.141.151.52:8090'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        postgresql['enable'] = false
        gitlab_rails['db_adapter'] = 'postgresql'
        gitlab_rails['db_encoding'] = 'unicode'
        gitlab_rails['db_host'] = 'gitlab-postgres'
        gitlab_rails['db_port'] = 5432
        gitlab_rails['db_username'] = 'gitlab'
        gitlab_rails['db_password'] = 'gitlab123'
        gitlab_rails['db_database'] = 'gitlab'
        redis['enable'] = false
        gitlab_rails['redis_host'] = 'gitlab-redis'
        gitlab_rails['redis_port'] = 6379
        gitlab_rails['redis_password'] = 'gitlab123'
        gitlab_rails['redis_database'] = 0
        # Reduce memory usage
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 10
        # GitLab Pages configuration
        pages_external_url 'http://localhost'
        gitlab_pages['enable'] = true
        gitlab_pages['external_http'] = ['0.0.0.0:8090']
        pages_nginx['enable'] = true
        # Artifact size limit (100MB) - For Pages artifacts
        gitlab_rails['artifacts_max_size'] = 100.megabytes
        # Nginx client max body size (100MB) - For artifact uploads
        nginx['client_max_body_size'] = '100m'
        # GitLab Workhorse max request size (100MB) - For artifact uploads
        gitlab_workhorse['max_request_size'] = 100 * 1024 * 1024
        # GitLab Workhorse max filesize (100MB) - For artifact uploads
        gitlab_workhorse['max_filesize'] = 100 * 1024 * 1024
        # GitLab Rails receive max input size (100MB) - For HTTP push
        gitlab_rails['receive_max_input_size'] = 100.megabytes
        # Disable features to save resources (optional)
        # prometheus_monitoring['enable'] = false
        # grafana['enable'] = false
    ports:
      - "8090:80"           # HTTP
      - "443:443"         # HTTPS
      - "2222:22"         # SSH (mapped to 2222 to avoid conflict)
      # GitLab Pages ports removed - causing port conflict
      # - "8090:8090"       # GitLab Pages HTTP
      # - "8091:8091"       # GitLab Pages HTTPS
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    depends_on:
      - gitlab-postgres
      - gitlab-redis
    networks:
      - mng_network
    restart: unless-stopped
    shm_size: '256m'
    # Note: Resource limits removed for Windows compatibility
    # GitLab requires at least 4GB RAM. Ensure your system has sufficient resources.

  # GitLab Runner
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    network_mode: host  # Host network for external IP access
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitlab_runner_config:/etc/gitlab-runner
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    # networks:  # Removed - using network_mode: host instead
    #   - mng_network
    restart: unless-stopped
    depends_on:
      - gitlab
    # Note: Runner registration must be done manually after GitLab starts
    # docker exec -it gitlab-runner gitlab-runner register
    # Note: Runner URL must be set to GitLab IP (http://172.18.0.6 or http://45.141.151.52:8090)
    # when using network_mode: host, as hostname 'gitlab' won't resolve

  # MkDocs Documentation Server
  mkdocs:
    image: python:3.11
    container_name: mkdocs
    working_dir: /docs
    command: >
      sh -c "
        pip install -q -r requirements.txt &&
        mkdocs serve --dev-addr=0.0.0.0:8000
      "
    ports:
      - "8000:8000"
    volumes:
      - ../../docs:/docs
    networks:
      - mng_network
    restart: unless-stopped
    # Alternative: Use 'build' command instead of 'serve' for one-time builds
    # command: sh -c "pip install -q -r requirements.txt && mkdocs build"

networks:
  mng_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  seq_data:
  portainer_data:
  gitlab_postgres_data:
  gitlab_redis_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  gitlab_runner_config:
